services:
  mostanad-app:
    container_name: mostanad-app
    build: .
    expose:
      - "3000"
    ports:
      - "3000:3000"
    env_file:
      - .env
    environment:
      - DATABASE_URL=postgresql://mostanad_app:${POSTGRES_PASSWORD}@postgres:5432/mostanad_app?schema=public
      - REDIS_URL=redis://redis:6379
      - BACKEND_WS_URL=http://localhost:3000
    restart: always
    volumes:
      - ./src:/app/src
      - ./swagger.js:/app/swagger.js
      - ./uploads:/app/uploads
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
    command: sh ./start.sh

  catalog-worker:
    container_name: catalog-worker
    build: .
    env_file:
      - .env
    environment:
      - DATABASE_URL=postgresql://mostanad_app:${POSTGRES_PASSWORD}@postgres:5432/mostanad_app?schema=public
      - REDIS_URL=redis://redis:6379
      - BACKEND_WS_URL=http://mostanad-app:3000
    restart: always
    volumes:
      - ./src:/app/src
      - ./uploads:/app/uploads
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
      mostanad-app:
        condition: service_started
    command: node src/workers/catalogWorker.js

  label-worker:
    container_name: label-worker
    build: .
    env_file:
      - .env
    environment:
      - DATABASE_URL=postgresql://mostanad_app:${POSTGRES_PASSWORD}@postgres:5432/mostanad_app?schema=public
      - REDIS_URL=redis://redis:6379
      - BACKEND_WS_URL=http://mostanad-app:3000
    restart: always
    volumes:
      - ./src:/app/src
      - ./uploads:/app/uploads
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
      mostanad-app:
        condition: service_started
    command: node src/workers/labelWorker.js

  certificate-worker:
    container_name: certificate-worker
    build: .
    env_file:
      - .env
    environment:
      - DATABASE_URL=postgresql://mostanad_app:${POSTGRES_PASSWORD}@postgres:5432/mostanad_app?schema=public
      - REDIS_URL=redis://redis:6379
      - BACKEND_WS_URL=http://mostanad-app:3000
    restart: always
    volumes:
      - ./src:/app/src
      - ./uploads:/app/uploads
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
      mostanad-app:
        condition: service_started
    command: node src/workers/certificateWorker.js

  email-worker:
    container_name: email-worker
    build: .
    env_file:
      - .env
    environment:
      - DATABASE_URL=postgresql://mostanad_app:${POSTGRES_PASSWORD}@postgres:5432/mostanad_app?schema=public
      - REDIS_URL=redis://redis:6379
      - BACKEND_WS_URL=http://mostanad-app:3000
    restart: always
    volumes:
      - ./src:/app/src
      - ./uploads:/app/uploads
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
      mostanad-app:
        condition: service_started
    command: node src/workers/emailWorker.js

  postgres:
    image: postgres:18
    container_name: mostanad-db
    restart: always
    environment:
      POSTGRES_USER: mostanad_app
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: mostanad_app
    ports:
      - "5432:5432"
    volumes:
      - mostanad_postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mostanad_app -d mostanad_app"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  redis:
    image: redis:8
    container_name: mostanad-redis
    restart: always
    ports:
      - "6379:6379"
  pgweb:
    image: sosedoff/pgweb
    container_name: pgweb
    restart: always
    profiles:
      - dev-tools
    ports:
      - "8081:8081"
    environment:
      - DATABASE_URL=postgresql://mostanad_app:${POSTGRES_PASSWORD}@postgres:5432/mostanad_app?schema=public
      - PGWEB_AUTH_USER=${PGWEB_AUTH_USER}
      - PGWEB_AUTH_PASS=${PGWEB_AUTH_PASS}
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  mostanad_postgres_data:
