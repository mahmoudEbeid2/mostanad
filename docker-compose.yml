services:
  mostanad-app:
    container_name: mostanad-app
    build: .
    expose:
      - "3000"
    env_file:
      - .env
    environment:
      - DATABASE_URL=postgresql://mostanad_app:${POSTGRES_PASSWORD}@postgres:5432/mostanad_app?schema=public
      - REDIS_URL=redis://redis:6379
      - BACKEND_WS_URL=http://localhost:3000
      - PDF2HTMLEX_URL=http://pdf2htmlex:5000
    restart: always
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
    command: sh ./scripts/start.sh

  catalog-worker:
    container_name: catalog-worker
    build: .
    env_file:
      - .env
    environment:
      - DATABASE_URL=postgresql://mostanad_app:${POSTGRES_PASSWORD}@postgres:5432/mostanad_app?schema=public
      - REDIS_URL=redis://redis:6379
      - BACKEND_WS_URL=http://mostanad-app:3000
    restart: always
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
      mostanad-app:
        condition: service_started
    command: node src/workers/catalogWorker.js

  label-worker:
    container_name: label-worker
    build: .
    env_file:
      - .env
    environment:
      - DATABASE_URL=postgresql://mostanad_app:${POSTGRES_PASSWORD}@postgres:5432/mostanad_app?schema=public
      - REDIS_URL=redis://redis:6379
      - BACKEND_WS_URL=http://mostanad-app:3000
    restart: always
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
      mostanad-app:
        condition: service_started
    command: node src/workers/labelWorker.js

  certificate-worker:
    container_name: certificate-worker
    build: .
    env_file:
      - .env
    environment:
      - DATABASE_URL=postgresql://mostanad_app:${POSTGRES_PASSWORD}@postgres:5432/mostanad_app?schema=public
      - REDIS_URL=redis://redis:6379
      - BACKEND_WS_URL=http://mostanad-app:3000
      - PDF2HTMLEX_URL=http://pdf2htmlex:5000
    restart: always
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
      mostanad-app:
        condition: service_started
    command: node src/workers/certificateWorker.js

  eda-worker:
    container_name: eda-worker
    build: .
    env_file:
      - .env
    environment:
      - DATABASE_URL=postgresql://mostanad_app:${POSTGRES_PASSWORD}@postgres:5432/mostanad_app?schema=public
      - REDIS_URL=redis://redis:6379
      - BACKEND_WS_URL=http://mostanad-app:3000
    restart: always
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
      mostanad-app:
        condition: service_started
    command: node src/workers/edaRequirementWorker.js

  reference-label-worker:
    container_name: reference-label-worker
    build: .
    env_file:
      - .env
    environment:
      - DATABASE_URL=postgresql://mostanad_app:${POSTGRES_PASSWORD}@postgres:5432/mostanad_app?schema=public
      - REDIS_URL=redis://redis:6379
      - BACKEND_WS_URL=http://mostanad-app:3000
    restart: always
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
      mostanad-app:
        condition: service_started
    command: node src/workers/referenceLabelWorker.js

  ai-template-worker:
    container_name: ai-template-worker
    build: .
    env_file:
      - .env
    environment:
      - DATABASE_URL=postgresql://mostanad_app:${POSTGRES_PASSWORD}@postgres:5432/mostanad_app?schema=public
      - REDIS_URL=redis://redis:6379
      - BACKEND_WS_URL=http://mostanad-app:3000
      - NODE_OPTIONS=--dns-result-order=ipv4first
    restart: always
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
      mostanad-app:
        condition: service_started
    command: node src/workers/aiTemplateWorker.js

  email-worker:
    container_name: email-worker
    build: .
    env_file:
      - .env
    environment:
      - DATABASE_URL=postgresql://mostanad_app:${POSTGRES_PASSWORD}@postgres:5432/mostanad_app?schema=public
      - REDIS_URL=redis://redis:6379
      - BACKEND_WS_URL=http://mostanad-app:3000
    restart: always
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
      mostanad-app:
        condition: service_started
    command: node src/workers/emailWorker.js

  label-generator-worker:
    container_name: label-generator-worker
    build: .
    env_file:
      - .env
    environment:
      - DATABASE_URL=postgresql://mostanad_app:${POSTGRES_PASSWORD}@postgres:5432/mostanad_app?schema=public
      - REDIS_URL=redis://redis:6379
      - BACKEND_WS_URL=http://mostanad-app:3000
    restart: always
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
      mostanad-app:
        condition: service_started
    command: node src/workers/labelGeneratorWorker.js

  certificate-template-worker:
    container_name: certificate-template-worker
    build: .
    env_file:
      - .env
    environment:
      - DATABASE_URL=postgresql://mostanad_app:${POSTGRES_PASSWORD}@postgres:5432/mostanad_app?schema=public
      - REDIS_URL=redis://redis:6379
      - BACKEND_WS_URL=http://mostanad-app:3000
      - PDF2HTMLEX_URL=http://pdf2htmlex:5000
    restart: always
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
      mostanad-app:
        condition: service_started
      pdf2htmlex:
        condition: service_started
    command: node src/workers/certificateTemplateWorker.js

  # Certificates V2 (plan §5.2): generation now; PDF/ZIP export in Phase 5.
  certificate-render-worker:
    container_name: certificate-render-worker
    build: .
    env_file:
      - .env
    environment:
      - DATABASE_URL=postgresql://mostanad_app:${POSTGRES_PASSWORD}@postgres:5432/mostanad_app?schema=public
      - REDIS_URL=redis://redis:6379
      - BACKEND_WS_URL=http://mostanad-app:3000
    restart: always
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
      mostanad-app:
        condition: service_started
    command: node src/workers/certificateRenderWorker.js

  invoice-worker:
    container_name: invoice-worker
    build: .
    env_file:
      - .env
    environment:
      - DATABASE_URL=postgresql://mostanad_app:${POSTGRES_PASSWORD}@postgres:5432/mostanad_app?schema=public
      - REDIS_URL=redis://redis:6379
      - BACKEND_WS_URL=http://mostanad-app:3000
    restart: always
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
      mostanad-app:
        condition: service_started
    command: node src/workers/invoiceWorker.js

  # Certificates V2: .ai/.pdf -> HTML converter (see CERTIFICATES_V2_PLAN.md §5).
  # Own Ubuntu image: pdf2htmlEX cannot run on the app's Alpine image.
  pdf2htmlex:
    container_name: pdf2htmlex
    build: ./docker/pdf2htmlex
    restart: always
    expose:
      - "5000"

  postgres:
    image: postgres:18
    container_name: mostanad-db
    restart: always
    environment:
      POSTGRES_USER: mostanad_app
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: mostanad_app
    volumes:
      - mostanad_postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mostanad_app -d mostanad_app"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  redis:
    image: redis:8
    container_name: mostanad-redis
    restart: always

volumes:
  mostanad_postgres_data:
