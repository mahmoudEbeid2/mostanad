version: '3.8'

services:
  traefik:
    image: traefik:v2.10
    container_name: traefik
    command:
      - "--api.insecure=false"
      - "--providers.docker=true"
      - "--providers.docker.exposedbydefault=false"
      - "--entrypoints.web.address=:80"
      - "--entrypoints.websecure.address=:443"
      # Redirect HTTP to HTTPS
      - "--entrypoints.web.http.redirections.entryPoint.to=websecure"
      - "--entrypoints.web.http.redirections.entryPoint.scheme=https"
      # Let's Encrypt configuration
      - "--certificatesresolvers.myresolver.acme.tlschallenge=true"
      - "--certificatesresolvers.myresolver.acme.email=admin@dossira.tech" # TODO: Change to real email
      - "--certificatesresolvers.myresolver.acme.storage=/letsencrypt/acme.json"
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - "/var/run/docker.sock:/var/run/docker.sock:ro"
      - "traefik-certificates:/letsencrypt"
    networks:
      - traefik_webgateway
    restart: always

  mostanad-app:
    container_name: mostanad-app
    build: .
    env_file:
      - .env
    environment:
      - DATABASE_URL=postgresql://mostanad_app:${POSTGRES_PASSWORD}@postgres:5432/mostanad_app?schema=public
      - REDIS_URL=redis://redis:6379
      - BACKEND_WS_URL=http://localhost:3000
    restart: always
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
    command: sh ./scripts/start.sh
    networks:
      - traefik_webgateway
      - internal
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.mostanad-api.rule=Host(`api.dossira.tech`)"
      - "traefik.http.routers.mostanad-api.entrypoints=websecure"
      - "traefik.http.routers.mostanad-api.tls.certresolver=myresolver"
      - "traefik.http.services.mostanad-api.loadbalancer.server.port=3000"

  catalog-worker:
    container_name: catalog-worker
    build: .
    env_file:
      - .env
    environment:
      - DATABASE_URL=postgresql://mostanad_app:${POSTGRES_PASSWORD}@postgres:5432/mostanad_app?schema=public
      - REDIS_URL=redis://redis:6379
      - BACKEND_WS_URL=http://mostanad-app:3000
    restart: always
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
      mostanad-app:
        condition: service_started
    command: node src/workers/catalogWorker.js
    networks:
      - internal

  label-worker:
    container_name: label-worker
    build: .
    env_file:
      - .env
    environment:
      - DATABASE_URL=postgresql://mostanad_app:${POSTGRES_PASSWORD}@postgres:5432/mostanad_app?schema=public
      - REDIS_URL=redis://redis:6379
      - BACKEND_WS_URL=http://mostanad-app:3000
    restart: always
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
      mostanad-app:
        condition: service_started
    command: node src/workers/labelWorker.js
    networks:
      - internal

  certificate-worker:
    container_name: certificate-worker
    build: .
    env_file:
      - .env
    environment:
      - DATABASE_URL=postgresql://mostanad_app:${POSTGRES_PASSWORD}@postgres:5432/mostanad_app?schema=public
      - REDIS_URL=redis://redis:6379
      - BACKEND_WS_URL=http://mostanad-app:3000
    restart: always
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
      mostanad-app:
        condition: service_started
    command: node src/workers/certificateWorker.js
    networks:
      - internal

  eda-worker:
    container_name: eda-worker
    build: .
    env_file:
      - .env
    environment:
      - DATABASE_URL=postgresql://mostanad_app:${POSTGRES_PASSWORD}@postgres:5432/mostanad_app?schema=public
      - REDIS_URL=redis://redis:6379
      - BACKEND_WS_URL=http://mostanad-app:3000
    restart: always
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
      mostanad-app:
        condition: service_started
    command: node src/workers/edaRequirementWorker.js
    networks:
      - internal

  ai-template-worker:
    container_name: ai-template-worker
    build: .
    env_file:
      - .env
    environment:
      - DATABASE_URL=postgresql://mostanad_app:${POSTGRES_PASSWORD}@postgres:5432/mostanad_app?schema=public
      - REDIS_URL=redis://redis:6379
      - BACKEND_WS_URL=http://mostanad-app:3000
      - NODE_OPTIONS=--dns-result-order=ipv4first
    restart: always
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
      mostanad-app:
        condition: service_started
    command: node src/workers/aiTemplateWorker.js
    networks:
      - internal

  email-worker:
    container_name: email-worker
    build: .
    env_file:
      - .env
    environment:
      - DATABASE_URL=postgresql://mostanad_app:${POSTGRES_PASSWORD}@postgres:5432/mostanad_app?schema=public
      - REDIS_URL=redis://redis:6379
      - BACKEND_WS_URL=http://mostanad-app:3000
    restart: always
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
      mostanad-app:
        condition: service_started
    command: node src/workers/emailWorker.js
    networks:
      - internal

  postgres:
    image: postgres:18
    container_name: mostanad-db
    restart: always
    environment:
      POSTGRES_USER: mostanad_app
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: mostanad_app
    volumes:
      - mostanad_postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mostanad_app -d mostanad_app"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - internal

  redis:
    image: redis:8
    container_name: mostanad-redis
    restart: always
    networks:
      - internal

volumes:
  mostanad_postgres_data:
  traefik-certificates:

networks:
  traefik_webgateway:
    name: traefik_webgateway
    driver: bridge
  internal:
    driver: bridge
