openapi: 3.0.0

info:
  title: Mostanad API
  version: 1.0.0
  description: |
    API for managing documents and users in the **Mostanad** application.

    ## Authentication
    This is an internal system. Authentication details will be added later.

servers:
  - url: http://localhost:3000/api/v1
    description: Development server

tags:
  - name: Users
    description: Internal system user management
  - name: Roles
    description: Role & permission management
  - name: Companies
    description: Company account management
  - name: Brands
    description: Product brands management
  - name: Dashboard
    description: Administrative system dashboard metrics
  - name: Plans
    description: SaaS Subscription Plan management
  - name: Products
    description: Product catalog management
  - name: Subscriptions
    description: Tenant subscription lifecycle management
  - name: Categories
    description: Product category management
  - name: Templates
    description: Document templates management
  - name: Label Verification
    description: AI-powered medicine and supplement label compliance verification
  - name: Authentication
    description: Internal user authentication and login
  - name: Certificates
    description: Product extraction from invoices and auto-populating certificate templates

paths:
  /auth/login:
    $ref: './paths/auth/auth.yaml'
  /users:
    $ref: './paths/users/users.yaml'
  /users/{id}:
    $ref: './paths/users/users-id.yaml'
  /roles:
    $ref: './paths/roles/roles.yaml'
  /roles/{id}:
    $ref: './paths/roles/roles-id.yaml'
  /companies:
    $ref: './paths/companies/companies.yaml'
  /companies/{id}:
    $ref: './paths/companies/companies-id.yaml'
  /companies/login:
    $ref: './paths/companies/login.yaml'
  /brands:
    $ref: './paths/brands/brands.yaml'
  /brands/{id}:
    $ref: './paths/brands/brands-id.yaml'
  /dashboard/stats:
    $ref: './paths/dashboard/dashboard.yaml'
  /products:
    $ref: './paths/products/products.yaml'
  /products/upload-catalog:
    $ref: './paths/products/catalog.yaml'
  /products/verify-label:
    $ref: './paths/products/verify-label.yaml'
  /products/{id}:
    $ref: './paths/products/products-id.yaml'
  /plans:
    $ref: './paths/plans/plans.yaml'
  /plans/{id}:
    $ref: './paths/plans/plans-id.yaml'
  /subscriptions:
    $ref: './paths/subscriptions/subscriptions.yaml'
  /subscriptions/{id}:
    $ref: './paths/subscriptions/subscriptions-id.yaml'
  /categories:
    $ref: './paths/categories/categories.yaml'
  /categories/{id}:
    $ref: './paths/categories/categories-id.yaml'
  /companies/{companyId}/templates:
    $ref: './paths/templates/templates.yaml'
  /templates/{id}:
    $ref: './paths/templates/templates-id.yaml'
  /companies/{companyId}/certificates/generate:
    $ref: './paths/certificates/certificates.yaml'
  /certificates/generate:
    $ref: './paths/certificates/certificates-token.yaml'

components:
  $ref: './components/components.yaml#/components'
