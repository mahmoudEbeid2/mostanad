openapi: 3.0.0

info:
  title: Mostanad API
  version: 1.0.0
  description: |
    API for managing documents and users in the **Mostanad** application.

    ## Authentication
    This is an internal system. Authentication details will be added later.

servers:
  - url: http://localhost:3000/api/v1
    description: Development server

security:
  - BearerAuth: []

tags:
  - name: Certificate Types
    description: Certificates V2
  - name: Certificate Templates
    description: Certificates V2
  - name: Template Versions
    description: Certificates V2
  - name: Catalogues
    description: Manufacturer catalogues kept as source documents (plan.md §15)
  - name: Invoices
    description: Certificates V2
  - name: Certificate Generation
    description: Certificates V2
  - name: Operations
    description: Certificates V2
  - name: Users
    description: Internal system user management
  - name: Roles
    description: Role & permission management
  - name: Companies
    description: Company account management
  - name: Brands
    description: Product brands management
  - name: Dashboard
    description: Administrative system dashboard metrics
  - name: Plans
    description: SaaS Subscription Plan management
  - name: Products
    description: Product catalog management
  - name: Subscriptions
    description: Tenant subscription lifecycle management
  - name: Categories
    description: Product category management
  - name: Label Verification
    description: AI-powered medicine and supplement label compliance verification
  - name: Authentication
    description: Internal user authentication and login
  - name: Background Tasks
    description: Poll long-running jobs (label generation, extraction, verification)
  - name: Generated Labels
    description: AI-generated veterinary/feed labels — persistence, listing, and the field-level patch protocol
  - name: Label Versions
    description: Append-only version history, diffing, and forward-only restore for a generated label
  - name: Label Validation
    description: The deterministic validation engine (schema, applicability, regulatory rule, and coherence layers)
  - name: Label Chat
    description: AI-assisted Q&A and editing agent for a generated label, with conflict detection
  - name: Label Approval
    description: The human signature workflow that promotes a label to a reusable reference
  - name: Regulatory Documents
    description: Ingested regulatory source documents (upload, extraction, coverage audit, approval)
  - name: Regulatory Rules
    description: Machine-compiled rules derived from approved regulatory documents
  - name: Reference Labels
    description: The style/content knowledge base used to ground label generation (AI-extracted, manual, or promoted from approvals)
  - name: Assurance
    description: Adversarial auditing, golden-set evaluation, and shadow-mode engine comparison
  - name: Review Inbox
    description: The single risk-sorted human review queue

