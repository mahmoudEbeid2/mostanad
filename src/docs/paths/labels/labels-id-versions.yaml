get:
  tags:
    - Label Versions
  summary: List a label's version history
  description: Full append-only version history, oldest first. Requires `read_labels`.
  parameters:
    - $ref: '../../components/components.yaml#/components/parameters/LabelId'
  responses:
    '200':
      description: Version history
      content:
        application/json:
          schema:
            type: object
            properties:
              status:
                type: string
                example: "success"
              results:
                type: integer
              data:
                type: object
                properties:
                  versions:
                    type: array
                    items:
                      $ref: '../../components/components.yaml#/components/schemas/LabelVersion'
    '401':
      $ref: '../../components/components.yaml#/components/responses/UnauthorizedError'
    '404':
      $ref: '../../components/components.yaml#/components/responses/NotFoundError'
    '500':
      $ref: '../../components/components.yaml#/components/responses/ServerError'
