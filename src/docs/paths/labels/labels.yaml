get:
  tags:
    - Generated Labels
  summary: List generated labels
  description: >-
    Paginated list of generated labels. A company-authenticated caller is
    always scoped to its own tenant (the `companyId` query param is ignored
    for it); a system user may filter by `companyId` or omit it to see every
    tenant. Requires `read_labels`.
  parameters:
    - $ref: '../../components/components.yaml#/components/parameters/PageParam'
    - $ref: '../../components/components.yaml#/components/parameters/LimitParam'
    - name: productId
      in: query
      required: false
      description: Filter by product UUID
      schema:
        type: string
        format: uuid
    - name: companyId
      in: query
      required: false
      description: System-user callers only — filter to one tenant. Ignored for a company-authenticated caller (always scoped to its own id).
      schema:
        type: string
        format: uuid
  responses:
    '200':
      description: Paginated label list
      content:
        application/json:
          schema:
            type: object
            properties:
              status:
                type: string
                example: "success"
              results:
                type: integer
                example: 20
              total:
                type: integer
                example: 143
              data:
                type: object
                properties:
                  labels:
                    type: array
                    items:
                      $ref: '../../components/components.yaml#/components/schemas/LabelSummary'
    '401':
      $ref: '../../components/components.yaml#/components/responses/UnauthorizedError'
    '403':
      $ref: '../../components/components.yaml#/components/responses/ForbiddenError'
    '500':
      $ref: '../../components/components.yaml#/components/responses/ServerError'
