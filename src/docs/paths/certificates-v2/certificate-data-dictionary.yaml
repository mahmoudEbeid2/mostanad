# /certificate-data-dictionary — certificate AI layers A0 (plan.md §3.2).
get:
  tags: ["Template Versions"]
  summary: Company data dictionary
  description: |
    Every addressable source path for the company and what its products actually contain. Built by code (no AI) on first use, after product changes (at most once per 10 minutes per company) and nightly.

    Entry: `{ path, root, type (string|number|boolean|list|collection), coverage (0–1; null for invoice/company paths), distinct, examples (≤ 5, ≤ 60 chars), labels (key spellings seen), synonyms, source (schema|observed), label, pickable }`.
    Spellings of the same key (`pH`, `PH`) are one entry. A list of objects is a `collection` entry (`product.activeIngredients[]`, with `keyField` and `keyValues`) plus pickable `[name="…"]` paths. Never contains another company's data.

    Permission: `read_certificate_templates`. A system user passes `?companyId=` (required).
  parameters:
    - $ref: "./_shared.yaml#/parameters/CompanyId"
  responses:
    "200":
      description: "`{ dictionary: { version, builtAt, productCount, entries[] } }`"
      content:
        application/json:
          schema: { type: object, additionalProperties: true }
    "400": { description: System user without companyId }
    "401": { $ref: "./_shared.yaml#/responses/E401" }
    "403": { $ref: "./_shared.yaml#/responses/E403" }
