# /invoices/{id}/data-needs — certificate AI layers A2 (plan.md §6.1, §6.2): the certificate data check.
get:
  tags: ["Invoices"]
  summary: The certificate data check, as last computed (no AI)
  description: |
    Check: `{ summary: { certificates, values, ready, resolved, resolvedAi, provided, needsConfirmation, missing, notApplicable, blocking }, certificates: [{ planKey, templateVersionId, templateName, typeCode, typeName, scope, lineNos, invoiceItemId, productName, batchNo, needs: [Need] }], batchData: [{ invoiceItemId, lineNo, productName, batchNo, fields: [{ labelKey, label, needIds, required, value, status }] }], unassigned, computedAt }`.
    Need: `{ id, fieldKey, label, category, required, status: resolved|resolved_ai|needs_confirmation|missing|provided|not_applicable, value, display, provenance, suggestionId, decidedAt }`.
    provenance.kind: `path` (+ `via: "synonym"`), `static`, `today`, `template`, `invoice_text` (`quote, page, start, end` — offsets in the stored invoice text), `product_path` (+ `nearMiss: { canonical, alternative }`), `product_json_text` (`path, quote`), `manual`. AI values also carry `suggestionId, confidence, note`.
    Permission: `read_invoices`. Tenant-scoped (another company's invoice → 404).
  parameters:
    - $ref: "./_shared.yaml#/parameters/Id"
    - $ref: "./_shared.yaml#/parameters/CompanyId"
  responses:
    "200": { description: "`{ check }`", content: { application/json: { schema: { type: object, additionalProperties: true } } } }
    "404": { $ref: "./_shared.yaml#/responses/E404" }
    "401": { $ref: "./_shared.yaml#/responses/E401" }
    "403": { $ref: "./_shared.yaml#/responses/E403" }
post:
  tags: ["Invoices"]
  summary: Compute the check (code), then ONE AI call for gaps not asked before
  description: |
    For every planned certificate × template field: code resolves it from the field's source (and accepted path synonyms) → `resolved`; empty → `missing` (required) / `not_applicable`. Then one `CERT_INVOICE_GAPS` call for every `missing` value not asked with the same basis before (0 calls when there is none). The model may only point at evidence; the server verifies it word for word (normalised): a quote of the stored invoice text containing the value — for line-level values inside THAT line's row (anywhere for a single-line invoice), for header values outside every item row; a product path (the DB value is used, never the model's); or a quote inside a product text. Verified → `needs_confirmation` (or `resolved_ai` when the company turned auto-accept on and the confidence reaches the threshold); anything else stays `missing` and the refused suggestion is kept with `evidenceVerified: false`.
    Body `{ ai: false }` = code only. AI off, failing or over quota: the check is still returned with `ai.unavailable` + `ai.reason`; the gaps stay missing and are asked next time.
    A person's `provided` value and a verified AI value survive re-runs; a change of the field source, product or line resets them.
    A5 tier I (company setting `allowProductInference`, off by default): after the gap call, ONE `CERT_PRODUCT_INFER` call for missing product facts whose field policy allows inference. The model must quote the value from the product's own record, or name an allow-listed derivation (unit_conversion, select_from_list, join_list, normalize_case) that code re-runs and must reproduce; anything else is refused. Verified → status `inferred` (provenance `tier: "I"`), always confirmed by a person. Statuses `inferred` and `web_found` block generation like `needs_confirmation`. The view adds `summary.inferred`, `summary.webFound` and `tiers: { inference, web, webEligible }`.
    A6 tier C (plan.md §15.5) — order DB path → invoice → catalogue → inference → web. When code leaves a product-data value empty and the line's product is linked to a catalogue block (`product.catalogueRef`), code reads the field's section in THAT block (heading + product path or label; SPECIFICATIONS rows for specification fields; "Store …" sentences under PRECAUTIONS for storage) → status `catalogue_found` with provenance `{ tier: "C", kind: "catalogue_text", via: "code", catalogueVersionId, blockId, page, section, quote }`, confirmed by a person. The gap call also receives each product's block (`products[].catalogue { page, text }`) and may answer with evidence `catalogue_text { quote }`, verified against that product's block only (provenance `via: "gap_call"`); evidence ranks DB → invoice → product text → catalogue. Batch data, results, invoice values, dates and quantities NEVER come from a catalogue (code refuses such evidence too). A product value whose `fieldProvenance` marks it `estimated` and unconfirmed is not used: it comes back as `inferred` with provenance `{ tier: "I", kind: "product_estimate", estimated: true, path, basis, modelId, promptHash }` until a person accepts it. `summary.catalogueFound` counts tier-C values; `catalogue_found` blocks generation like `needs_confirmation`. A rejected catalogue/estimate value is not offered again.
    Permission: `update_invoices`. Invoice status review/ready/generated/partially_failed, else 409 INVOICE_NOT_REVIEWED.
  parameters:
    - $ref: "./_shared.yaml#/parameters/Id"
    - $ref: "./_shared.yaml#/parameters/CompanyId"
  requestBody:
    required: false
    content: { application/json: { schema: { type: object, properties: { ai: { type: boolean } } }, example: { ai: true } } }
  responses:
    "200": { description: "`{ check }` with `ai: { used, calls, asked, filled, rejected, unavailable?, reason? }`", content: { application/json: { schema: { type: object, additionalProperties: true } } } }
    "409": { description: INVOICE_NOT_REVIEWED }
    "404": { $ref: "./_shared.yaml#/responses/E404" }
    "401": { $ref: "./_shared.yaml#/responses/E401" }
    "403": { $ref: "./_shared.yaml#/responses/E403" }
patch:
  tags: ["Invoices"]
  summary: A person's decisions on the check
  description: |
    `decisions: [{ needId, action, value?, applyTo? }]`:
    `accept` — confirm a verified AI value (→ `resolved_ai`, suggestion `accepted`); 409 NOTHING_TO_ACCEPT otherwise.
    `edit` — the person's value (→ `provided`, provenance `manual`; an AI suggestion becomes `edited`/`accepted`). `applyTo: "line"` also sets every other open value of the same line with the same label ("use for all certificates of this product"). Dates are stored as ISO when unambiguous. Empty → 422 VALUE_REQUIRED.
    `reject` — the AI value is wrong (→ missing, suggestion `rejected`, not asked again).
    `reset` — forget the decision; recomputed (and asked again) by the next check.
    A5: `accept` also confirms `inferred` / `web_found` values; with `saveToProduct: true` the confirmed tier I/W value is written into the product field the template reads (the next invoice reads it by code), and a web fact's cache entry becomes `approved`. `reject` on a web fact marks its cache entry `rejected`.
    A6: `accept` with `saveToProduct: true` on a `catalogue_found` value writes it into the product AND records `product.fieldProvenance[path]` (tier C, block, page, quote, confirmedAt); on an estimated product value (`provenance.kind: "product_estimate"`) it confirms the estimate on the product (`fieldProvenance[path].confirmedAt`) — the value itself is unchanged. Either way the next invoice reads it by code.
    Permission: `update_invoices`. → `{ check }`.
  parameters:
    - $ref: "./_shared.yaml#/parameters/Id"
    - $ref: "./_shared.yaml#/parameters/CompanyId"
  requestBody:
    required: true
    content: { application/json: { schema: { type: object, additionalProperties: true }, example: { decisions: [{ needId: "uuid", action: "edit", value: "4.1", applyTo: "line" }] } } }
  responses:
    "200": { description: "`{ check }`", content: { application/json: { schema: { type: object, additionalProperties: true } } } }
    "409": { description: "NOTHING_TO_ACCEPT, NOTHING_TO_REJECT, INVOICE_NOT_REVIEWED" }
    "422": { description: VALUE_REQUIRED }
    "404": { $ref: "./_shared.yaml#/responses/E404" }
    "401": { $ref: "./_shared.yaml#/responses/E401" }
    "403": { $ref: "./_shared.yaml#/responses/E403" }
