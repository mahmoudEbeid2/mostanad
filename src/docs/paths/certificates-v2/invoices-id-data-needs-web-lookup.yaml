# /invoices/{id}/data-needs/web-lookup — certificate AI layers A5 (plan.md §14.3).
post:
  tags: ["Invoices"]
  summary: Look up missing product facts on the web (on request only)
  description: |
    Only when the company turned `allowWebLookup` on (off by default), only for missing values of fields whose inference policy allows the web (`product_facts_and_web`: product data — never lab results, batch, dates, quantities, invoice/document numbers), and only on a person's request (the check and the upload never call it).
    ONE `CERT_WEB_LOOKUP` call (Google-Search grounding) per product for all its missing web-eligible facts. Sent: product name, manufacturer, brand, origin, active ingredients, field labels — never the invoice, customer, prices or other tenants' data.
    The server fetches every cited page itself (http(s) only, no private/local addresses, 12 s, 3 MB, HTML/PDF) and accepts a value only when the quote is on the page with the value inside it, the page names the product AND its manufacturer or brand, and the source ranks: official registry / manufacturer / company allow-listed → accepted; distributor → accepted with a warning; anything else → rejected. Registration numbers: official registry only.
    Verified → status `web_found` (provenance `tier: "W"`, citations with url, finalUrl, quote, sourceType, warning?); always confirmed by a person. Every answer (found or not) is cached per company and product for 90 days in `external_knowledge_cache` (kind `cert_product_fact`) — the same fact on a later invoice costs 0 calls; a rejected one is not served again.
    → `{ check }` with `ai.web: { used, calls, fromCache, found, rejected, products, unavailable?, reason? }`. Permission: `update_invoices`.
  parameters:
    - $ref: "./_shared.yaml#/parameters/Id"
    - $ref: "./_shared.yaml#/parameters/CompanyId"
  responses:
    "200": { description: "`{ check }`", content: { application/json: { schema: { type: object, additionalProperties: true } } } }
    "409": { description: INVOICE_NOT_REVIEWED }
    "404": { $ref: "./_shared.yaml#/responses/E404" }
    "401": { $ref: "./_shared.yaml#/responses/E401" }
    "403": { $ref: "./_shared.yaml#/responses/E403" }
