get:
  tags:
    - Templates
  summary: Get template by ID
  description: Retrieve details of a single template by its UUID.
  parameters:
    - $ref: '../../components/components.yaml#/components/parameters/TemplateId'
  responses:
    '200':
      $ref: '../../components/components.yaml#/components/responses/TemplateResponse'
    '400':
      $ref: '../../components/components.yaml#/components/responses/BadRequestError'
    '404':
      $ref: '../../components/components.yaml#/components/responses/NotFoundError'
    '500':
      $ref: '../../components/components.yaml#/components/responses/ServerError'

patch:
  tags:
    - Templates
  summary: Update a template
  description: Update details of an existing template by its UUID. If updating type or brand, duplicate checks are performed.
  parameters:
    - $ref: '../../components/components.yaml#/components/parameters/TemplateId'
  requestBody:
    required: true
    content:
      application/json:
        schema:
          $ref: '../../components/components.yaml#/components/schemas/UpdateTemplateBody'
  responses:
    '200':
      $ref: '../../components/components.yaml#/components/responses/TemplateResponse'
    '400':
      $ref: '../../components/components.yaml#/components/responses/BadRequestError'
    '404':
      $ref: '../../components/components.yaml#/components/responses/NotFoundError'
    '500':
      $ref: '../../components/components.yaml#/components/responses/ServerError'

delete:
  tags:
    - Templates
  summary: Delete a template
  description: Hard delete a template by its UUID.
  parameters:
    - $ref: '../../components/components.yaml#/components/parameters/TemplateId'
  responses:
    '204':
      description: Template deleted successfully
    '400':
      $ref: '../../components/components.yaml#/components/responses/BadRequestError'
    '404':
      $ref: '../../components/components.yaml#/components/responses/NotFoundError'
    '500':
      $ref: '../../components/components.yaml#/components/responses/ServerError'
