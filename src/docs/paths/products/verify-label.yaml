post:
  tags:
    - Label Verification
  summary: General PDF or image drug label compliance verification
  description: Upload an animal feed, supplement, or veterinary drug PDF/image label. The system will upload it to the Gemini File API, extract the product metadata using Gemini, search the database globally (by exact name or active ingredient overlap) for matching/alternative products, verify compliance against the target country's drug regulatory requirements, and return the combined analysis.
  requestBody:
    required: true
    content:
      multipart/form-data:
        schema:
          type: object
          properties:
            label:
              type: string
              format: binary
              description: The PDF or image (PNG, JPEG, WebP) label file (max 15MB)
            country:
              type: string
              description: The target country to run the drug regulatory compliance check for
              example: "Saudi Arabia"
          required:
            - label
            - country
  responses:
    '200':
      description: Label successfully verified and compliance report generated
      content:
        application/json:
          schema:
            type: object
            properties:
              status:
                type: string
                example: "success"
              message:
                type: string
                example: "Label verified successfully!"
              data:
                type: object
                properties:
                  product:
                    type: object
                    properties:
                      extractedDetails:
                        type: object
                        description: Product metadata extracted from the label by Gemini AI
                      existsInDb:
                        type: boolean
                        example: true
                      isExactMatch:
                        type: boolean
                        example: true
                      dbProduct:
                        type: object
                        nullable: true
                        description: The matching database product if found, otherwise null
                  validation:
                    type: object
                    properties:
                      compliant:
                        type: boolean
                        example: false
                      checkedAgainstDb:
                        type: boolean
                        example: true
                      isExactMatch:
                        type: boolean
                        example: true
                      dbProductName:
                        type: string
                        nullable: true
                        example: "H-Viral"
                      country:
                        type: string
                        example: "Saudi Arabia"
                      results:
                        type: array
                        items:
                          type: object
                          properties:
                            category:
                              type: string
                              example: "regulatory"
                            issue:
                              type: string
                              example: "Missing bilingual Arabic/English warnings"
                            location:
                              type: string
                              nullable: true
                              example: "Active ingredients section"
                            solution:
                              type: string
                              example: "Translate all safety warning paragraphs into Arabic"
    '400':
      $ref: '../../components/components.yaml#/components/responses/BadRequestError'
    '404':
      $ref: '../../components/components.yaml#/components/responses/NotFoundError'
    '500':
      $ref: '../../components/components.yaml#/components/responses/ServerError'
