post:
  tags:
    - Label Verification
  summary: General PDF or image drug label compliance verification
  description: >-
    Upload an animal feed, supplement, or veterinary drug PDF/image label.
    The system extracts product metadata via Gemini, searches the database
    globally for matching/alternative products, and runs the same
    deterministic validation engine used by the label-generation pipeline
    (§4.2 engine unification) — **always with an empty ruleset**
    (`rulesetIds` is always `[]`; unlike `POST /labels/{id}/validate`, this
    endpoint is not country/rule aware yet). **Always asynchronous**: returns
    202 immediately with a `jobId`; poll `GET /background-tasks/{jobId}`
    (`pending` → `processing` → `completed`|`failed`) for the result. This
    replaces the old synchronous AI-judged shape this endpoint used to
    return directly — see API-CHANGES.md Phase 2.
  requestBody:
    required: true
    content:
      multipart/form-data:
        schema:
          type: object
          properties:
            label:
              type: string
              format: binary
              description: The PDF or image (PNG, JPEG, WebP) label file (max 15MB)
            country:
              type: string
              description: The target country to run the drug regulatory compliance check for
              example: "Saudi Arabia"
          required:
            - label
            - country
  responses:
    '202':
      description: Verification queued.
      content:
        application/json:
          schema:
            type: object
            properties:
              status:
                type: string
                example: "accepted"
              message:
                type: string
                example: "Label verification has been accepted and is processing in the background."
              data:
                type: object
                properties:
                  jobId:
                    type: string
                    format: uuid
                    description: Pass this as {id} to GET /background-tasks/{id}.
    '400':
      $ref: '../../components/components.yaml#/components/responses/BadRequestError'
    '401':
      $ref: '../../components/components.yaml#/components/responses/UnauthorizedError'
    '500':
      $ref: '../../components/components.yaml#/components/responses/ServerError'
  x-background-task-result:
    description: Shape of BackgroundTask.result once the polled task reports status "completed".
    schema:
      type: object
      properties:
        product:
          type: object
          properties:
            extractedDetails:
              type: object
              description: Product metadata extracted from the label by Gemini AI (partial labelSchema-conformant shape, not the old flat {name, category, productCode, ...} object).
            existsInDb:
              type: boolean
            isExactMatch:
              type: boolean
            dbProduct:
              type: object
              nullable: true
        validation:
          $ref: '../../components/components.yaml#/components/schemas/ValidationReport'
