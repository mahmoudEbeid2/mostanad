post:
  tags:
    - Label Verification
  summary: General PDF or image drug label compliance verification
  description: >-
    Upload an animal feed, supplement, or veterinary drug PDF/image label.
    The system extracts product metadata via Gemini, matches it against the
    caller's own products only (tenant-scoped weighted similarity — never a
    global search across tenants), and runs the same deterministic validation
    engine used by the label-generation pipeline (§4.2 engine unification),
    including the caller-country's approved regulatory ruleset if one exists.
    If no approved ruleset exists for the country, regulatory verdicts are
    `UNVERIFIABLE` (`validation.regulatoryStatus.status`), never silently
    treated as passing. Product matching returns one of three states, never
    a silent substitute: `matched` (high confidence, same product —
    `data_mismatch` verdicts are meaningful), `similar` (a different product;
    zero `data_mismatch` verdicts, surfaced only as information via
    `productMatchStatus`), or `none` (no candidate — regulations/coherence
    only). **Always asynchronous**: returns 202 immediately with
    a `jobId`; poll `GET /background-tasks/{jobId}` (`pending` → `processing`
    → `completed`|`failed`) for the result. This replaces the old synchronous
    AI-judged shape this endpoint used to return directly — see
    API-CHANGES.md Phase 2.
  requestBody:
    required: true
    content:
      multipart/form-data:
        schema:
          type: object
          properties:
            label:
              type: string
              format: binary
              description: The PDF or image (PNG, JPEG, WebP) label file (max 15MB)
            country:
              type: string
              description: The target country to run the drug regulatory compliance check for
              example: "Saudi Arabia"
          required:
            - label
            - country
  responses:
    '202':
      description: Verification queued.
      content:
        application/json:
          schema:
            type: object
            properties:
              status:
                type: string
                example: "accepted"
              message:
                type: string
                example: "Label verification has been accepted and is processing in the background."
              data:
                type: object
                properties:
                  jobId:
                    type: string
                    format: uuid
                    description: Pass this as {id} to GET /background-tasks/{id}.
    '400':
      $ref: '../../components/components.yaml#/components/responses/BadRequestError'
    '401':
      $ref: '../../components/components.yaml#/components/responses/UnauthorizedError'
    '500':
      $ref: '../../components/components.yaml#/components/responses/ServerError'
  x-background-task-result:
    description: Shape of BackgroundTask.result once the polled task reports status "completed".
    schema:
      type: object
      properties:
        regulatoryStatus:
          type: object
          description: Top-level, not buried under the detailed verdict list (§14.5.4).
          properties:
            status:
              type: string
              enum: [CHECKED, UNVERIFIABLE]
            rulesetCount:
              type: integer
            message:
              type: string
              nullable: true
        productMatchStatus:
          type: object
          description: The state, the candidate, and the score — so the UI can show the match and let the user correct it (§14.5.1 item 4).
          properties:
            state:
              type: string
              enum: [matched, similar, none]
            tier:
              type: string
              description: The similarity.js tier that produced this state, e.g. "name_exact", "exact_combo", "ingredient", "attribute", "style_only", "none".
            score:
              type: number
              description: The weighted-similarity finalScore (0-1) behind the match, for the UI to show alongside the candidate.
            candidate:
              type: object
              nullable: true
              description: The matched/similar product row, or null for "none". Same object as product.dbProduct.
            message:
              type: string
              nullable: true
              description: Set for "similar" ("closest match, not the same product") and "none" ("no matching product found"); null for "matched".
        product:
          type: object
          properties:
            extractedDetails:
              type: object
              description: Product metadata extracted from the label by Gemini AI (partial labelSchema-conformant shape, not the old flat {name, category, productCode, ...} object).
            existsInDb:
              type: boolean
            isExactMatch:
              type: boolean
            matchState:
              type: string
              enum: [matched, similar, none]
            dbProduct:
              type: object
              nullable: true
        validation:
          $ref: '../../components/components.yaml#/components/schemas/ValidationReport'
