post:
  tags:
    - Label Verification
  summary: Verify PDF or image drug label compliance and extract details
  description: Upload an animal feed, supplement, or veterinary drug PDF/image label. The system will upload it to the Gemini File API, extract the product metadata using Gemini 2.5 Flash, verify compliance against the target country's drug regulatory requirements, check the database for any product with a case-insensitive matching name under this company, and return the combined analysis.
  parameters:
    - name: companyId
      in: path
      required: true
      description: UUID of the company to scope the verification and check database records
      schema:
        type: string
        format: uuid
      example: "b2c3d4e5-f6a7-8901-bcde-f12345678901"
  requestBody:
    required: true
    content:
      multipart/form-data:
        schema:
          type: object
          properties:
            label:
              type: string
              format: binary
              description: The PDF or image (PNG, JPEG, WebP) label file (max 15MB)
            country:
              type: string
              description: The target country to run the drug regulatory compliance check for
              example: "Saudi Arabia"
          required:
            - label
            - country
  responses:
    '200':
      description: Label successfully verified and compliance report generated
      content:
        application/json:
          schema:
            type: object
            properties:
              status:
                type: string
                example: "success"
              message:
                type: string
                example: "Label verified successfully!"
              data:
                type: object
                properties:
                  product:
                    type: object
                    properties:
                      extractedDetails:
                        type: object
                        description: Product metadata extracted from the label by Gemini AI
                      existsInDb:
                        type: boolean
                        example: true
                      dbProduct:
                        type: object
                        nullable: true
                        description: The matching database product if found, otherwise null
                  validation:
                    type: object
                    properties:
                      compliant:
                        type: boolean
                        example: false
                      country:
                        type: string
                        example: "Saudi Arabia"
                      results:
                        type: array
                        items:
                          type: object
                          properties:
                            issue:
                              type: string
                              example: "Missing bilingual Arabic/English warnings"
                            solution:
                              type: string
                              example: "Translate all safety warning paragraphs into Arabic"
    '400':
      $ref: '../../components/components.yaml#/components/responses/BadRequestError'
    '404':
      $ref: '../../components/components.yaml#/components/responses/NotFoundError'
    '500':
      $ref: '../../components/components.yaml#/components/responses/ServerError'
