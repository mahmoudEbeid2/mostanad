# /catalogue-versions/{id} (plan.md §15.3, A6.1).
get:
  tags: ["Catalogues"]
  summary: A catalogue version and its blocks
  description: |
    { version }: the version (label, status, pages, warnings, numberConvention, extraction, catalogue { manufacturer }) and `blocks` in reading order — { id, seq, kind: product|context, page, bbox { x, y, w, h } (PDF points, top-left origin), title (the large-font title code found; null when drawn as artwork), text (what every quote is verified against; the cells of one printed line are tab-separated), status, productId, extracted }. Line geometry is on GET /catalogue-blocks/{id}. Permission: read_products.
    After extraction (A6.3) a product block's `extracted` is { isProduct, record { name, productCode, physicalForm, subtitle, indications, description, dosage, mixingInstructions, withdrawalPeriod, storage, packaging, contraindications, appearance, registrationNumber, targetSpecies[], userSafety[], compositionBasis, activeIngredients [{ name, amountRaw, concentration, amount, unit, basis, readAs? }], specifications [{ item, specRaw }], producer, origin }, quotes { field: { quote, start, end } | [..] } (offsets into text), estimated { field: { value, basis, modelId, promptHash, at } }, flags [{ code: unverified | placeholder_amount | ambiguous_number | amount_exceeds_basis | unreadable_number | duplicate_code | estimated_withdrawal | convention_conflict | no_name | no_ai_answer | not_a_product, field?, ingredient?, message }], category { proposal, existingCategoryId, existingName }, convention { dotGroup3, source: admin|block|majority }, modelId, promptHash, extractedAt }.
  parameters:
    - $ref: "../certificates-v2/_shared.yaml#/parameters/Id"
    - $ref: "../certificates-v2/_shared.yaml#/parameters/CompanyId"
  responses:
    "200": { description: "OK", content: { application/json: { schema: { type: object, additionalProperties: true } } } }
    "404": { $ref: "../certificates-v2/_shared.yaml#/responses/E404" }
    "401": { $ref: "../certificates-v2/_shared.yaml#/responses/E401" }
    "403": { $ref: "../certificates-v2/_shared.yaml#/responses/E403" }
