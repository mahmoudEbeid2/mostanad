# /catalogues/{id}/versions (plan.md §15.4, A6.1).
post:
  tags: ["Catalogues"]
  summary: Upload a newer file of an existing catalogue
  description: "Multipart file (PDF) + label. Same processing as POST /catalogues; the diff against the previous version is §15.4. → 201 { catalogueId, versionId, status, pageCount }. Permission: manage_catalogues."
  parameters:
    - $ref: "../certificates-v2/_shared.yaml#/parameters/Id"
    - $ref: "../certificates-v2/_shared.yaml#/parameters/CompanyId"
  requestBody:
    required: true
    content:
      multipart/form-data:
        schema: { type: object, required: [file], properties: { file: { type: string, format: binary }, label: { type: string, maxLength: 80 } } }
  responses:
    "201": { description: "{ catalogueId, versionId, status, pageCount }", content: { application/json: { schema: { type: object, additionalProperties: true } } } }
    "404": { $ref: "../certificates-v2/_shared.yaml#/responses/E404" }
    "401": { $ref: "../certificates-v2/_shared.yaml#/responses/E401" }
    "403": { $ref: "../certificates-v2/_shared.yaml#/responses/E403" }
