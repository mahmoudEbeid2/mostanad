# /catalogue-versions/{id}/file (plan.md §15.7, A6.1).
get:
  tags: ["Catalogues"]
  summary: The kept catalogue PDF
  description: "Streams the original file (application/pdf, inline). Permission: read_products."
  parameters:
    - $ref: "../certificates-v2/_shared.yaml#/parameters/Id"
    - $ref: "../certificates-v2/_shared.yaml#/parameters/CompanyId"
  responses:
    "200": { description: The PDF, content: { application/pdf: { schema: { type: string, format: binary } } } }
    "404": { $ref: "../certificates-v2/_shared.yaml#/responses/E404" }
    "401": { $ref: "../certificates-v2/_shared.yaml#/responses/E401" }
    "403": { $ref: "../certificates-v2/_shared.yaml#/responses/E403" }
