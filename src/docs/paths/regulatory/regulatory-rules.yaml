get:
  tags:
    - Regulatory Rules
  summary: List regulatory rules
  description: Requires `read_regulatory`.
  parameters:
    - $ref: '../../components/components.yaml#/components/parameters/PageParam'
    - $ref: '../../components/components.yaml#/components/parameters/LimitParam'
    - name: documentId
      in: query
      required: false
      schema:
        type: string
        format: uuid
    - name: ruleType
      in: query
      required: false
      schema:
        type: string
        enum: [required_field, forbidden_content, format, conditional, value_constraint, language_set, semantic]
    - name: severity
      in: query
      required: false
      schema:
        type: string
        enum: [error, warning, info]
    - name: status
      in: query
      required: false
      schema:
        type: string
        enum: [pending_review, approved, rejected]
  responses:
    '200':
      description: Rule list.
      content:
        application/json:
          schema:
            type: object
            properties:
              status:
                type: string
                example: "success"
              results:
                type: integer
              total:
                type: integer
              data:
                type: object
                properties:
                  rules:
                    type: array
                    items:
                      $ref: '../../components/components.yaml#/components/schemas/RegulatoryRule'
    '401':
      $ref: '../../components/components.yaml#/components/responses/UnauthorizedError'
    '500':
      $ref: '../../components/components.yaml#/components/responses/ServerError'
