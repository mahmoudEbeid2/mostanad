get:
  tags:
    - Assurance
  summary: List auditor/engine disagreements
  description: Requires `read_assurance`.
  parameters:
    - $ref: '../../components/components.yaml#/components/parameters/PageParam'
    - $ref: '../../components/components.yaml#/components/parameters/LimitParam'
    - name: labelId
      in: query
      required: false
      schema:
        type: string
        format: uuid
    - name: resolution
      in: query
      required: false
      schema:
        type: string
        enum: [human_agreed_engine, human_agreed_auditor, new_rule_created]
  responses:
    '200':
      description: Disagreement list.
      content:
        application/json:
          schema:
            type: object
            properties:
              status:
                type: string
                example: "success"
              results:
                type: integer
              total:
                type: integer
              data:
                type: object
                properties:
                  disagreements:
                    type: array
                    items:
                      $ref: '../../components/components.yaml#/components/schemas/AuditDisagreement'
    '401':
      $ref: '../../components/components.yaml#/components/responses/UnauthorizedError'
    '500':
      $ref: '../../components/components.yaml#/components/responses/ServerError'
