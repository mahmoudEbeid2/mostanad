get:
  tags:
    - Subscriptions
  summary: Get all subscriptions
  description: Retrieve a list of subscriptions with support for pagination, sorting, and exact filtering by companyId, planId, and status.
  parameters:
    - $ref: '../../components/components.yaml#/components/parameters/PageParam'
    - $ref: '../../components/components.yaml#/components/parameters/LimitParam'
    - $ref: '../../components/components.yaml#/components/parameters/SortParam'
    - name: companyId
      in: query
      required: false
      description: Filter by company ID
      schema:
        type: string
        format: uuid
      example: "b2c3d4e5-f6a7-8901-bcde-f12345678901"
    - name: planId
      in: query
      required: false
      description: Filter by subscription plan ID
      schema:
        type: string
        format: uuid
      example: "c1b2c3d4-e5f6-7890-abcd-ef1234567890"
    - name: status
      in: query
      required: false
      description: Filter by subscription status
      schema:
        type: string
        enum: [active, expired, cancelled]
      example: "active"
  responses:
    '200':
      $ref: '../../components/components.yaml#/components/responses/SubscriptionsListResponse'
    '500':
      $ref: '../../components/components.yaml#/components/responses/ServerError'

post:
  tags:
    - Subscriptions
  summary: Create a new subscription
  description: Subscribe a company to a SaaS plan. If status is "active", it automatically cancels other active subscriptions for this company.
  requestBody:
    required: true
    content:
      application/json:
        schema:
          $ref: '../../components/components.yaml#/components/schemas/CreateSubscriptionBody'
  responses:
    '201':
      $ref: '../../components/components.yaml#/components/responses/SubscriptionResponse'
    '400':
      $ref: '../../components/components.yaml#/components/responses/BadRequestError'
    '404':
      $ref: '../../components/components.yaml#/components/responses/NotFoundError'
    '500':
      $ref: '../../components/components.yaml#/components/responses/ServerError'
