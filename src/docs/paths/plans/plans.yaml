get:
  tags:
    - Plans
  summary: Get all plans
  description: Retrieve a paginated list of all active plans. Supports filtering, searching, and sorting.
  parameters:
    - $ref: '../../components/components.yaml#/components/parameters/PageParam'
    - $ref: '../../components/components.yaml#/components/parameters/LimitParam'
    - $ref: '../../components/components.yaml#/components/parameters/SortParam'
    - $ref: '../../components/components.yaml#/components/parameters/SearchParam'
    - name: isActive
      in: query
      required: false
      description: Filter by active status
      schema:
        type: boolean
      example: true
  responses:
    '200':
      $ref: '../../components/components.yaml#/components/responses/PlansListResponse'
    '500':
      $ref: '../../components/components.yaml#/components/responses/ServerError'

post:
  tags:
    - Plans
  summary: Create a new subscription plan
  description: Create a new SaaS subscription plan with a unique name, price, interval, and list of features.
  requestBody:
    required: true
    content:
      application/json:
        schema:
          $ref: '../../components/components.yaml#/components/schemas/CreatePlanBody'
  responses:
    '201':
      $ref: '../../components/components.yaml#/components/responses/PlanResponse'
    '400':
      $ref: '../../components/components.yaml#/components/responses/BadRequestError'
    '500':
      $ref: '../../components/components.yaml#/components/responses/ServerError'
