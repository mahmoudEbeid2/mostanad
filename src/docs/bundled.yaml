    PatchConflict:
      type: object
      description: Returned with HTTP 409 when a proposed patch would introduce a NEW validation failure that didn't exist before the patch. The outer response envelope's `status` stays "success" — branch on this object's own `status` field, which is "conflict".
      properties:
        status:
          type: string
          enum:
            - conflict
        proposedPatch:
          type: object
          description: Only present on the chat conflict shape (not the direct PATCH conflict shape).
          properties:
            rationale:
              type: string
            changes:
              type: array
              items:
                $ref: '#/components/schemas/LabelPatchChange'
        wouldViolate:
          type: array
          items:
            type: object
            properties:
              ruleKey:
                type: string
                nullable: true
              message:
                type: string
              citation:
                type: string
                nullable: true
              path:
                type: string
        options:
          type: array
          items:
            type: string
          description: 'Plain strings, not objects: "cancel", one "apply_and_fix:<path>" per newly-failing path, then "apply_anyway_with_override" last.'
          example:
            - cancel
            - apply_and_fix:withdrawalPeriod
            - apply_anyway_with_override
