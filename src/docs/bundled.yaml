        '500':
          $ref: '#/components/responses/ServerError'
  /companies/{companyId}/certificates/generate:
    post:
      tags:
        - Certificates
      summary: Generate certificates by Company ID
      description: Upload an invoice (PDF/image) and populate global and product-scoped templates associated with the company ID.
      parameters:
        - name: companyId
          in: path
          required: true
          description: UUID of the company
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required:
                - invoice
                - transactionType
              properties:
                invoice:
                  type: string
                  format: binary
                  description: Invoice file (PDF or Image)
                brandId:
                  type: string
                  format: uuid
                  description: Optional brand ID filter
                transactionType:
                  type: string
                  enum:
                    - shipping
                    - registration
                  description: Transaction type
      responses:
        '200':
          description: Successfully generated certificates
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: success
                  data:
                    $ref: '#/components/schemas/GenerateCertificatesResponse'
        '400':
          $ref: '#/components/responses/BadRequestError'
        '404':
          $ref: '#/components/responses/NotFoundError'
  /certificates/generate:
    post:
      tags:
        - Certificates
      summary: Generate certificates (Authenticated Company)
      description: Upload an invoice (PDF/image) and populate templates. The company is identified by the Bearer token.
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required:
                - invoice
                - transactionType
              properties:
                invoice:
                  type: string
                  format: binary
                  description: Invoice file (PDF or Image)
                brandId:
                  type: string
                  format: uuid
                  description: Optional brand ID filter
                transactionType:
                  type: string
                  enum:
                    - shipping
                    - registration
                  description: Transaction type
      responses:
        '200':
          description: Successfully generated certificates
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: success
                  data:
                    $ref: '#/components/schemas/GenerateCertificatesResponse'
        '400':
          $ref: '#/components/responses/BadRequestError'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '404':
          $ref: '#/components/responses/NotFoundError'
components:
  schemas:
    LoginBody:
      type: object
      required:
        - username
        - password
      properties:
        username:
          type: string
          description: The user's username or email
          example: admin
        password:
          type: string
          description: The user's password
          example: securepassword123
    LoginResponseData:
      type: object
      properties:
        token:
          type: string
          example: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9...
        user:
          type: object
          properties:
            id:
              type: string
              format: uuid
            name:
              type: string
            username:
              type: string
            email:
              type: string
            phone:
              type: string
              nullable: true
            role:
              type: object
              properties:
                id:
                  type: string
                  format: uuid
                name:
                  type: string
                permissions:
                  type: array
                  items:
                    type: string
    User:
      type: object
      properties:
        id:
          type: string
          format: uuid
          example: a1b2c3d4-e5f6-7890-abcd-ef1234567890
        name:
          type: string
          example: Ahmed Mohamed
        email:
          type: string
          format: email
          example: ahmed@example.com
        username:
          type: string
          example: ahmed_m
        phone:
          type: string
          nullable: true
          example: '01012345678'
        isActive:
          type: boolean
          example: true
        createdAt:
          type: string
          format: date-time
          example: '2026-06-10T10:00:00.000Z'
        updatedAt:
          type: string
          format: date-time
          example: '2026-06-10T12:00:00.000Z'
    CreateUserBody:
      type: object
      required:
        - name
        - email
      properties:
        name:
          type: string
          minLength: 2
          maxLength: 100
          example: Ahmed Mohamed
        email:
          type: string
          format: email
          example: ahmed@example.com
        username:
          type: string
          minLength: 3
          maxLength: 30
          pattern: ^[a-zA-Z0-9_]+$
          example: ahmed_m
        password:
          type: string
          minLength: 6
          example: secret123
        phone:
          type: string
          nullable: true
          example: '01012345678'
    UpdateUserBody:
      type: object
      properties:
        name:
          type: string
          minLength: 2
          maxLength: 100
          example: Ahmed Updated
        email:
          type: string
          format: email
          example: updated@example.com
        username:
          type: string
          minLength: 3
          maxLength: 30
          example: ahmed_updated
        password:
          type: string
          minLength: 6
          example: newpassword123
        phone:
          type: string
          nullable: true
          example: '01098765432'
        isActive:
          type: boolean
          example: false
    Role:
      type: object
      properties:
        id:
          type: string
          format: uuid
          example: da688042-3c7e-4537-8b88-6c060d0cdf7a
        name:
          type: string
          example: Admin
        description:
          type: string
          nullable: true
          example: Super Administrator with full system permissions
        createdAt:
          type: string
          format: date-time
          example: '2026-06-10T10:00:00.000Z'
        updatedAt:
          type: string
          format: date-time
          example: '2026-06-10T12:00:00.000Z'
    CreateRoleBody:
      type: object
      required:
        - name
      properties:
        name:
          type: string
          minLength: 2
          maxLength: 50
          example: Manager
        description:
          type: string
          maxLength: 255
          example: Manager role with moderate permissions
        permissions:
          type: array
          items:
            type: string
            format: uuid
          example:
            - da688042-3c7e-4537-8b88-6c060d0cdf7a
        permissionSlugs:
          type: array
          items:
            type: string
          example:
            - create_users
            - read_users
    UpdateRoleBody:
      type: object
      properties:
        name:
          type: string
          minLength: 2
          maxLength: 50
          example: Senior Manager
        description:
          type: string
          maxLength: 255
          example: Updated manager role description
        permissions:
          type: array
          items:
            type: string
            format: uuid
        permissionSlugs:
          type: array
          items:
            type: string
    Company:
