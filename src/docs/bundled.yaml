  /labels/{id}:
    get:
      tags:
        - Generated Labels
      summary: Get a generated label
      description: Returns the full label record plus convenience fields. Requires `read_labels`. Cross-tenant access returns 404, never 403 — a label belonging to a different company is indistinguishable from a nonexistent one.
      parameters:
        - $ref: '#/components/parameters/LabelId'
      responses:
        '200':
          description: The label
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: success
                  data:
                    type: object
                    properties:
                      label:
                        $ref: '#/components/schemas/GeneratedLabel'
                      currentVersion:
                        type: integer
                      latestValidation:
                        type: object
                        nullable: true
                        allOf:
                          - $ref: '#/components/schemas/ValidationReport'
                      provenance:
                        type: object
                        description: Map of labelSchema field path -> { tier, source, citation, modelId, promptHash, at }.
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '403':
          $ref: '#/components/responses/ForbiddenError'
        '404':
          $ref: '#/components/responses/NotFoundError'
        '500':
          $ref: '#/components/responses/ServerError'
    patch:
      tags:
        - Generated Labels
      summary: Apply a structural edit to a label (patch protocol)
      description: 'Applies a set of field-level changes directly (no AI involved — for the AI-assisted equivalent see `POST /labels/{id}/chat`). Requires `update_labels`. A structurally invalid patch (unknown path, unsupported op, missing value, or one that would replace more than 60% of the label''s top-level fields — use regeneration for that instead) is returned as a normal 200 `{status:"refused", path, reason, previousValue, errors}`, never an HTTP error — a business-rule refusal is an outcome of the operation, not a transport failure. A patch that would introduce a NEW validation failure that didn''t exist before is refused as a 409 conflict rather than silently applied; resubmit the SAME request with `overrideAcknowledged: true` to push it through anyway — same override contract as `POST /labels/{id}/chat`. The override is recorded on the resulting version, tied to the caller''s identity.'
      parameters:
        - $ref: '#/components/parameters/LabelId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - changes
                - expectedVersion
              properties:
                changes:
                  type: array
                  minItems: 1
                  items:
                    $ref: '#/components/schemas/LabelPatchChange'
                rationale:
                  type: string
                  nullable: true
                expectedVersion:
                  type: integer
                  description: Must equal the label's current `currentVersion`, or the request is refused with 409.
                overrideAcknowledged:
                  type: boolean
                  default: false
                  description: Resend the SAME request with this set to true to push the patch through past a conflict (a NEW validation failure the patch would introduce). Persisted on the resulting `LabelVersion` along with the caller's identity.
      responses:
        '200':
          description: Patch applied — a new version was created (clean, or applied via override).
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: success
                  data:
                    oneOf:
                      - type: object
                        description: applied — clean, or applied via override.
                        properties:
                          status:
                            type: string
                            example: applied
                          resultVersion:
                            type: integer
                          report:
                            $ref: '#/components/schemas/ValidationReport'
                      - type: object
                        description: refused — structurally invalid patch (unknown path, unsupported op, missing value, or bulk-replacement threshold). A normal outcome, not a transport error — always 200, never 422. `errors` carries every rejected change; `path`/`reason`/`previousValue` mirror the first one.
                        properties:
                          status:
                            type: string
                            example: refused
                          path:
                            type: string
                            nullable: true
                          reason:
                            type: string
                            example: Patch touches 22/30 top-level fields (> 60%) — this is a bulk replacement, not an edit. Use explicit re-generation instead.
                          previousValue:
                            description: The value currently at `path`, unchanged — nothing was applied.
                          errors:
                            type: array
                            items:
                              type: object
                              properties:
                                path:
                                  type: string
                                  nullable: true
                                reason:
                                  type: string
                                previousValue: {}
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '403':
          $ref: '#/components/responses/ForbiddenError'
        '404':
          $ref: '#/components/responses/NotFoundError'
        '409':
          description: A patch that would introduce a new validation failure and `overrideAcknowledged` was not set (`data.status === "conflict"`, outer envelope `status` stays `"success"`), OR a stale `expectedVersion` (plain fail envelope).
          content:
            application/json:
              schema:
                oneOf:
                  - type: object
                    properties:
                      status:
                        type: string
                        example: success
                      data:
                        type: object
                        properties:
                          status:
                            type: string
                            example: conflict
                          wouldViolate:
                            type: array
                            items:
                              type: object
                              properties:
                                ruleKey:
                                  type: string
                                  nullable: true
                                message:
                                  type: string
                                citation:
                                  type: string
                                  nullable: true
                                path:
                                  type: string
                          options:
                            type: array
                            items:
                              type: string
