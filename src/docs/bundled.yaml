          description: The document, with its `rules` array populated.
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: success
                  data:
                    type: object
                    properties:
                      document:
                        $ref: '#/components/schemas/RegulatoryDocument'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '404':
          $ref: '#/components/responses/NotFoundError'
        '500':
          $ref: '#/components/responses/ServerError'
  /regulatory-documents/{id}/compile-rules:
    post:
      tags:
        - Regulatory Documents
      summary: Compile candidate rules from a document's extracted text
      description: 'Requires `approve_regulatory`. Every accepted candidate is created as a `RegulatoryRule` with `status: "pending_review"` — nothing here is auto-approved. A candidate is rejected (not saved) when it''s missing a required field, has an unsupported `constraint.kind`, targets a path that isn''t in `labelSchema`, its citation can''t be found verbatim in the source document, or it collides with an existing rule''s `ruleKey` for this document.'
      parameters:
        - $ref: '#/components/parameters/RegulatoryDocumentId'
      responses:
        '201':
          description: Rules compiled.
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: success
                  message:
                    type: string
                    example: 4 rule(s) compiled and pending review, 1 rejected.
                  data:
                    type: object
                    properties:
                      rules:
                        type: array
                        items:
                          $ref: '#/components/schemas/RegulatoryRule'
                      rejected:
                        type: array
                        items:
                          type: object
                          properties:
                            candidate:
                              type: object
                              description: Raw AI-proposed rule, not a DB row.
                              properties:
                                ruleKey:
                                  type: string
                                ruleType:
                                  type: string
                                severity:
                                  type: string
                                targetPath:
                                  type: string
                                  nullable: true
                                appliesWhen:
                                  type: object
                                  nullable: true
                                constraint:
                                  type: object
                                description:
                                  type: string
                                citation:
                                  type: string
                                  nullable: true
                            reason:
                              type: string
                              example: Citation not found verbatim in the source document.
        '400':
          description: The document has no extracted text yet.
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                  message:
                    type: string
                    example: This document has no extracted text yet.
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '403':
          $ref: '#/components/responses/ForbiddenError'
        '404':
          $ref: '#/components/responses/NotFoundError'
        '500':
          $ref: '#/components/responses/ServerError'
  /regulatory-documents/{id}/audit-coverage:
    post:
      tags:
        - Regulatory Documents
      summary: Audit a document's rule coverage against its clauses
      description: Persists `clauseTotal`/`clauseCovered`/`coveragePercent`/ `uncoveredClauses`/`coverageAuditedAt` onto the document. Rejected rules are excluded from the accepted-coverage count. Requires `approve_regulatory`.
      parameters:
        - $ref: '#/components/parameters/RegulatoryDocumentId'
      responses:
        '200':
          description: Updated document with coverage figures.
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: success
                  data:
                    type: object
                    properties:
                      document:
                        $ref: '#/components/schemas/RegulatoryDocument'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '403':
          $ref: '#/components/responses/ForbiddenError'
        '404':
          $ref: '#/components/responses/NotFoundError'
        '500':
          $ref: '#/components/responses/ServerError'
  /regulatory-documents/{id}/approve:
    post:
      tags:
        - Regulatory Documents
      summary: Approve a regulatory document
      description: Gated on coverage. Requires `approve_regulatory`. **400** if the document has never been coverage-audited (`coveragePercent` is null/undefined) — run `POST /regulatory-documents/{id}/audit-coverage` first. **422** only when coverage is below 95% AND at least one clause in `uncoveredClauses` is still unresolved — if coverage is under 95% but every clause has been human-cleared via `PATCH /regulatory-documents/{id}/clauses/clear`, approval succeeds anyway.
      parameters:
        - $ref: '#/components/parameters/RegulatoryDocumentId'
      responses:
        '200':
          description: Approved.
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: success
                  data:
                    type: object
                    properties:
                      document:
                        $ref: '#/components/schemas/RegulatoryDocument'
        '400':
          description: Never coverage-audited.
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                  message:
                    type: string
                    example: This document has not been coverage-audited yet — POST /regulatory-documents/:id/audit-coverage first.
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '403':
          $ref: '#/components/responses/ForbiddenError'
        '404':
          $ref: '#/components/responses/NotFoundError'
        '422':
          description: Coverage < 95% and unresolved clauses remain.
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                  message:
                    type: string
                    example: 'Cannot approve: coverage is 82.0% (< 95%) with 3 clause(s) still unresolved. Clear them via review first.'
        '500':
          $ref: '#/components/responses/ServerError'
  /regulatory-documents/{id}/clauses/clear:
    patch:
      tags:
        - Regulatory Documents
      summary: Clear a false-positive uncovered clause
      description: Not in the original architecture doc's literal endpoint list — added because the 95% approval gate needs a way for a human to clear a false-positive uncovered clause. Removes the matching entry (by `reference`) from `uncoveredClauses`; does not touch `clauseTotal` or `coveragePercent`. Silently a no-op if `reference` doesn't match anything. Requires `approve_regulatory`.
      parameters:
        - $ref: '#/components/parameters/RegulatoryDocumentId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - reference
              properties:
                reference:
                  type: string
      responses:
        '200':
          description: Updated document.
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: success
                  data:
                    type: object
                    properties:
                      document:
                        $ref: '#/components/schemas/RegulatoryDocument'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '403':
          $ref: '#/components/responses/ForbiddenError'
        '404':
          $ref: '#/components/responses/NotFoundError'
        '500':
          $ref: '#/components/responses/ServerError'
