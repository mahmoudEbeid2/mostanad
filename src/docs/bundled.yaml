openapi: 3.0.0
info:
  title: Mostanad API
  version: 1.0.0
  description: |
    API for managing documents and users in the **Mostanad** application.

    ## Authentication
    This is an internal system. Authentication details will be added later.
servers:
  - url: http://localhost:3000/api/v1
    description: Development server
tags:
  - name: Users
    description: Internal system user management
  - name: Companies
    description: Company account management
paths:
  /users:
    get:
      tags:
        - Users
      summary: Get all users
      description: Retrieve a paginated list of all active users. Supports filtering, searching, and sorting.
      parameters:
        - $ref: '#/components/parameters/PageParam'
        - $ref: '#/components/parameters/LimitParam'
        - $ref: '#/components/parameters/SortParam'
        - $ref: '#/components/parameters/SearchParam'
        - name: isActive
          in: query
          required: false
          description: Filter by active status
          schema:
            type: boolean
          example: true
      responses:
        '200':
          $ref: '#/components/responses/UsersListResponse'
        '500':
          $ref: '#/components/responses/ServerError'
    post:
      tags:
        - Users
      summary: Create a new user
      description: Create a new system user with name, email, username and password.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateUserBody'
      responses:
        '201':
          $ref: '#/components/responses/UserResponse'
        '400':
          $ref: '#/components/responses/BadRequestError'
        '500':
          $ref: '#/components/responses/ServerError'
  /users/{id}:
    get:
      tags:
        - Users
      summary: Get user by ID
      description: Retrieve a single user by their UUID.
      parameters:
        - $ref: '#/components/parameters/UserId'
      responses:
        '200':
          $ref: '#/components/responses/UserResponse'
        '400':
          $ref: '#/components/responses/BadRequestError'
        '404':
          $ref: '#/components/responses/NotFoundError'
        '500':
          $ref: '#/components/responses/ServerError'
    patch:
      tags:
        - Users
      summary: Update a user
      description: Update one or more fields of an existing user. All fields are optional.
      parameters:
        - $ref: '#/components/parameters/UserId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateUserBody'
      responses:
        '200':
          $ref: '#/components/responses/UserResponse'
        '400':
          $ref: '#/components/responses/BadRequestError'
        '404':
          $ref: '#/components/responses/NotFoundError'
        '500':
          $ref: '#/components/responses/ServerError'
    delete:
      tags:
        - Users
      summary: Delete a user
      description: Permanently delete a user by their UUID. This action is irreversible.
      parameters:
        - $ref: '#/components/parameters/UserId'
      responses:
        '204':
          description: User deleted successfully (no content)
        '400':
          $ref: '#/components/responses/BadRequestError'
        '404':
          $ref: '#/components/responses/NotFoundError'
        '500':
          $ref: '#/components/responses/ServerError'
  /companies:
    get:
      tags:
        - Companies
      summary: Get all companies
      description: Retrieve a paginated list of all companies. Supports filtering, searching, and sorting.
      parameters:
        - $ref: '#/components/parameters/PageParam'
        - $ref: '#/components/parameters/LimitParam'
        - $ref: '#/components/parameters/SortParam'
        - $ref: '#/components/parameters/SearchParam'
      responses:
        '200':
          $ref: '#/components/responses/CompaniesListResponse'
        '500':
          $ref: '#/components/responses/ServerError'
    post:
      tags:
        - Companies
      summary: Create a new company
      description: Create a new company with name, username, and password. Email, phone, address, and logoUrl are optional.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateCompanyBody'
      responses:
        '201':
          $ref: '#/components/responses/CompanyResponse'
        '400':
          $ref: '#/components/responses/BadRequestError'
        '500':
          $ref: '#/components/responses/ServerError'
  /companies/{id}:
    get:
      tags:
        - Companies
      summary: Get company by ID
      description: Retrieve a single company by its UUID.
      parameters:
        - $ref: '#/components/parameters/CompanyId'
      responses:
        '200':
          $ref: '#/components/responses/CompanyResponse'
        '400':
          $ref: '#/components/responses/BadRequestError'
        '404':
          $ref: '#/components/responses/NotFoundError'
        '500':
          $ref: '#/components/responses/ServerError'
    patch:
      tags:
        - Companies
      summary: Update a company
      description: Update one or more fields of an existing company. All fields are optional.
      parameters:
        - $ref: '#/components/parameters/CompanyId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateCompanyBody'
      responses:
        '200':
          $ref: '#/components/responses/CompanyResponse'
        '400':
          $ref: '#/components/responses/BadRequestError'
        '404':
          $ref: '#/components/responses/NotFoundError'
        '500':
          $ref: '#/components/responses/ServerError'
    delete:
      tags:
        - Companies
      summary: Delete a company
      description: Permanently delete a company by its UUID. This action is irreversible.
      parameters:
        - $ref: '#/components/parameters/CompanyId'
      responses:
        '204':
          description: Company deleted successfully (no content)
        '400':
          $ref: '#/components/responses/BadRequestError'
        '404':
          $ref: '#/components/responses/NotFoundError'
        '500':
          $ref: '#/components/responses/ServerError'
components:
  parameters:
    PageParam:
      name: page
      in: query
      required: false
      description: Page number (starts from 1)
      schema:
        type: integer
        minimum: 1
        default: 1
    LimitParam:
      name: limit
      in: query
      required: false
      description: Number of items per page
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 10
    SortParam:
      name: sort
      in: query
      required: false
      description: 'Sort fields. Use comma to separate. Prefix with - for descending. Example: -createdAt,name'
      schema:
        type: string
      example: '-createdAt'
    SearchParam:
      name: search
      in: query
      required: false
      description: Search term matched against name, email, or username
      schema:
        type: string
      example: ahmed
    UserId:
      name: id
      in: path
      required: true
      description: UUID of the user
      schema:
        type: string
        format: uuid
      example: a1b2c3d4-e5f6-7890-abcd-ef1234567890
    CompanyId:
      name: id
      in: path
      required: true
      description: UUID of the company
      schema:
        type: string
        format: uuid
      example: b2c3d4e5-f6a7-8901-bcde-f12345678901
  schemas:
    User:
      type: object
      properties:
        id:
          type: string
          format: uuid
          example: a1b2c3d4-e5f6-7890-abcd-ef1234567890
        name:
          type: string
          example: Ahmed Mohamed
        email:
          type: string
          format: email
          example: ahmed@example.com
        username:
          type: string
          example: ahmed_m
        phone:
          type: string
          nullable: true
          example: '01012345678'
        isActive:
          type: boolean
          example: true
        createdAt:
          type: string
          format: date-time
          example: '2026-06-10T10:00:00.000Z'
        updatedAt:
          type: string
          format: date-time
          example: '2026-06-10T12:00:00.000Z'
    CreateUserBody:
      type: object
      required:
        - name
        - email
        - username
        - password
      properties:
        name:
          type: string
          minLength: 2
          maxLength: 100
          example: Ahmed Mohamed
        email:
          type: string
          format: email
          example: ahmed@example.com
        username:
          type: string
          minLength: 3
          maxLength: 30
          pattern: ^[a-zA-Z0-9_]+$
          example: ahmed_m
        password:
          type: string
          minLength: 6
          example: secret123
        phone:
          type: string
          nullable: true
          example: '01012345678'
    UpdateUserBody:
      type: object
      properties:
        name:
          type: string
          minLength: 2
          maxLength: 100
          example: Ahmed Updated
        email:
          type: string
          format: email
          example: updated@example.com
        username:
          type: string
          minLength: 3
          maxLength: 30
          example: ahmed_updated
        password:
          type: string
          minLength: 6
          example: newpassword123
        phone:
          type: string
          nullable: true
          example: '01098765432'
        isActive:
          type: boolean
          example: false
    Company:
      type: object
      properties:
        id:
          type: string
          format: uuid
          example: b2c3d4e5-f6a7-8901-bcde-f12345678901
        name:
          type: string
          example: Acme Corp
        username:
          type: string
          example: acme_corp
        email:
          type: string
          format: email
          nullable: true
          example: info@acme.com
        phone:
          type: string
          nullable: true
          example: '01012345678'
        address:
          type: string
          nullable: true
          example: 123 Main St, Cairo, Egypt
        logoUrl:
          type: string
          nullable: true
          example: https://example.com/logos/acme.png
        isActive:
          type: boolean
          example: true
        createdAt:
          type: string
          format: date-time
          example: '2026-06-10T10:00:00.000Z'
        updatedAt:
          type: string
          format: date-time
          example: '2026-06-10T12:00:00.000Z'
    CreateCompanyBody:
      type: object
      required:
        - name
        - username
        - password
      properties:
        name:
          type: string
          minLength: 2
          maxLength: 100
          example: Acme Corp
        username:
          type: string
          minLength: 3
          maxLength: 30
          pattern: ^[a-zA-Z0-9_]+$
          example: acme_corp
        password:
          type: string
          minLength: 6
          example: secret123
        email:
          type: string
          format: email
          nullable: true
          example: info@acme.com
        phone:
          type: string
          nullable: true
          example: '01012345678'
        address:
          type: string
          nullable: true
          example: 123 Main St, Cairo, Egypt
        logoUrl:
          type: string
          nullable: true
          example: https://example.com/logos/acme.png
    UpdateCompanyBody:
      type: object
      properties:
        name:
          type: string
          minLength: 2
          maxLength: 100
          example: Acme Corp Updated
        username:
          type: string
          minLength: 3
          maxLength: 30
          example: acme_updated
        password:
          type: string
          minLength: 6
          example: newpassword123
        email:
          type: string
          format: email
          nullable: true
          example: updated@acme.com
        phone:
          type: string
          nullable: true
          example: '01098765432'
        address:
          type: string
          nullable: true
          example: 456 Side St, Alexandria, Egypt
        logoUrl:
          type: string
          nullable: true
          example: https://example.com/logos/acme-new.png
        isActive:
          type: boolean
          example: false
  responses:
    UsersListResponse:
      description: Paginated list of users
      content:
        application/json:
          schema:
            type: object
            properties:
              status:
                type: string
                example: success
              meta:
                type: object
                properties:
                  total:
                    type: integer
                    example: 50
                  page:
                    type: integer
                    example: 1
                  limit:
                    type: integer
                    example: 10
                  totalPages:
                    type: integer
                    example: 5
              data:
                type: object
                properties:
                  users:
                    type: array
                    items:
                      $ref: '#/components/schemas/User'
    ServerError:
      description: Internal server error
      content:
        application/json:
          schema:
            type: object
            properties:
              status:
                type: string
                example: error
              message:
                type: string
                example: Something went very wrong!
    UserResponse:
      description: Single user response
      content:
        application/json:
          schema:
            type: object
            properties:
              status:
                type: string
                example: success
              data:
                type: object
                properties:
                  user:
                    $ref: '#/components/schemas/User'
    BadRequestError:
      description: Validation error or bad input
      content:
        application/json:
          schema:
            type: object
            properties:
              status:
                type: string
                example: fail
              message:
                type: string
                example: 'Validation error in body: name: Required'
    NotFoundError:
      description: Resource not found
      content:
        application/json:
          schema:
            type: object
            properties:
              status:
                type: string
                example: fail
              message:
                type: string
                example: User not found!
    CompaniesListResponse:
      description: Paginated list of companies
      content:
        application/json:
          schema:
            type: object
            properties:
              status:
                type: string
                example: success
              meta:
                type: object
                properties:
                  total:
                    type: integer
                    example: 30
                  page:
                    type: integer
                    example: 1
                  limit:
                    type: integer
                    example: 10
                  totalPages:
                    type: integer
                    example: 3
              data:
                type: object
                properties:
                  companies:
                    type: array
                    items:
                      $ref: '#/components/schemas/Company'
    CompanyResponse:
      description: Single company response
      content:
        application/json:
          schema:
            type: object
            properties:
              status:
                type: string
                example: success
              data:
                type: object
                properties:
                  company:
                    $ref: '#/components/schemas/Company'
