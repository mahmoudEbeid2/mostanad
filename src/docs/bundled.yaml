        Permission: `create_certificate_templates`. Tenant-scoped: a system user passes `?companyId=`; another company's resource is **404**, never 403.
      parameters:
        - $ref: '#/components/parameters/CompanyId-2'
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required:
                - file
                - name
                - certificateTypeId
              properties:
                file:
                  type: string
                  format: binary
                  description: .ai / .pdf / .html, ≤ 60 MB
                name:
                  type: string
                certificateTypeId:
                  type: string
                  format: uuid
                brandId:
                  type: string
                  format: uuid
                country:
                  type: string
                  example: SA
                  description: ISO-3166 alpha-2
                scope:
                  type: string
                  enum:
                    - per_product
                    - per_invoice
      responses:
        '202':
          description: Accepted
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
              example:
                status: accepted
                data:
                  templateId: uuid
                  versionId: uuid
                  taskId: uuid
