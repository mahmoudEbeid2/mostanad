      properties:
        id:
          type: string
          format: uuid
          example: b2c3d4e5-f6a7-8901-bcde-f12345678901
        name:
          type: string
          example: Acme Corp
        username:
          type: string
          example: acme_corp
        email:
          type: string
          format: email
          nullable: true
          example: info@acme.com
        phone:
          type: string
          nullable: true
          example: '01012345678'
        address:
