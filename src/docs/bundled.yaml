  /labels/{id}/chat:
    post:
      tags:
        - Label Chat
      summary: Send a message to the label's AI editing/Q&A agent
      description: 'A single endpoint handles three different intents, classified by the AI itself: `question`, `explain_validation` (both answer-only, no state change), and `edit` (may create a new label version). Requires `update_labels`. See FRONTEND-GUIDE.md for the full conflict/override flow.'
      parameters:
        - $ref: '#/components/parameters/LabelId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - message
              properties:
                message:
                  type: string
                  example: Why did withdrawal period fail?
                expectedVersion:
                  type: integer
                  nullable: true
                  description: If provided and it doesn't match the label's current version, the request is refused with 409 before any AI call is made.
                overrideAcknowledged:
                  type: boolean
                  default: false
                  description: Resend the SAME message with this set to true to push an edit through past a conflict. The patch is regenerated from scratch on retry, not replayed — it is possible (rare) for the AI to propose a slightly different patch the second time.
      responses:
        '200':
          description: Question answered, or an edit applied cleanly / applied via override.
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: success
                  data:
                    oneOf:
                      - type: object
                        description: question or explain_validation turn — no state change.
                        properties:
                          intent:
                            type: string
                            enum:
                              - question
                              - explain_validation
                          answer:
                            type: string
                      - type: object
                        description: edit turn, applied (clean, or overridden).
                        properties:
                          intent:
                            type: string
                            enum:
                              - edit
                          status:
                            type: string
                            enum:
                              - applied
                          resultVersion:
                            type: integer
                          report:
                            $ref: '#/components/schemas/ValidationReport'
                      - type: object
                        description: edit turn, refused — the AI-proposed patch was structurally invalid (unknown path, unsupported op, missing value, or bulk-replacement threshold). This is a normal outcome of the operation, not a transport error — always 200, never 422. `errors` carries every rejected change (a patch can touch several paths at once); `path`/`reason`/`previousValue` mirror the FIRST one for a client that only wants to render a single message.
                        properties:
                          intent:
                            type: string
                            enum:
                              - edit
                          status:
                            type: string
                            enum:
                              - refused
                          path:
                            type: string
                            nullable: true
                            description: The rejected change's path, or null for a patch-level error (e.g. the bulk-replacement threshold).
                          reason:
                            type: string
                          previousValue:
                            description: The value currently at `path`, unchanged — nothing was applied.
                          errors:
                            type: array
                            items:
                              type: object
                              properties:
                                path:
                                  type: string
                                  nullable: true
                                reason:
                                  type: string
                                previousValue: {}
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '403':
          $ref: '#/components/responses/ForbiddenError'
        '404':
          $ref: '#/components/responses/NotFoundError'
        '409':
          description: Stale `expectedVersion` (plain fail envelope), OR an edit whose proposed patch would introduce a new validation failure and `overrideAcknowledged` was not set (`data.status === "conflict"`, outer envelope `status` stays `"success"`).
          content:
            application/json:
              schema:
                oneOf:
                  - type: object
                    properties:
                      status:
                        type: string
                        example: fail
                      message:
                        type: string
                        example: 'Version conflict: expected 3, label is now at 4. Reload before editing.'
                  - type: object
                    properties:
                      status:
                        type: string
                        example: success
                      data:
                        type: object
                        properties:
                          intent:
                            type: string
                            enum:
                              - edit
                          status:
                            type: string
                            enum:
                              - conflict
                          proposedPatch:
                            type: object
                            properties:
                              rationale:
                                type: string
                              changes:
                                type: array
                                items:
                                  $ref: '#/components/schemas/LabelPatchChange'
                          wouldViolate:
                            type: array
                            items:
                              type: object
                              properties:
                                ruleKey:
                                  type: string
                                  nullable: true
                                message:
                                  type: string
                                citation:
                                  type: string
                                  nullable: true
                                path:
                                  type: string
                          options:
                            type: array
                            items:
                              type: string
                            example:
                              - cancel
                              - apply_and_fix:withdrawalPeriod
                              - apply_anyway_with_override
        '423':
          $ref: '#/components/responses/LockedError'
        '500':
          $ref: '#/components/responses/ServerError'
        '503':
          $ref: '#/components/responses/ServiceUnavailableError'
    get:
      tags:
        - Label Chat
      summary: Get the full chat history for a label
      description: Ordered oldest-first. A turn writes a `role:"user"` row always (with `intent`, and for edit attempts `proposedPatch`/`conflicts` populated); `question`/`explain_validation` turns also write a `role:"assistant"` row. Edit outcomes live on the user row's `appliedPatch`/ `resultVersion`/`conflicts` — there's no separate assistant row for edits. Requires `read_labels`.
      parameters:
        - $ref: '#/components/parameters/LabelId'
      responses:
        '200':
          description: Full message history.
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: success
                  results:
                    type: integer
                  data:
                    type: object
                    properties:
                      messages:
                        type: array
                        items:
                          $ref: '#/components/schemas/ChatMessage'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '404':
          $ref: '#/components/responses/NotFoundError'
        '500':
          $ref: '#/components/responses/ServerError'
  /labels/{id}/approve:
    post:
      tags:
        - Label Approval
      summary: Sign off (approve) a label — the human signature on regulated output
      description: |-
        Approval is not a status toggle: it's a human signature recording who signed, which version, which estimated fields they signed for, which UNVERIFIABLE verdicts they acknowledged, and a frozen label snapshot. It is refused unless the current version passes every gate below, checked in this order. Requires `approve_labels`, plus `publish_global_reference` when `scope: "global"` is used (never grantable to a company- authenticated caller — rejected outright regardless of permissions).
        **Refusal order and status codes:** 1. `scope:"global"` requested by a company caller, or by a system user
           without `publish_global_reference` — **403**.
        2. Label not found / wrong tenant — **404**. 3. `expectedVersion` doesn't match `label.currentVersion` — **409**. 4. `label.status` is already `"approved"` — **409** (revoke first to
           re-approve).
        5. No `ValidationReport` exists at all for this label — **422**. 6. **Gate 1** — the existing `ValidationReport` is stale relative to the
           current version — **409**.
        7. **Gate 2** — the report has any FAIL verdict (`!report.passed`) —
           **422**, final, no override.
        8. **Gate 3** — any `UNVERIFIABLE` verdict whose `path` is missing from
           `acknowledgedUnverifiable` — **422**.
        9. **Gate 4** — any `labelData.estimatedFields` entry missing from
           `signedEstimatedFields` — **422**.
        10. **Gate 5** — `riskScore > 50` and the approver is the label's own
            creator — **403** (separation of duties); OR `autonomyTier ===
            "dual_review"` with no `secondApproverUserId` supplied — **422**.
        11. **Gate 6** — any regulatory document behind the validation's
            `rulesetIds` is not `status:"approved"` or has `coveragePercent` <
            95 — **422** ("weak backing documents").
      parameters:
        - $ref: '#/components/parameters/LabelId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - expectedVersion
              properties:
                expectedVersion:
                  type: integer
                signedEstimatedFields:
                  type: array
                  items:
                    type: string
                  description: labelSchema field paths — must cover every entry in the label's labelData.estimatedFields.
                  example:
                    - strength
                    - withdrawalPeriod
                acknowledgedUnverifiable:
                  type: array
                  items:
                    type: string
                  description: FieldVerdict.path values — must cover every UNVERIFIABLE verdict in the latest report.
                  example:
                    - registrationNumber
                scope:
                  type: string
                  enum:
                    - company
                    - global
                  default: company
                  description: '"global" requires publish_global_reference and is never available to a company-authenticated caller.'
                note:
                  type: string
                  nullable: true
                secondApproverUserId:
                  type: string
                  format: uuid
                  nullable: true
                  description: Required when the label's autonomyTier is "dual_review".
      responses:
        '201':
          description: Approved. The label was also promoted to a ReferenceLabel.
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: success
                  data:
                    type: object
                    properties:
                      approval:
                        $ref: '#/components/schemas/LabelApproval'
                      reference:
                        $ref: '#/components/schemas/ReferenceLabel'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '403':
          description: Global-scope permission denial, or a high-risk label approved by its own creator (separation of duties).
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                  message:
                    type: string
                    example: 'High risk: cannot approve a label you created yourself.'
        '404':
          $ref: '#/components/responses/NotFoundError'
        '409':
          description: Stale expectedVersion, already approved, or the existing validation report is stale relative to the current version.
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                  message:
                    type: string
                    example: This version is already approved. Revoke the existing approval first if you need to re-approve.
        '422':
          $ref: '#/components/responses/UnprocessableEntityError'
        '500':
          $ref: '#/components/responses/ServerError'
  /labels/{id}/approvals:
    get:
      tags:
        - Label Approval
      summary: List a label's approval history
      description: Newest first. Requires `read_labels`.
      parameters:
        - $ref: '#/components/parameters/LabelId'
      responses:
        '200':
          description: Approval history
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: success
                  results:
                    type: integer
                  data:
                    type: object
                    properties:
                      approvals:
                        type: array
                        items:
                          $ref: '#/components/schemas/LabelApproval'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '404':
          $ref: '#/components/responses/NotFoundError'
        '500':
          $ref: '#/components/responses/ServerError'
  /labels/{id}/approvals/{approvalId}/revoke:
    post:
      tags:
        - Label Approval
      summary: Revoke an approval
      description: 'Sets the label''s status to `revoked`. If this approval had promoted a `ReferenceLabel`, that reference''s `isApproved` becomes `false` (never deleted). Every OTHER label whose `referenceLabelIds` cites the now-revoked reference gets `needsReview: true` set — those ids are returned in `affectedLabelIds` so the frontend can flag them. Requires `approve_labels`.'
      parameters:
        - $ref: '#/components/parameters/LabelId'
        - $ref: '#/components/parameters/ApprovalId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - reason
              properties:
                reason:
                  type: string
      responses:
        '200':
          description: Revoked.
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: success
                  data:
                    type: object
                    properties:
                      approval:
                        $ref: '#/components/schemas/LabelApproval'
                      affectedLabelIds:
                        type: array
                        items:
                          type: string
                          format: uuid
                        description: Every other label now flagged needsReview:true because it cites the revoked reference.
        '400':
          description: This approval was already revoked.
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                  message:
                    type: string
                    example: This approval was already revoked.
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '403':
          $ref: '#/components/responses/ForbiddenError'
        '404':
          description: No approval found with that ID (missing, or belongs to a different tenant).
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                  message:
                    type: string
                    example: No approval found with that ID
        '500':
          $ref: '#/components/responses/ServerError'
  /labels/{id}/replay:
    post:
      tags:
        - Assurance
      summary: Re-run generation and compare against the stored label (deterministic replay)
      description: Re-runs generation against the label's frozen `productProfile`, re-selecting references and re-fetching approved rules AS THEY STAND NOW (not a frozen snapshot of the exact rows used originally). Read-only — never creates a new version or touches the stored label. Requires `read_labels`.
      parameters:
        - $ref: '#/components/parameters/LabelId'
      responses:
        '200':
          description: Replay result.
          content:
            application/json:
              schema:
                type: object
                properties:
                  identical:
                    type: boolean
                  fieldsDiffered:
                    type: array
                    items:
                      $ref: '#/components/schemas/VersionDiffEntry'
                  promptHashMatches:
                    type: boolean
                    nullable: true
                    description: null specifically means the original label predates Phase 9 and has no stored promptHash — not comparable, not false.
                  referenceSetDrifted:
                    type: boolean
                  ruleSetDrifted:
                    type: boolean
                  originalGenerationMeta:
                    type: object
                  regeneratedGenerationMeta:
                    type: object
                  interpretation:
                    type: string
                    description: One of three fixed messages explaining what a difference (if any) means.
                    example: Reference and rule sets are unchanged, yet output differs — this points to real model non-determinism, not stale inputs.
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '404':
          $ref: '#/components/responses/NotFoundError'
        '422':
          description: The label predates Phase 4 and has no stored productProfile to replay from.
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                  message:
                    type: string
                    example: This label has no stored productProfile (generated before Phase 4) — replay is not possible.
        '500':
          $ref: '#/components/responses/ServerError'
  /regulatory-documents:
    get:
      tags:
        - Regulatory Documents
      summary: List regulatory documents
      description: Requires `read_regulatory`.
      parameters:
        - $ref: '#/components/parameters/PageParam'
        - $ref: '#/components/parameters/LimitParam'
        - name: country
          in: query
          required: false
          schema:
            type: string
        - name: authority
          in: query
          required: false
          schema:
            type: string
            example: EDA
        - name: status
          in: query
          required: false
          schema:
            type: string
            enum:
              - pending_review
              - extracted
              - approved
              - rejected
              - superseded
      responses:
        '200':
          description: Document list. List items do not include the nested rules array.
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: success
                  results:
                    type: integer
                  total:
                    type: integer
                  data:
                    type: object
                    properties:
                      documents:
                        type: array
                        items:
                          $ref: '#/components/schemas/RegulatoryDocument'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '500':
          $ref: '#/components/responses/ServerError'
    post:
      tags:
        - Regulatory Documents
      summary: Upload a regulatory document for extraction
      description: Multipart upload. Queues a `BackgroundTask` (reusing the eda-requirement extraction pipeline) and returns immediately — poll `GET /background-tasks/{taskId}`; on completion `.result` is the full `RegulatoryDocument` row (so the new document's id is `.result.id`, not the initial `data.documentId`, which is always null). If the file's extracted text hashes to an existing document, the task fails with a 409-flavored message in `.error` rather than the POST itself returning an error (extraction happens in the worker, after the 202 has already been sent). Requires `create_regulatory`.
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required:
                - file
              properties:
                file:
                  type: string
                  format: binary
                  description: PDF or DOCX.
                country:
                  type: string
                  default: Egypt
                title:
                  type: string
                authority:
                  type: string
                  example: EDA
                productScope:
                  description: Array, or a comma-separated string (split/trimmed server-side).
                  oneOf:
                    - type: array
                      items:
                        type: string
                    - type: string
                sourceUrl:
                  type: string
                documentVersion:
                  type: string
      responses:
        '202':
          description: Queued for extraction.
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: success
                  message:
                    type: string
                    example: Document uploaded and queued for extraction
                  data:
                    type: object
                    properties:
                      taskId:
                        type: string
                        format: uuid
                      documentId:
                        type: string
                        nullable: true
                        example: null
        '400':
          $ref: '#/components/responses/BadRequestError'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '403':
          $ref: '#/components/responses/ForbiddenError'
        '500':
          $ref: '#/components/responses/ServerError'
  /regulatory-documents/{id}:
    get:
      tags:
