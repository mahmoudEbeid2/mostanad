openapi: 3.0.0
info:
  title: Mostanad API
  version: 1.0.0
  description: |
    API for managing documents and users in the **Mostanad** application.

    ## Authentication
    This is an internal system. Authentication details will be added later.
servers:
  - url: http://localhost:3000/api/v1
    description: Development server
tags:
  - name: Users
    description: Internal system user management
  - name: Roles
    description: Role & permission management
  - name: Companies
    description: Company account management
  - name: Brands
    description: Product brands management
  - name: Dashboard
    description: Administrative system dashboard metrics
  - name: Plans
    description: SaaS Subscription Plan management
  - name: Products
    description: Product catalog management
  - name: Subscriptions
    description: Tenant subscription lifecycle management
  - name: Categories
    description: Product category management
  - name: Templates
    description: Document templates management
  - name: Label Verification
    description: AI-powered medicine and supplement label compliance verification
  - name: Authentication
    description: Internal user authentication and login
  - name: Certificates
    description: Product extraction from invoices and auto-populating certificate templates
paths:
  /auth/login:
    post:
      tags:
        - Authentication
      summary: Log in internal user
      description: Authenticate an internal user (admin/staff) using their username or email and password.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginBody'
      responses:
        '200':
          description: Successful login
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: success
                  data:
                    $ref: '#/components/schemas/LoginResponseData'
        '400':
          $ref: '#/components/responses/BadRequestError'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '403':
          $ref: '#/components/responses/ForbiddenError'
  /users:
    get:
      tags:
        - Users
      summary: Get all users
      description: Retrieve a paginated list of all active users. Supports filtering, searching, and sorting.
      parameters:
        - $ref: '#/components/parameters/PageParam'
        - $ref: '#/components/parameters/LimitParam'
        - $ref: '#/components/parameters/SortParam'
        - $ref: '#/components/parameters/SearchParam'
        - name: isActive
          in: query
          required: false
          description: Filter by active status
          schema:
            type: boolean
          example: true
      responses:
        '200':
          $ref: '#/components/responses/UsersListResponse'
        '500':
          $ref: '#/components/responses/ServerError'
    post:
      tags:
        - Users
      summary: Create a new user
      description: Create a new system user with name, email, username and password.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateUserBody'
      responses:
        '201':
          $ref: '#/components/responses/UserResponse'
        '400':
          $ref: '#/components/responses/BadRequestError'
        '500':
          $ref: '#/components/responses/ServerError'
  /users/{id}:
    get:
      tags:
        - Users
      summary: Get user by ID
      description: Retrieve a single user by their UUID.
      parameters:
        - $ref: '#/components/parameters/UserId'
      responses:
        '200':
          $ref: '#/components/responses/UserResponse'
        '400':
          $ref: '#/components/responses/BadRequestError'
        '404':
          $ref: '#/components/responses/NotFoundError'
        '500':
          $ref: '#/components/responses/ServerError'
    patch:
      tags:
        - Users
      summary: Update a user
      description: Update one or more fields of an existing user. All fields are optional.
      parameters:
        - $ref: '#/components/parameters/UserId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateUserBody'
      responses:
        '200':
          $ref: '#/components/responses/UserResponse'
        '400':
          $ref: '#/components/responses/BadRequestError'
        '404':
          $ref: '#/components/responses/NotFoundError'
        '500':
          $ref: '#/components/responses/ServerError'
    delete:
      tags:
        - Users
      summary: Delete a user
      description: Permanently delete a user by their UUID. This action is irreversible.
      parameters:
        - $ref: '#/components/parameters/UserId'
      responses:
        '204':
          description: User deleted successfully (no content)
        '400':
          $ref: '#/components/responses/BadRequestError'
        '404':
          $ref: '#/components/responses/NotFoundError'
        '500':
          $ref: '#/components/responses/ServerError'
  /roles:
    get:
      tags:
        - Roles
      summary: Get all roles
      description: Retrieve a list of all roles. Supports pagination, searching, and sorting.
      parameters:
        - $ref: '#/components/parameters/PageParam'
        - $ref: '#/components/parameters/LimitParam'
        - $ref: '#/components/parameters/SortParam'
        - $ref: '#/components/parameters/SearchParam'
      security:
        - BearerAuth: []
      responses:
        '200':
          $ref: '#/components/responses/RolesListResponse'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '403':
          $ref: '#/components/responses/ForbiddenError'
        '500':
          $ref: '#/components/responses/ServerError'
    post:
      tags:
        - Roles
      summary: Create a new role
      description: Add a new role to the system, optionally associating it with permission IDs or slugs.
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateRoleBody'
      responses:
        '201':
          $ref: '#/components/responses/RoleResponse'
        '400':
          $ref: '#/components/responses/BadRequestError'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '403':
          $ref: '#/components/responses/ForbiddenError'
        '500':
          $ref: '#/components/responses/ServerError'
  /roles/{id}:
    get:
      tags:
        - Roles
      summary: Get a role by ID
      description: Retrieve detailed information about a specific role, including its associated permissions.
      parameters:
        - name: id
          in: path
          required: true
          description: UUID of the role to retrieve
          schema:
            type: string
            format: uuid
          example: da688042-3c7e-4537-8b88-6c060d0cdf7a
      security:
        - BearerAuth: []
      responses:
        '200':
          $ref: '#/components/responses/RoleResponse'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '403':
          $ref: '#/components/responses/ForbiddenError'
        '404':
          $ref: '#/components/responses/NotFoundError'
        '500':
          $ref: '#/components/responses/ServerError'
    patch:
      tags:
        - Roles
      summary: Update a role by ID
      description: Update a role's name, description, and permissions.
      parameters:
        - name: id
          in: path
          required: true
          description: UUID of the role to update
          schema:
            type: string
            format: uuid
          example: da688042-3c7e-4537-8b88-6c060d0cdf7a
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateRoleBody'
      responses:
        '200':
          $ref: '#/components/responses/RoleResponse'
        '400':
          $ref: '#/components/responses/BadRequestError'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '403':
          $ref: '#/components/responses/ForbiddenError'
        '404':
          $ref: '#/components/responses/NotFoundError'
        '500':
          $ref: '#/components/responses/ServerError'
    delete:
      tags:
        - Roles
      summary: Delete a role by ID
      description: Remove a role from the system. Associated RolePermission linkages will be cascades-deleted automatically.
      parameters:
        - name: id
          in: path
          required: true
          description: UUID of the role to delete
          schema:
            type: string
            format: uuid
          example: da688042-3c7e-4537-8b88-6c060d0cdf7a
      security:
        - BearerAuth: []
      responses:
        '204':
          description: Role successfully deleted
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '403':
          $ref: '#/components/responses/ForbiddenError'
        '404':
          $ref: '#/components/responses/NotFoundError'
        '500':
          $ref: '#/components/responses/ServerError'
  /companies:
    get:
      tags:
        - Companies
      summary: Get all companies
      description: Retrieve a paginated list of all companies. Supports filtering, searching, and sorting.
      parameters:
        - $ref: '#/components/parameters/PageParam'
        - $ref: '#/components/parameters/LimitParam'
        - $ref: '#/components/parameters/SortParam'
        - $ref: '#/components/parameters/SearchParam'
      responses:
        '200':
          $ref: '#/components/responses/CompaniesListResponse'
        '500':
          $ref: '#/components/responses/ServerError'
    post:
      tags:
        - Companies
      summary: Create a new company
      description: Create a new company with name, username, and password. Email, phone, address, and logoUrl are optional.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateCompanyBody'
      responses:
        '201':
          $ref: '#/components/responses/CompanyResponse'
        '400':
          $ref: '#/components/responses/BadRequestError'
        '500':
          $ref: '#/components/responses/ServerError'
  /companies/{id}:
    get:
      tags:
        - Companies
      summary: Get company by ID
      description: Retrieve a single company by its UUID.
      parameters:
        - $ref: '#/components/parameters/CompanyId'
      responses:
        '200':
          $ref: '#/components/responses/CompanyResponse'
        '400':
          $ref: '#/components/responses/BadRequestError'
        '404':
          $ref: '#/components/responses/NotFoundError'
        '500':
          $ref: '#/components/responses/ServerError'
    patch:
      tags:
        - Companies
      summary: Update a company
      description: Update one or more fields of an existing company. All fields are optional.
      parameters:
        - $ref: '#/components/parameters/CompanyId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateCompanyBody'
      responses:
        '200':
          $ref: '#/components/responses/CompanyResponse'
        '400':
          $ref: '#/components/responses/BadRequestError'
        '404':
          $ref: '#/components/responses/NotFoundError'
        '500':
          $ref: '#/components/responses/ServerError'
    delete:
      tags:
        - Companies
      summary: Delete a company
      description: Permanently delete a company by its UUID. This action is irreversible.
      parameters:
        - $ref: '#/components/parameters/CompanyId'
      responses:
        '204':
          description: Company deleted successfully (no content)
        '400':
          $ref: '#/components/responses/BadRequestError'
        '404':
          $ref: '#/components/responses/NotFoundError'
        '500':
          $ref: '#/components/responses/ServerError'
  /companies/login:
    post:
      tags:
        - Companies
      summary: Log in company account
      description: Authenticate a company account (tenant) using their username or email and password to receive a company JWT.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginBody'
      responses:
        '200':
          description: Successful login
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: success
                  data:
                    $ref: '#/components/schemas/CompanyLoginResponseData'
        '400':
          $ref: '#/components/responses/BadRequestError'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '403':
          $ref: '#/components/responses/ForbiddenError'
  /brands:
    get:
      tags:
        - Brands
      summary: Get all brands
      description: Retrieve a paginated list of all brands. Supports filtering by companyId, searching, and sorting.
      parameters:
        - $ref: '#/components/parameters/PageParam'
        - $ref: '#/components/parameters/LimitParam'
        - $ref: '#/components/parameters/SortParam'
        - $ref: '#/components/parameters/SearchParam'
        - $ref: '#/components/parameters/BrandCompanyIdQuery'
      responses:
        '200':
          $ref: '#/components/responses/BrandsListResponse'
        '500':
          $ref: '#/components/responses/ServerError'
    post:
      tags:
        - Brands
      summary: Create a new brand
      description: Create a new brand associated with a company. Supports uploading a brand logo image.
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required:
                - name
                - companyId
              properties:
                name:
                  type: string
                  minLength: 2
                  maxLength: 100
                  example: Araby Feed
                companyId:
                  type: string
                  format: uuid
                  example: b2c3d4e5-f6a7-8901-bcde-f12345678901
                logo:
                  type: string
                  format: binary
                  description: Brand logo image file (PNG, JPEG, WebP)
      responses:
        '201':
          $ref: '#/components/responses/BrandResponse'
        '400':
          $ref: '#/components/responses/BadRequestError'
        '404':
          $ref: '#/components/responses/NotFoundError'
        '500':
          $ref: '#/components/responses/ServerError'
  /brands/{id}:
    get:
      tags:
        - Brands
      summary: Get brand by ID
      description: Retrieve details of a single brand by its UUID.
      parameters:
        - $ref: '#/components/parameters/BrandId'
      responses:
        '200':
          $ref: '#/components/responses/BrandResponse'
        '400':
          $ref: '#/components/responses/BadRequestError'
        '404':
          $ref: '#/components/responses/NotFoundError'
        '500':
          $ref: '#/components/responses/ServerError'
    patch:
      tags:
        - Brands
      summary: Update a brand
      description: Update one or more fields of an existing brand. Supports replacing the brand logo.
      parameters:
        - $ref: '#/components/parameters/BrandId'
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                name:
                  type: string
                  minLength: 2
                  maxLength: 100
                  example: Araby Feed Updated
                companyId:
                  type: string
                  format: uuid
                  example: b2c3d4e5-f6a7-8901-bcde-f12345678901
                logo:
                  type: string
                  format: binary
                  description: New brand logo image file (PNG, JPEG, WebP)
                isActive:
                  type: boolean
                  example: true
      responses:
        '200':
          $ref: '#/components/responses/BrandResponse'
        '400':
          $ref: '#/components/responses/BadRequestError'
        '404':
          $ref: '#/components/responses/NotFoundError'
        '500':
          $ref: '#/components/responses/ServerError'
    delete:
      tags:
        - Brands
      summary: Delete a brand
      description: Permanently delete a brand by its UUID. This cleans up associated files on disk.
      parameters:
        - $ref: '#/components/parameters/BrandId'
      responses:
        '204':
          description: Brand deleted successfully (no content)
        '400':
          $ref: '#/components/responses/BadRequestError'
        '404':
          $ref: '#/components/responses/NotFoundError'
        '500':
          $ref: '#/components/responses/ServerError'
  /dashboard/stats:
    get:
      tags:
        - Dashboard
      summary: Get admin dashboard statistics
      description: Retrieve overall system administration statistics, active subscriptions counts, total monthly revenue, background task counts and breakdowns, and recent activity (registered companies and background tasks). Only accessible by authenticated administrators.
      responses:
        '200':
          $ref: '#/components/responses/DashboardStatsResponse'
        '401':
          description: Unauthorized (Token is missing or invalid)
        '500':
          $ref: '#/components/responses/ServerError'
  /products:
    get:
      tags:
        - Products
      summary: Get all products
      description: Retrieve a paginated list of products. Supports filtering, searching, and sorting.
      parameters:
        - name: companyId
          in: query
          required: false
          description: Filter products by company UUID
          schema:
            type: string
            format: uuid
          example: b2c3d4e5-f6a7-8901-bcde-f12345678901
        - name: categoryId
          in: query
          required: false
          description: Filter products by category UUID
          schema:
            type: string
            format: uuid
          example: c2d3e4f5-a6b7-8901-cdef-012345678901
        - name: brandId
          in: query
          required: false
          description: Filter products by brand UUID
          schema:
            type: string
            format: uuid
          example: a1b2c3d4-e5f6-7890-abcd-ef1234567890
        - $ref: '#/components/parameters/PageParam'
        - $ref: '#/components/parameters/LimitParam'
        - $ref: '#/components/parameters/SortParam'
        - $ref: '#/components/parameters/SearchParam'
      responses:
        '200':
          $ref: '#/components/responses/ProductsListResponse'
        '400':
          $ref: '#/components/responses/BadRequestError'
        '404':
          $ref: '#/components/responses/NotFoundError'
        '500':
          $ref: '#/components/responses/ServerError'
    post:
      tags:
        - Products
      summary: Create a new product
      description: Add a new product to the catalog.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateProductBody'
      responses:
        '201':
          $ref: '#/components/responses/ProductResponse'
        '400':
          $ref: '#/components/responses/BadRequestError'
        '404':
          $ref: '#/components/responses/NotFoundError'
        '500':
          $ref: '#/components/responses/ServerError'
  /products/upload-catalog:
    post:
      tags:
        - Products
      summary: Upload PDF catalog and extract products
      description: Upload an animal feed or veterinary PDF catalog. The system will upload it to the Gemini File API, extract all products and categories using Gemini 2.0 Flash, resolve categories without duplication, and store them in the database associated with the target company.
      parameters:
        - name: companyId
          in: query
          required: true
          description: UUID of the company to associate the extracted products with
          schema:
            type: string
            format: uuid
          example: b2c3d4e5-f6a7-8901-bcde-f12345678901
        - name: brandId
          in: query
          required: false
          description: UUID of the brand to associate the catalog products with
          schema:
            type: string
            format: uuid
          example: a1b2c3d4-e5f6-7890-abcd-ef1234567890
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                catalog:
                  type: string
                  format: binary
                  description: The PDF catalog file (max 15MB)
      responses:
        '201':
          description: Catalog processed and products successfully extracted and saved
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: success
                  message:
                    type: string
                    example: Catalog processed and products extracted successfully!
                  data:
                    type: object
                    properties:
                      totalProductsExtracted:
                        type: integer
                        example: 12
                      categoriesCreated:
                        type: integer
                        example: 2
                      categoriesReused:
                        type: integer
                        example: 1
                      productsCreated:
                        type: integer
                        example: 10
                      productsUpdated:
                        type: integer
                        example: 2
                      products:
                        type: array
                        items:
                          type: object
                          properties:
                            id:
                              type: string
                              format: uuid
                              example: d1b2c3d4-e5f6-7890-abcd-ef1234567890
                            name:
                              type: string
                              example: BROILER STARTER CONCENTRATE 5%
                            category:
                              type: string
                              example: CONCENTRATES
                            action:
                              type: string
                              enum:
                                - created
                                - updated
                              example: created
        '400':
          $ref: '#/components/responses/BadRequestError'
        '404':
          $ref: '#/components/responses/NotFoundError'
        '500':
          $ref: '#/components/responses/ServerError'
  /products/verify-label:
    post:
      tags:
        - Label Verification
      summary: General PDF or image drug label compliance verification
      description: Upload an animal feed, supplement, or veterinary drug PDF/image label. The system will upload it to the Gemini File API, extract the product metadata using Gemini, search the database globally (by exact name or active ingredient overlap) for matching/alternative products, verify compliance against the target country's drug regulatory requirements, and return the combined analysis.
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                label:
                  type: string
                  format: binary
                  description: The PDF or image (PNG, JPEG, WebP) label file (max 15MB)
                country:
                  type: string
                  description: The target country to run the drug regulatory compliance check for
                  example: Saudi Arabia
              required:
                - label
                - country
      responses:
        '200':
          description: Label successfully verified and compliance report generated
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: success
                  message:
                    type: string
                    example: Label verified successfully!
                  data:
                    type: object
                    properties:
                      product:
                        type: object
                        properties:
                          extractedDetails:
                            type: object
                            description: Product metadata extracted from the label by Gemini AI
                          existsInDb:
                            type: boolean
                            example: true
                          isExactMatch:
                            type: boolean
                            example: true
                          dbProduct:
                            type: object
                            nullable: true
                            description: The matching database product if found, otherwise null
                      validation:
                        type: object
                        properties:
                          compliant:
                            type: boolean
                            example: false
                          checkedAgainstDb:
                            type: boolean
                            example: true
                          isExactMatch:
                            type: boolean
                            example: true
                          dbProductName:
                            type: string
                            nullable: true
                            example: H-Viral
                          country:
                            type: string
                            example: Saudi Arabia
                          results:
                            type: array
                            items:
                              type: object
                              properties:
                                category:
                                  type: string
                                  example: regulatory
                                issue:
                                  type: string
                                  example: Missing bilingual Arabic/English warnings
                                location:
                                  type: string
                                  nullable: true
                                  example: Active ingredients section
                                solution:
                                  type: string
                                  example: Translate all safety warning paragraphs into Arabic
        '400':
          $ref: '#/components/responses/BadRequestError'
        '404':
          $ref: '#/components/responses/NotFoundError'
        '500':
          $ref: '#/components/responses/ServerError'
  /products/{id}:
    get:
      tags:
        - Products
      summary: Get product by ID
      description: Retrieve details of a single product by its UUID.
      parameters:
        - $ref: '#/components/parameters/ProductId'
      responses:
        '200':
          $ref: '#/components/responses/ProductResponse'
        '400':
          $ref: '#/components/responses/BadRequestError'
        '404':
          $ref: '#/components/responses/NotFoundError'
        '500':
          $ref: '#/components/responses/ServerError'
    patch:
      tags:
        - Products
      summary: Update a product
      description: Update details of an existing product by its UUID. All body fields are optional.
      parameters:
        - $ref: '#/components/parameters/ProductId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateProductBody'
      responses:
        '200':
          $ref: '#/components/responses/ProductResponse'
        '400':
          $ref: '#/components/responses/BadRequestError'
        '404':
          $ref: '#/components/responses/NotFoundError'
        '500':
          $ref: '#/components/responses/ServerError'
    delete:
      tags:
        - Products
      summary: Delete a product
      description: Permanently hard-delete a product by its UUID. This action is irreversible.
      parameters:
        - $ref: '#/components/parameters/ProductId'
      responses:
        '204':
          description: Product deleted successfully (no content)
        '400':
          $ref: '#/components/responses/BadRequestError'
        '404':
          $ref: '#/components/responses/NotFoundError'
        '500':
          $ref: '#/components/responses/ServerError'
  /plans:
    get:
      tags:
        - Plans
      summary: Get all plans
      description: Retrieve a paginated list of all active plans. Supports filtering, searching, and sorting.
      parameters:
        - $ref: '#/components/parameters/PageParam'
        - $ref: '#/components/parameters/LimitParam'
        - $ref: '#/components/parameters/SortParam'
