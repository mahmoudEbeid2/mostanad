          $ref: '#/components/responses/E401'
        '403':
          $ref: '#/components/responses/E403'
        '409':
          description: 'Coded error: TEMPLATE_SLOT_TAKEN (+ existingTemplateId)'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CertError'
        '413':
          description: 'Coded error: FILE_TOO_LARGE'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CertError'
        '422':
          description: 'Coded error: NO_PDF_CONTENT, UNSUPPORTED_FORMAT'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CertError'
