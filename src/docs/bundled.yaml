        - Reference Labels
      summary: Upload a reference label file for AI extraction
      description: 'Multipart, field `files`, max 1 file. A file whose original filename already matches an existing reference label''s `name` (checked globally, not per-tenant) is skipped as a duplicate. If every uploaded file was a duplicate, returns 400. Otherwise queues one `BackgroundTask` (`type: "reference_label_extraction"`) per non-duplicate file and returns 202; poll `GET /background-tasks/{taskId}` per task — on completion `.result` is the full created `ReferenceLabel` row.'
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required:
                - files
                - country
              properties:
                files:
                  type: array
                  maxItems: 1
                  items:
                    type: string
                    format: binary
                country:
                  type: string
                  description: Country this reference is accepted in.
                companyId:
                  type: string
                  nullable: true
                  description: Explicit "" or omitted defaults to the caller's own company (company caller) or global (system caller, no value given).
                brandId:
                  type: string
                  nullable: true
                categoryId:
                  type: string
                  nullable: true
                manualCategoryName:
                  type: string
                  nullable: true
      responses:
        '202':
          description: Queued.
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: success
                  message:
                    type: string
                    example: 1 reference(s) queued for AI analysis.
                  data:
                    type: object
                    properties:
                      tasks:
                        type: array
                        items:
                          type: object
                          properties:
                            taskId:
                              type: string
                              format: uuid
                            fileName:
                              type: string
        '400':
          description: Missing country, or every uploaded file was a duplicate.
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                  message:
                    type: string
                    example: All 1 uploaded files already exist in the system.
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '500':
          $ref: '#/components/responses/ServerError'
  /reference-labels/manual:
    post:
      tags:
        - Reference Labels
      summary: Create a reference label manually (no AI extraction)
      description: 'Synchronous — creates the row directly, `sourceType: "manual"`.'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - name
                - fullText
                - country
              properties:
                name:
                  type: string
                fullText:
                  type: string
                country:
                  type: string
                companyId:
                  type: string
                  nullable: true
                  description: Overridden by the caller's own company id for a company-authenticated caller.
                brandId:
                  type: string
                  nullable: true
                categoryId:
                  type: string
                  nullable: true
                manualCategoryName:
                  type: string
                  nullable: true
                extractedData:
                  type: object
                  nullable: true
      responses:
        '201':
          description: Created.
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: success
                  data:
                    type: object
                    properties:
                      referenceLabel:
                        $ref: '#/components/schemas/ReferenceLabel'
        '400':
          description: Missing name, fullText, or country.
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                  message:
                    type: string
                    example: Full reference text is required.
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '404':
          description: categoryId was provided but doesn't resolve.
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                  message:
                    type: string
                    example: Selected category was not found.
        '500':
          $ref: '#/components/responses/ServerError'
  /reference-labels/generate-text-ai:
    post:
      tags:
        - Reference Labels
      summary: Generate a new label from AI (schema-constrained, reference- and rule-aware)
      description: 'Always asynchronous: returns 202 with a `taskId` — poll `GET /background-tasks/{taskId}` (`pending` → `processing` → `completed`|`failed`). This is the main label-generation entry point for phases 1-9; the result on completion is a `labelSchema`-conformant label plus a validation summary, risk score, and autonomy tier. See FRONTEND-GUIDE.md for the full polling flow and how this feeds into the validate/chat/approve pipeline afterward.'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - country
                - language
              properties:
                productId:
                  type: string
                  format: uuid
                  nullable: true
                  description: If given, formulationText becomes optional and aimOfUseHint can be satisfied by the product's own indications.
                formulationText:
                  type: string
                  description: Required only when productId is absent.
                country:
                  type: string
                language:
                  type: string
                aimOfUseHint:
                  type: string
                  description: Required unless a referenced product already has `indications` set — the AI will never guess the aim of use.
                targetSpeciesHint:
                  type: string
                directionOfUseHint:
                  type: string
                companyId:
                  type: string
                  format: uuid
                  description: Required when called by a system user (no req.company) — generation must be scoped to a company. Not needed for a company-authenticated caller, whose own id is always used.
            examples:
              productReferenced:
                summary: Referencing an existing product
                value:
                  productId: d1b2c3d4-e5f6-7890-abcd-ef1234567890
                  country: Egypt
                  language: ar
              formulationOnly:
                summary: No product on file
                value:
                  formulationText: Amoxicillin trihydrate 500mg/g oral powder for poultry
                  country: Egypt
                  language: ar
                  aimOfUseHint: Treatment of bacterial infections in poultry
      responses:
        '202':
          $ref: '#/components/responses/TaskAcceptedResponse'
        '400':
          description: Missing country/language, missing productId+formulationText, missing aimOfUseHint with no fallback, or (system user) missing companyId.
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                  message:
                    type: string
                    example: Please provide the confirmed Aim of Use — the AI will not guess it — or reference a Product that already has one.
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '500':
          $ref: '#/components/responses/ServerError'
      x-background-task-result:
        description: Shape of BackgroundTask.result once GET /background-tasks/{taskId} reports status "completed" for this task type.
        schema:
          type: object
          properties:
            taskId:
              type: string
              format: uuid
            labelId:
              type: string
              format: uuid
              description: The new, stable GeneratedLabel.id. Use this for every follow-up call (validate/chat/approve/etc) — do not keep polling the task.
            label:
              $ref: ../../components/components.yaml#/components/schemas/LabelData
            validation:
              type: object
              properties:
                passed:
                  type: boolean
                errorCount:
                  type: integer
                warningCount:
                  type: integer
            riskScore:
              type: integer
            autonomyTier:
              type: string
              enum:
                - auto_approve
                - batch_review
                - mandatory_review
                - dual_review
  /reference-labels/retry/{taskId}:
    post:
      tags:
        - Reference Labels
      summary: Retry a failed reference-label extraction task
      description: No request body. Looks up the BullMQ job (not the DB row) by id — if the job has already been removed from Redis (e.g. completed and cleaned up), returns 404. Only a job whose BullMQ state is `failed` can be retried.
      parameters:
        - name: taskId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Retry queued.
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: success
                  message:
                    type: string
                    example: Task queued for retry.
        '400':
          description: The job is not in a "failed" state.
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                  message:
                    type: string
                    example: Job is currently completed, cannot retry.
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '404':
          description: Job not found or expired from the queue's cache.
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                  message:
                    type: string
                    example: Background job not found or has expired from cache.
        '500':
          $ref: '#/components/responses/ServerError'
