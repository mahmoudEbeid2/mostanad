openapi: 3.0.0
info:
  title: Mostanad API
  version: 1.0.0
  description: |
    API for managing documents and users in the **Mostanad** application.

    ## Authentication
    This is an internal system. Authentication details will be added later.
servers:
  - url: http://localhost:3000/api/v1
    description: Development server
tags:
  - name: Users
    description: Internal system user management
  - name: Companies
    description: Company account management
  - name: Plans
    description: SaaS Subscription Plan management
  - name: Products
    description: Product catalog management
  - name: Subscriptions
    description: Tenant subscription lifecycle management
  - name: Categories
    description: Product category management
paths:
  /users:
    get:
      tags:
        - Users
      summary: Get all users
      description: Retrieve a paginated list of all active users. Supports filtering, searching, and sorting.
      parameters:
        - $ref: '#/components/parameters/PageParam'
        - $ref: '#/components/parameters/LimitParam'
        - $ref: '#/components/parameters/SortParam'
        - $ref: '#/components/parameters/SearchParam'
        - name: isActive
          in: query
          required: false
          description: Filter by active status
          schema:
            type: boolean
          example: true
      responses:
        '200':
          $ref: '#/components/responses/UsersListResponse'
        '500':
          $ref: '#/components/responses/ServerError'
    post:
      tags:
        - Users
      summary: Create a new user
      description: Create a new system user with name, email, username and password.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateUserBody'
      responses:
        '201':
          $ref: '#/components/responses/UserResponse'
        '400':
          $ref: '#/components/responses/BadRequestError'
        '500':
          $ref: '#/components/responses/ServerError'
  /users/{id}:
    get:
      tags:
        - Users
      summary: Get user by ID
      description: Retrieve a single user by their UUID.
      parameters:
        - $ref: '#/components/parameters/UserId'
      responses:
        '200':
          $ref: '#/components/responses/UserResponse'
        '400':
          $ref: '#/components/responses/BadRequestError'
        '404':
          $ref: '#/components/responses/NotFoundError'
        '500':
          $ref: '#/components/responses/ServerError'
    patch:
      tags:
        - Users
      summary: Update a user
      description: Update one or more fields of an existing user. All fields are optional.
      parameters:
        - $ref: '#/components/parameters/UserId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateUserBody'
      responses:
        '200':
          $ref: '#/components/responses/UserResponse'
        '400':
          $ref: '#/components/responses/BadRequestError'
        '404':
          $ref: '#/components/responses/NotFoundError'
        '500':
          $ref: '#/components/responses/ServerError'
    delete:
      tags:
        - Users
      summary: Delete a user
      description: Permanently delete a user by their UUID. This action is irreversible.
      parameters:
        - $ref: '#/components/parameters/UserId'
      responses:
        '204':
          description: User deleted successfully (no content)
        '400':
          $ref: '#/components/responses/BadRequestError'
        '404':
          $ref: '#/components/responses/NotFoundError'
        '500':
          $ref: '#/components/responses/ServerError'
  /companies:
    get:
      tags:
        - Companies
      summary: Get all companies
      description: Retrieve a paginated list of all companies. Supports filtering, searching, and sorting.
      parameters:
        - $ref: '#/components/parameters/PageParam'
        - $ref: '#/components/parameters/LimitParam'
        - $ref: '#/components/parameters/SortParam'
        - $ref: '#/components/parameters/SearchParam'
      responses:
        '200':
          $ref: '#/components/responses/CompaniesListResponse'
        '500':
          $ref: '#/components/responses/ServerError'
    post:
      tags:
        - Companies
      summary: Create a new company
      description: Create a new company with name, username, and password. Email, phone, address, and logoUrl are optional.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateCompanyBody'
      responses:
        '201':
          $ref: '#/components/responses/CompanyResponse'
        '400':
          $ref: '#/components/responses/BadRequestError'
        '500':
          $ref: '#/components/responses/ServerError'
  /companies/{id}:
    get:
      tags:
        - Companies
      summary: Get company by ID
      description: Retrieve a single company by its UUID.
      parameters:
        - $ref: '#/components/parameters/CompanyId'
      responses:
        '200':
          $ref: '#/components/responses/CompanyResponse'
        '400':
          $ref: '#/components/responses/BadRequestError'
        '404':
          $ref: '#/components/responses/NotFoundError'
        '500':
          $ref: '#/components/responses/ServerError'
    patch:
      tags:
        - Companies
      summary: Update a company
      description: Update one or more fields of an existing company. All fields are optional.
      parameters:
        - $ref: '#/components/parameters/CompanyId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateCompanyBody'
      responses:
        '200':
          $ref: '#/components/responses/CompanyResponse'
        '400':
          $ref: '#/components/responses/BadRequestError'
        '404':
          $ref: '#/components/responses/NotFoundError'
        '500':
          $ref: '#/components/responses/ServerError'
    delete:
      tags:
        - Companies
      summary: Delete a company
      description: Permanently delete a company by its UUID. This action is irreversible.
      parameters:
        - $ref: '#/components/parameters/CompanyId'
      responses:
        '204':
          description: Company deleted successfully (no content)
        '400':
          $ref: '#/components/responses/BadRequestError'
        '404':
          $ref: '#/components/responses/NotFoundError'
        '500':
          $ref: '#/components/responses/ServerError'
  /companies/{companyId}/products/upload-catalog:
    post:
      tags:
        - Companies
      summary: Upload PDF catalog and extract products
      description: Upload an animal feed or veterinary PDF catalog. The system will upload it to the Gemini File API, extract all products and categories using Gemini 2.5 Flash, resolve categories without duplication, and store them in the database associated with the target company.
      parameters:
        - name: companyId
          in: path
          required: true
          description: UUID of the company to associate the extracted products with
          schema:
            type: string
            format: uuid
          example: b2c3d4e5-f6a7-8901-bcde-f12345678901
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                catalog:
                  type: string
                  format: binary
                  description: The PDF catalog file (max 15MB)
      responses:
        '201':
          description: Catalog processed and products successfully extracted and saved
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: success
                  message:
                    type: string
                    example: Catalog processed and products extracted successfully!
                  data:
                    type: object
                    properties:
                      totalProductsExtracted:
                        type: integer
                        example: 12
                      categoriesCreated:
                        type: integer
                        example: 2
                      categoriesReused:
                        type: integer
                        example: 1
                      productsCreated:
                        type: integer
                        example: 10
                      productsUpdated:
                        type: integer
                        example: 2
                      products:
                        type: array
                        items:
                          type: object
                          properties:
                            id:
                              type: string
                              format: uuid
                              example: d1b2c3d4-e5f6-7890-abcd-ef1234567890
                            name:
                              type: string
                              example: BROILER STARTER CONCENTRATE 5%
                            category:
                              type: string
                              example: CONCENTRATES
                            action:
                              type: string
                              enum:
                                - created
                                - updated
                              example: created
        '400':
          $ref: '#/components/responses/BadRequestError'
        '404':
          $ref: '#/components/responses/NotFoundError'
        '500':
          $ref: '#/components/responses/ServerError'
  /companies/{companyId}/products:
    get:
      tags:
        - Products
      summary: Get all products scoped to a company
      description: Retrieve a paginated list of all products belonging to a company. Supports filtering, searching, and sorting.
      parameters:
        - name: companyId
          in: path
          required: true
          description: UUID of the company to list products for
          schema:
            type: string
            format: uuid
          example: b2c3d4e5-f6a7-8901-bcde-f12345678901
        - $ref: '#/components/parameters/PageParam'
        - $ref: '#/components/parameters/LimitParam'
        - $ref: '#/components/parameters/SortParam'
        - $ref: '#/components/parameters/SearchParam'
        - name: categoryId
          in: query
          required: false
          description: Filter products by category UUID
          schema:
            type: string
            format: uuid
          example: c2d3e4f5-a6b7-8901-cdef-012345678901
      responses:
        '200':
          $ref: '#/components/responses/ProductsListResponse'
        '400':
          $ref: '#/components/responses/BadRequestError'
        '404':
          $ref: '#/components/responses/NotFoundError'
        '500':
          $ref: '#/components/responses/ServerError'
    post:
      tags:
        - Products
      summary: Create a new product scoped to a company
      description: Add a new product to the company's catalog.
      parameters:
        - name: companyId
          in: path
          required: true
          description: UUID of the company to add the product to
          schema:
            type: string
            format: uuid
          example: b2c3d4e5-f6a7-8901-bcde-f12345678901
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateProductBody'
      responses:
        '201':
          $ref: '#/components/responses/ProductResponse'
        '400':
          $ref: '#/components/responses/BadRequestError'
        '404':
          $ref: '#/components/responses/NotFoundError'
        '500':
          $ref: '#/components/responses/ServerError'
  /products/{id}:
    get:
      tags:
        - Products
      summary: Get product by ID
      description: Retrieve details of a single product by its UUID.
      parameters:
        - $ref: '#/components/parameters/ProductId'
      responses:
        '200':
          $ref: '#/components/responses/ProductResponse'
        '400':
          $ref: '#/components/responses/BadRequestError'
        '404':
          $ref: '#/components/responses/NotFoundError'
        '500':
          $ref: '#/components/responses/ServerError'
    patch:
      tags:
        - Products
      summary: Update a product
      description: Update details of an existing product by its UUID. All body fields are optional.
      parameters:
        - $ref: '#/components/parameters/ProductId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateProductBody'
      responses:
        '200':
          $ref: '#/components/responses/ProductResponse'
        '400':
          $ref: '#/components/responses/BadRequestError'
        '404':
          $ref: '#/components/responses/NotFoundError'
        '500':
          $ref: '#/components/responses/ServerError'
    delete:
      tags:
        - Products
      summary: Delete a product
      description: Permanently hard-delete a product by its UUID. This action is irreversible.
      parameters:
        - $ref: '#/components/parameters/ProductId'
      responses:
        '204':
          description: Product deleted successfully (no content)
        '400':
          $ref: '#/components/responses/BadRequestError'
        '404':
          $ref: '#/components/responses/NotFoundError'
        '500':
          $ref: '#/components/responses/ServerError'
  /plans:
    get:
      tags:
        - Plans
      summary: Get all plans
      description: Retrieve a paginated list of all active plans. Supports filtering, searching, and sorting.
      parameters:
        - $ref: '#/components/parameters/PageParam'
        - $ref: '#/components/parameters/LimitParam'
        - $ref: '#/components/parameters/SortParam'
        - $ref: '#/components/parameters/SearchParam'
        - name: isActive
          in: query
          required: false
          description: Filter by active status
          schema:
            type: boolean
          example: true
      responses:
        '200':
          $ref: '#/components/responses/PlansListResponse'
        '500':
          $ref: '#/components/responses/ServerError'
    post:
      tags:
        - Plans
      summary: Create a new subscription plan
      description: Create a new SaaS subscription plan with a unique name, price, interval, and list of features.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreatePlanBody'
      responses:
        '201':
          $ref: '#/components/responses/PlanResponse'
        '400':
          $ref: '#/components/responses/BadRequestError'
        '500':
          $ref: '#/components/responses/ServerError'
  /plans/{id}:
    get:
      tags:
        - Plans
      summary: Get plan by ID
      description: Retrieve details of a single plan by its UUID.
      parameters:
        - $ref: '#/components/parameters/PlanId'
      responses:
        '200':
          $ref: '#/components/responses/PlanResponse'
        '400':
          $ref: '#/components/responses/BadRequestError'
        '404':
          $ref: '#/components/responses/NotFoundError'
        '500':
          $ref: '#/components/responses/ServerError'
    patch:
      tags:
        - Plans
      summary: Update a plan
      description: Update details of an existing plan by its UUID.
      parameters:
        - $ref: '#/components/parameters/PlanId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdatePlanBody'
      responses:
        '200':
          $ref: '#/components/responses/PlanResponse'
        '400':
          $ref: '#/components/responses/BadRequestError'
        '404':
          $ref: '#/components/responses/NotFoundError'
        '500':
          $ref: '#/components/responses/ServerError'
    delete:
      tags:
        - Plans
      summary: Delete a plan
      description: Permanently delete a subscription plan. Note that a plan cannot be deleted if it has associated active subscriptions.
      parameters:
        - $ref: '#/components/parameters/PlanId'
      responses:
        '204':
          description: Plan deleted successfully (no content)
        '400':
          $ref: '#/components/responses/BadRequestError'
        '404':
          $ref: '#/components/responses/NotFoundError'
        '500':
          $ref: '#/components/responses/ServerError'
  /subscriptions:
    get:
      tags:
        - Subscriptions
      summary: Get all subscriptions
      description: Retrieve a list of subscriptions with support for pagination, sorting, and exact filtering by companyId, planId, and status.
      parameters:
        - $ref: '#/components/parameters/PageParam'
        - $ref: '#/components/parameters/LimitParam'
        - $ref: '#/components/parameters/SortParam'
        - name: companyId
          in: query
          required: false
          description: Filter by company ID
          schema:
            type: string
            format: uuid
          example: b2c3d4e5-f6a7-8901-bcde-f12345678901
        - name: planId
          in: query
          required: false
          description: Filter by subscription plan ID
          schema:
            type: string
            format: uuid
          example: c1b2c3d4-e5f6-7890-abcd-ef1234567890
        - name: status
          in: query
          required: false
          description: Filter by subscription status
          schema:
            type: string
            enum:
              - active
              - expired
              - cancelled
          example: active
      responses:
        '200':
          $ref: '#/components/responses/SubscriptionsListResponse'
        '500':
          $ref: '#/components/responses/ServerError'
    post:
      tags:
        - Subscriptions
      summary: Create a new subscription
      description: Subscribe a company to a SaaS plan. If status is "active", it automatically cancels other active subscriptions for this company.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateSubscriptionBody'
      responses:
        '201':
          $ref: '#/components/responses/SubscriptionResponse'
        '400':
          $ref: '#/components/responses/BadRequestError'
        '404':
          $ref: '#/components/responses/NotFoundError'
        '500':
          $ref: '#/components/responses/ServerError'
  /subscriptions/{id}:
    get:
      tags:
        - Subscriptions
      summary: Get subscription by ID
      description: Retrieve details of a single subscription record by its UUID.
      parameters:
        - $ref: '#/components/parameters/SubscriptionId'
      responses:
        '200':
          $ref: '#/components/responses/SubscriptionResponse'
        '400':
          $ref: '#/components/responses/BadRequestError'
        '404':
          $ref: '#/components/responses/NotFoundError'
        '500':
          $ref: '#/components/responses/ServerError'
    patch:
      tags:
        - Subscriptions
      summary: Update a subscription
      description: Update an existing subscription (e.g. extending endDate, updating plan, or changing status). If status is updated to "active", it automatically cancels other active subscriptions for this company.
      parameters:
        - $ref: '#/components/parameters/SubscriptionId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateSubscriptionBody'
      responses:
        '200':
          $ref: '#/components/responses/SubscriptionResponse'
        '400':
          $ref: '#/components/responses/BadRequestError'
        '404':
          $ref: '#/components/responses/NotFoundError'
        '500':
          $ref: '#/components/responses/ServerError'
    delete:
      tags:
        - Subscriptions
      summary: Delete a subscription
      description: Permanently delete a subscription record.
      parameters:
        - $ref: '#/components/parameters/SubscriptionId'
      responses:
        '204':
          description: Subscription deleted successfully (no content)
        '400':
          $ref: '#/components/responses/BadRequestError'
        '404':
          $ref: '#/components/responses/NotFoundError'
        '500':
          $ref: '#/components/responses/ServerError'
  /categories:
    get:
      tags:
        - Categories
      summary: Get all categories
      description: Retrieve a paginated list of product categories. Supports filtering, searching by name, and sorting.
      parameters:
        - $ref: '#/components/parameters/PageParam'
        - $ref: '#/components/parameters/LimitParam'
        - $ref: '#/components/parameters/SortParam'
        - $ref: '#/components/parameters/SearchParam'
      responses:
        '200':
          $ref: '#/components/responses/CategoriesListResponse'
        '500':
          $ref: '#/components/responses/ServerError'
    post:
      tags:
        - Categories
      summary: Create a new category
      description: Create a new product category with a unique name.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateCategoryBody'
      responses:
        '201':
          $ref: '#/components/responses/CategoryResponse'
        '400':
          $ref: '#/components/responses/BadRequestError'
        '500':
          $ref: '#/components/responses/ServerError'
  /categories/{id}:
    get:
      tags:
        - Categories
      summary: Get category by ID
      description: Retrieve details of a single category by its UUID.
      parameters:
        - $ref: '#/components/parameters/CategoryId'
      responses:
        '200':
          $ref: '#/components/responses/CategoryResponse'
        '400':
          $ref: '#/components/responses/BadRequestError'
        '404':
          $ref: '#/components/responses/NotFoundError'
        '500':
          $ref: '#/components/responses/ServerError'
    patch:
      tags:
        - Categories
      summary: Update a category
      description: Update the name of an existing product category.
      parameters:
        - $ref: '#/components/parameters/CategoryId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateCategoryBody'
      responses:
        '200':
          $ref: '#/components/responses/CategoryResponse'
        '400':
          $ref: '#/components/responses/BadRequestError'
        '404':
          $ref: '#/components/responses/NotFoundError'
        '500':
          $ref: '#/components/responses/ServerError'
    delete:
      tags:
        - Categories
      summary: Delete a category
      description: Permanently delete a product category. Note that a category cannot be deleted if it contains products.
      parameters:
        - $ref: '#/components/parameters/CategoryId'
      responses:
        '204':
          description: Category deleted successfully (no content)
        '400':
          $ref: '#/components/responses/BadRequestError'
        '404':
          $ref: '#/components/responses/NotFoundError'
        '500':
          $ref: '#/components/responses/ServerError'
components:
  parameters:
    PageParam:
      name: page
      in: query
      required: false
      description: Page number (starts from 1)
      schema:
        type: integer
        minimum: 1
        default: 1
    LimitParam:
      name: limit
      in: query
      required: false
      description: Number of items per page
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 10
    SortParam:
      name: sort
      in: query
      required: false
      description: 'Sort fields. Use comma to separate. Prefix with - for descending. Example: -createdAt,name'
      schema:
        type: string
      example: '-createdAt'
    SearchParam:
      name: search
      in: query
      required: false
      description: Search term matched against name, email, or username
      schema:
        type: string
      example: ahmed
    UserId:
      name: id
      in: path
      required: true
      description: UUID of the user
      schema:
        type: string
        format: uuid
      example: a1b2c3d4-e5f6-7890-abcd-ef1234567890
    CompanyId:
      name: id
      in: path
      required: true
      description: UUID of the company
      schema:
        type: string
        format: uuid
      example: b2c3d4e5-f6a7-8901-bcde-f12345678901
    ProductId:
      name: id
      in: path
      required: true
      description: UUID of the product
      schema:
        type: string
        format: uuid
      example: d1b2c3d4-e5f6-7890-abcd-ef1234567890
    PlanId:
      name: id
      in: path
      required: true
      description: UUID of the plan
      schema:
        type: string
        format: uuid
      example: c1b2c3d4-e5f6-7890-abcd-ef1234567890
    SubscriptionId:
      name: id
      in: path
      required: true
      description: UUID of the subscription
      schema:
        type: string
      example: e1b2c3d4-e5f6-7890-abcd-ef1234567890
    CategoryId:
      name: id
      in: path
      required: true
      description: UUID of the category
      schema:
        type: string
        format: uuid
      example: c2d3e4f5-a6b7-8901-cdef-012345678901
  schemas:
    User:
      type: object
      properties:
        id:
          type: string
          format: uuid
          example: a1b2c3d4-e5f6-7890-abcd-ef1234567890
        name:
          type: string
          example: Ahmed Mohamed
        email:
          type: string
          format: email
          example: ahmed@example.com
        username:
          type: string
          example: ahmed_m
        phone:
          type: string
          nullable: true
          example: '01012345678'
        isActive:
          type: boolean
          example: true
        createdAt:
          type: string
          format: date-time
          example: '2026-06-10T10:00:00.000Z'
        updatedAt:
          type: string
          format: date-time
          example: '2026-06-10T12:00:00.000Z'
    CreateUserBody:
      type: object
      required:
        - name
        - email
        - username
        - password
      properties:
        name:
          type: string
          minLength: 2
          maxLength: 100
          example: Ahmed Mohamed
        email:
          type: string
          format: email
          example: ahmed@example.com
        username:
          type: string
          minLength: 3
          maxLength: 30
          pattern: ^[a-zA-Z0-9_]+$
          example: ahmed_m
        password:
          type: string
          minLength: 6
          example: secret123
        phone:
          type: string
          nullable: true
          example: '01012345678'
    UpdateUserBody:
      type: object
      properties:
        name:
          type: string
          minLength: 2
          maxLength: 100
          example: Ahmed Updated
        email:
          type: string
          format: email
          example: updated@example.com
        username:
          type: string
          minLength: 3
          maxLength: 30
          example: ahmed_updated
        password:
          type: string
          minLength: 6
          example: newpassword123
        phone:
          type: string
          nullable: true
