        '401':
          $ref: '#/components/responses/E401'
        '403':
          $ref: '#/components/responses/E403'
        '404':
          $ref: '#/components/responses/E404'
        '409':
          description: 'Coded error: INVOICE_NOT_REVIEWED'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CertError'
  /invoices/{id}/generate:
    post:
      tags:
        - Certificate Generation
      summary: Generate certificates
      description: |-
        Requires `ready` (or `generated` / `partially_failed` to regenerate — a new batch; final certificates are never touched). Creates the batch and its certificates in one transaction and queues `generateBatch`.

        Permission: `create_certificates`. Tenant-scoped: a system user passes `?companyId=`; another company's resource is **404**, never 403.
      parameters:
        - $ref: '#/components/parameters/Id'
        - $ref: '#/components/parameters/CompanyId-2'
      responses:
        '202':
          description: Accepted
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
              example:
                status: accepted
                data:
                  batchId: uuid
                  taskId: uuid
                  planned: 6
                  unassigned: 0
        '401':
          $ref: '#/components/responses/E401'
        '403':
          $ref: '#/components/responses/E403'
        '404':
          $ref: '#/components/responses/E404'
        '409':
          description: 'Coded error: INVOICE_NOT_READY, NOTHING_TO_GENERATE (+ unassigned, gaps)'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CertError'
  /certificate-batches/{id}:
    get:
      tags:
        - Certificate Generation
      summary: Batch progress + certificate cards
      description: |-
        `live` counts (planned, pending, rendered, failed, flagged, final), the frozen plan and one card per certificate.

        Permission: `read_certificates`. Tenant-scoped: a system user passes `?companyId=`; another company's resource is **404**, never 403.
      parameters:
        - $ref: '#/components/parameters/Id'
        - $ref: '#/components/parameters/CompanyId-2'
      responses:
        '200':
          description: Batch
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
        '401':
          $ref: '#/components/responses/E401'
        '403':
          $ref: '#/components/responses/E403'
        '404':
          $ref: '#/components/responses/E404'
  /certificate-batches/{id}/export:
    post:
      tags:
        - Certificate Generation
      summary: Build the batch ZIP
      description: |-
        One PDF per rendered certificate (a final one → its frozen PDF), named `{type}-{product}-{batch}.pdf`.

        Permission: `export_certificates`. Tenant-scoped: a system user passes `?companyId=`; another company's resource is **404**, never 403.
      parameters:
        - $ref: '#/components/parameters/Id'
        - $ref: '#/components/parameters/CompanyId-2'
      responses:
        '202':
          description: Accepted
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
              example:
                status: accepted
                data:
                  batchId: uuid
                  taskId: uuid
        '401':
          $ref: '#/components/responses/E401'
        '403':
          $ref: '#/components/responses/E403'
        '404':
          $ref: '#/components/responses/E404'
        '409':
          description: 'Coded error: BATCH_RUNNING'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CertError'
  /certificate-batches/{id}/zip:
    get:
      tags:
        - Certificate Generation
      summary: Download the batch ZIP
      description: |-
        Plan §20 I20. `Content-Disposition` is exposed to the browser.

        Permission: `export_certificates`. Tenant-scoped: a system user passes `?companyId=`; another company's resource is **404**, never 403.
      parameters:
        - $ref: '#/components/parameters/Id'
        - $ref: '#/components/parameters/CompanyId-2'
      responses:
        '200':
          description: ZIP
          content:
            application/zip:
              schema:
                type: string
                format: binary
        '401':
          $ref: '#/components/responses/E401'
        '403':
          $ref: '#/components/responses/E403'
        '404':
          description: 'Coded error: ZIP_NOT_EXPORTED'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CertError'
  /certificates:
    get:
      tags:
        - Certificates
      summary: List generated certificates
      description: 'Permission: `read_certificates`. Tenant-scoped: a system user passes `?companyId=`; another company''s resource is **404**, never 403.'
      parameters:
        - name: invoiceId
          in: query
          schema:
            type: string
            format: uuid
        - name: batchId
          in: query
          schema:
            type: string
            format: uuid
        - name: status
          in: query
          schema:
            type: string
            enum:
              - pending
              - draft
              - final
              - failed
        - name: certificateTypeId
          in: query
          schema:
            type: string
            format: uuid
        - name: flagged
          in: query
          schema:
            type: string
            enum:
              - 'true'
              - 'false'
        - name: q
          in: query
          schema:
            type: string
          description: product, batch or invoice number
        - name: page
          in: query
          schema:
            type: integer
            minimum: 1
        - name: limit
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 100
        - $ref: '#/components/parameters/CompanyId-2'
      responses:
        '200':
          description: Cards
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
        '401':
          $ref: '#/components/responses/E401'
        '403':
          $ref: '#/components/responses/E403'
  /certificates/{id}:
    get:
      tags:
        - Certificates
      summary: Get a certificate
      description: |-
        Current values (§10.4 shape), flags, the template's field definitions and the invoice lines it covers.

        Permission: `read_certificates`. Tenant-scoped: a system user passes `?companyId=`; another company's resource is **404**, never 403.
      parameters:
        - $ref: '#/components/parameters/Id'
        - $ref: '#/components/parameters/CompanyId-2'
      responses:
        '200':
          description: Certificate
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
              example:
                status: success
                data:
                  certificate:
                    id: uuid
                    status: draft
                    currentVersion: 3
                    flagCount: 1
                    values:
                      batch_no:
                        value: AVVS1124011
                        source:
                          kind: item
                          path: batchNo
                        resolved: AVVS1124011
                        origin: auto
                        flags: []
                        editedByUserId: null
                        editedAt: null
                    fields:
                      - key: batch_no
                        label: Batch number
                        required: true
        '401':
          $ref: '#/components/responses/E401'
        '403':
          $ref: '#/components/responses/E403'
        '404':
          $ref: '#/components/responses/E404'
  /certificates/{id}/html:
    get:
      tags:
        - Certificates
      summary: A version's static HTML
      description: |-
        Defaults to the current version. Served as `text/html` with `Content-Security-Policy: default-src 'none'; img-src data:; font-src data:; style-src 'unsafe-inline'` and `X-Content-Type-Options: nosniff`. Show it only inside the sandboxed `DocumentFrame` (plan §13.3).

        Permission: `read_certificates`. Tenant-scoped: a system user passes `?companyId=`; another company's resource is **404**, never 403.
      parameters:
        - $ref: '#/components/parameters/Id'
        - name: version
          in: query
          schema:
            type: integer
            minimum: 1
        - $ref: '#/components/parameters/CompanyId-2'
      responses:
        '200':
          description: HTML
          content:
            text/html:
              schema:
                type: string
        '401':
          $ref: '#/components/responses/E401'
        '403':
          $ref: '#/components/responses/E403'
        '404':
          $ref: '#/components/responses/E404'
  /certificates/{id}/thumbnail:
    get:
      tags:
        - Certificates
      summary: Current version thumbnail (PNG)
      description: 'Permission: `read_certificates`. Tenant-scoped: a system user passes `?companyId=`; another company''s resource is **404**, never 403.'
      parameters:
        - $ref: '#/components/parameters/Id'
        - $ref: '#/components/parameters/CompanyId-2'
      responses:
        '200':
          description: PNG
          content:
            image/png:
              schema:
                type: string
                format: binary
        '401':
          $ref: '#/components/responses/E401'
        '403':
          $ref: '#/components/responses/E403'
        '404':
          $ref: '#/components/responses/E404'
  /certificates/{id}/values:
    patch:
      tags:
        - Certificates
      summary: Edit values → new version
      description: |-
        Optimistic concurrency on `expectedVersion`. The server re-renders and stores version N+1; `changeSummary` = `key: old → new`.

        Permission: `update_certificates`. Tenant-scoped: a system user passes `?companyId=`; another company's resource is **404**, never 403.
      parameters:
        - $ref: '#/components/parameters/Id'
        - $ref: '#/components/parameters/CompanyId-2'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: true
            example:
              expectedVersion: 3
              changes:
                batch_no: AVVS1124011
                expiry: 06/2027
      responses:
        '200':
          description: New version
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
              example:
                status: success
                data:
                  version: 4
                  values: {}
                  flags:
                    expiry: []
                  flagCount: 0
                  changeSummary: 'batch_no: … → …'
        '401':
          $ref: '#/components/responses/E401'
        '403':
          $ref: '#/components/responses/E403'
        '404':
          $ref: '#/components/responses/E404'
        '409':
          description: 'Coded error: VERSION_CONFLICT (+ currentVersion), CERTIFICATE_FINAL, CERTIFICATE_NOT_READY'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CertError'
        '422':
          description: 'Coded error: UNKNOWN_FIELD, VALUE_TOO_LONG'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CertError'
  /certificates/{id}/fields/{key}/reset:
    post:
      tags:
        - Certificates
      summary: Reset one field from its source → new version
      description: |-
        `changeSource: regenerate_field`.

        Permission: `update_certificates`. Tenant-scoped: a system user passes `?companyId=`; another company's resource is **404**, never 403.
      parameters:
        - $ref: '#/components/parameters/Id'
        - name: key
          in: path
          required: true
          schema:
            type: string
        - $ref: '#/components/parameters/CompanyId-2'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: true
            example:
              expectedVersion: 4
      responses:
        '200':
          description: New version
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
        '401':
          $ref: '#/components/responses/E401'
        '403':
          $ref: '#/components/responses/E403'
        '404':
          $ref: '#/components/responses/E404'
        '409':
          description: 'Coded error: VERSION_CONFLICT, CERTIFICATE_FINAL'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CertError'
  /certificates/{id}/versions:
    get:
      tags:
        - Certificates
      summary: Version history
      description: |-
        Newest first: changeSource, changedBy, changeSummary, flagCount, hasPdf.

        Permission: `read_certificates`. Tenant-scoped: a system user passes `?companyId=`; another company's resource is **404**, never 403.
      parameters:
        - $ref: '#/components/parameters/Id'
        - $ref: '#/components/parameters/CompanyId-2'
      responses:
        '200':
          description: Versions
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
        '401':
          $ref: '#/components/responses/E401'
        '403':
          $ref: '#/components/responses/E403'
        '404':
          $ref: '#/components/responses/E404'
  /certificates/{id}/versions/{n}/restore:
    post:
      tags:
        - Certificates
      summary: Restore version n → new version (forward-only)
      description: 'Permission: `update_certificates`. Tenant-scoped: a system user passes `?companyId=`; another company''s resource is **404**, never 403.'
      parameters:
        - $ref: '#/components/parameters/Id'
        - name: 'n'
          in: path
          required: true
          schema:
            type: integer
            minimum: 1
        - $ref: '#/components/parameters/CompanyId-2'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: true
            example:
              expectedVersion: 5
      responses:
        '200':
          description: New version
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
        '401':
          $ref: '#/components/responses/E401'
        '403':
          $ref: '#/components/responses/E403'
        '404':
          $ref: '#/components/responses/E404'
        '409':
          description: 'Coded error: VERSION_CONFLICT, ALREADY_CURRENT, CERTIFICATE_FINAL'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CertError'
  /certificates/{id}/export-pdf:
    post:
      tags:
        - Certificates
      summary: Render the current version's PDF
      description: |-
        P7/P8: screen media, `@page` = the design's page size, no margin, one design page per PDF page, real text.

        Permission: `export_certificates`. Tenant-scoped: a system user passes `?companyId=`; another company's resource is **404**, never 403.
      parameters:
        - $ref: '#/components/parameters/Id'
        - $ref: '#/components/parameters/CompanyId-2'
      responses:
        '202':
          description: Accepted
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
              example:
                status: accepted
                data:
                  certificateId: uuid
                  versionNumber: 3
                  taskId: uuid
        '401':
          $ref: '#/components/responses/E401'
        '403':
          $ref: '#/components/responses/E403'
        '404':
          $ref: '#/components/responses/E404'
        '409':
          description: 'Coded error: CERTIFICATE_NOT_READY'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CertError'
  /certificates/{id}/pdf:
    get:
      tags:
        - Certificates
      summary: Download the PDF
      description: |-
        A final certificate → its frozen PDF; otherwise the exported PDF of the current (or `?version=`) version. `Content-Disposition: attachment; filename="{type}-{product}-{batch}.pdf"`, exposed to the browser.

        Permission: `export_certificates`. Tenant-scoped: a system user passes `?companyId=`; another company's resource is **404**, never 403.
      parameters:
        - $ref: '#/components/parameters/Id'
        - name: version
          in: query
          schema:
            type: integer
            minimum: 1
        - $ref: '#/components/parameters/CompanyId-2'
      responses:
        '200':
          description: PDF
          content:
            application/pdf:
              schema:
                type: string
                format: binary
        '401':
          $ref: '#/components/responses/E401'
        '403':
          $ref: '#/components/responses/E403'
        '404':
          description: 'Coded error: PDF_NOT_EXPORTED'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CertError'
  /certificates/{id}/finalize:
    post:
      tags:
        - Certificates
      summary: Finalize (freeze)
      description: |-
        Refused while blocking flags remain (`missing` on a required field, `overflow`, `glyph:*`). Exports the PDF if missing and freezes it; who/when recorded. A final certificate rejects edits.

        Permission: `update_certificates`. Tenant-scoped: a system user passes `?companyId=`; another company's resource is **404**, never 403.
      parameters:
        - $ref: '#/components/parameters/Id'
        - $ref: '#/components/parameters/CompanyId-2'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: true
            example:
              expectedVersion: 6
      responses:
        '200':
          description: Certificate
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
        '401':
          $ref: '#/components/responses/E401'
        '403':
          $ref: '#/components/responses/E403'
        '404':
          $ref: '#/components/responses/E404'
        '409':
          description: 'Coded error: CERTIFICATE_FLAGGED (+ flags), CERTIFICATE_FINAL, VERSION_CONFLICT'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CertError'
  /certificates/{id}/duplicate:
    post:
      tags:
        - Certificates
      summary: Duplicate as a new draft
      description: |-
        The way to change a final certificate (plan §20 I20).

        Permission: `update_certificates`. Tenant-scoped: a system user passes `?companyId=`; another company's resource is **404**, never 403.
      parameters:
        - $ref: '#/components/parameters/Id'
        - $ref: '#/components/parameters/CompanyId-2'
      responses:
        '201':
          description: Draft
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
              example:
                status: success
                data:
                  certificateId: uuid
                  duplicatedFrom: uuid
        '401':
          $ref: '#/components/responses/E401'
        '403':
          $ref: '#/components/responses/E403'
        '404':
          $ref: '#/components/responses/E404'
  /certificate-metrics:
    get:
      tags:
        - Operations
      summary: Operational metrics (§15)
      description: |-
        Conversion ms, prepare pass rate, render ms per certificate, flags per batch, extraction failures by reason — for the caller's company.

        Permission: `read_certificates`. Tenant-scoped: a system user passes `?companyId=`; another company's resource is **404**, never 403.
      parameters:
        - name: days
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 365
        - $ref: '#/components/parameters/CompanyId-2'
      responses:
        '200':
          description: Metrics
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
        '401':
          $ref: '#/components/responses/E401'
        '403':
          $ref: '#/components/responses/E403'
  /health:
    get:
      tags:
        - Operations
      summary: Health
      description: Public. Liveness plus converter (pdf2htmlex) reachability — booleans and timings only.
      parameters: []
      responses:
        '200':
          description: Health
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
              example:
                status: ok
                time: '2026-10-18T10:00:00.000Z'
                converter:
                  reachable: true
                  ms: 4
                  toolVersion: 0.18.8.rc1
components:
  schemas:
    LoginBody:
      type: object
      required:
        - username
        - password
      properties:
        username:
          type: string
          description: The user's username or email
          example: admin
        password:
          type: string
          description: The user's password
          example: securepassword123
    LoginResponseData:
      type: object
      properties:
        token:
          type: string
          example: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9...
        user:
          type: object
          properties:
            id:
              type: string
              format: uuid
            name:
              type: string
            username:
              type: string
            email:
              type: string
            phone:
              type: string
              nullable: true
            role:
              type: object
              properties:
                id:
                  type: string
                  format: uuid
                name:
                  type: string
                permissions:
                  type: array
                  items:
                    type: string
    User:
      type: object
      properties:
        id:
          type: string
          format: uuid
          example: a1b2c3d4-e5f6-7890-abcd-ef1234567890
        name:
          type: string
          example: Ahmed Mohamed
        email:
          type: string
          format: email
          example: ahmed@example.com
        username:
          type: string
          example: ahmed_m
        phone:
          type: string
          nullable: true
          example: '01012345678'
        isActive:
          type: boolean
          example: true
        createdAt:
          type: string
          format: date-time
          example: '2026-06-10T10:00:00.000Z'
        updatedAt:
          type: string
          format: date-time
          example: '2026-06-10T12:00:00.000Z'
    CreateUserBody:
      type: object
      required:
        - name
        - email
      properties:
        name:
          type: string
          minLength: 2
          maxLength: 100
          example: Ahmed Mohamed
        email:
          type: string
          format: email
          example: ahmed@example.com
        username:
          type: string
          minLength: 3
          maxLength: 30
          pattern: ^[a-zA-Z0-9_]+$
          example: ahmed_m
        password:
          type: string
          minLength: 6
          example: secret123
        phone:
          type: string
          nullable: true
          example: '01012345678'
    UpdateUserBody:
      type: object
      properties:
        name:
          type: string
          minLength: 2
          maxLength: 100
          example: Ahmed Updated
        email:
          type: string
          format: email
          example: updated@example.com
        username:
          type: string
          minLength: 3
          maxLength: 30
          example: ahmed_updated
        password:
          type: string
          minLength: 6
          example: newpassword123
        phone:
          type: string
          nullable: true
          example: '01098765432'
        isActive:
          type: boolean
          example: false
    Role:
      type: object
      properties:
        id:
          type: string
          format: uuid
          example: da688042-3c7e-4537-8b88-6c060d0cdf7a
        name:
          type: string
          example: Admin
        description:
          type: string
          nullable: true
          example: Super Administrator with full system permissions
        createdAt:
          type: string
          format: date-time
          example: '2026-06-10T10:00:00.000Z'
        updatedAt:
          type: string
          format: date-time
          example: '2026-06-10T12:00:00.000Z'
    CreateRoleBody:
      type: object
      required:
        - name
      properties:
        name:
          type: string
          minLength: 2
          maxLength: 50
          example: Manager
        description:
          type: string
          maxLength: 255
          example: Manager role with moderate permissions
        permissions:
          type: array
          items:
            type: string
            format: uuid
          example:
            - da688042-3c7e-4537-8b88-6c060d0cdf7a
        permissionSlugs:
          type: array
          items:
            type: string
          example:
            - create_users
            - read_users
    UpdateRoleBody:
      type: object
      properties:
        name:
          type: string
          minLength: 2
          maxLength: 50
          example: Senior Manager
        description:
          type: string
          maxLength: 255
          example: Updated manager role description
        permissions:
          type: array
          items:
            type: string
            format: uuid
        permissionSlugs:
          type: array
          items:
            type: string
    Company:
      type: object
      properties:
        id:
          type: string
          format: uuid
          example: b2c3d4e5-f6a7-8901-bcde-f12345678901
        name:
          type: string
          example: Acme Corp
        username:
          type: string
          example: acme_corp
        email:
          type: string
          format: email
          nullable: true
          example: info@acme.com
        phone:
          type: string
          nullable: true
          example: '01012345678'
        address:
          type: string
          nullable: true
          example: 123 Main St, Cairo, Egypt
        logoUrl:
          type: string
          nullable: true
          example: https://example.com/logos/acme.png
        isActive:
          type: boolean
          example: true
        createdAt:
          type: string
          format: date-time
          example: '2026-06-10T10:00:00.000Z'
        updatedAt:
