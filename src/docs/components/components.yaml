            type: string
        regulatoryDocIds:
          type: array
          items:
            type: string
        matchTier:
          type: string
          nullable: true
        generationMeta:
          type: object
          nullable: true
          description: Includes `promptHash` for labels generated from Phase 9 onward; null/absent on older labels.
        riskScore:
          type: integer
          example: 35
        autonomyTier:
          type: string
          enum: [auto_approve, batch_review, mandatory_review, dual_review]
        shadowRunId:
          type: string
          nullable: true
        promotedToReferenceId:
          type: string
          nullable: true
        currentVersion:
          type: integer
        needsReview:
