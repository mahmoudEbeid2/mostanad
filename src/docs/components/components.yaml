    BackgroundTask:
      type: object
      description: >-
        Every long-running label-engine operation (label generation,
        reference-label extraction, regulatory-document extraction, PDF/image
        label verification) runs through this same row. Poll
        `GET /background-tasks/{id}` until `status` is `completed` or
        `failed`; `result` is a different shape per `type` — see the specific
        endpoint's docs for what `result` looks like once `status` is
        `completed`.
      properties:
        id:
          type: string
          format: uuid
        type:
          type: string
          example: "label_generation"
          description: 'One of: catalog_upload, label_verification, certificate_generation, regulatory_document_extraction, reference_label_extraction, label_generation.'
        status:
          type: string
          enum: [pending, processing, completed, failed]
        result:
          type: object
          nullable: true
          description: Only populated once status is "completed". Shape depends on `type` — see the endpoint that created this task.
        error:
          type: string
          nullable: true
          description: Only populated once status is "failed".
        companyId:
          type: string
          nullable: true
        brandId:
          type: string
