    ConflictError:
      description: >-
        Version conflict — either the caller's `expectedVersion` is stale
        (label moved on since it was read), the label/approval/document is
        already in the target state, or (label patch/chat endpoints only)
        applying the change would introduce a NEW validation failure. For
        the last case the response envelope's top-level `status` is still
        `"success"` — check `data.status === "conflict"` instead; see
        `PatchConflict`.
      content:
        application/json:
          schema:
            oneOf:
              - type: object
                properties:
                  status:
                    type: string
                    example: "fail"
                  message:
                    type: string
                    example: "Version conflict: expected 3, label is now at 4. Reload before editing."
              - type: object
                properties:
                  status:
                    type: string
                    example: "success"
                  data:
                    allOf:
                      - $ref: '#/components/schemas/PatchConflict'
                      - type: object
                        properties:
                          intent:
                            type: string
                            enum: [edit]

    UnprocessableEntityError:
      description: >-
        The request was well-formed but rejected by a business rule (a
        structurally invalid patch, an approval gate, a coverage/approval
        precondition). `message` is human-readable and, for the label patch
        protocol, may concatenate multiple violations with "; ".
      content:
        application/json:
          schema:
            type: object
            properties:
              status:
                type: string
                example: "fail"
              message:
                type: string
                example: "Cannot approve a label with validation errors."

    LockedError:
      description: The label is mid-generation and cannot accept edits yet.
      content:
        application/json:
          schema:
            type: object
            properties:
              status:
                type: string
                example: "fail"
              message:
                type: string
                example: "This label is still generating."

    ServiceUnavailableError:
      description: The underlying AI call failed or timed out. Safe to retry the whole request.
      content:
        application/json:
          schema:
            type: object
            properties:
              status:
                type: string
                example: "fail"
              message:
                type: string
                example: "AI service temporarily unavailable — could not process this message: <details>"

    TaskAcceptedResponse:
      description: The operation was queued as a BackgroundTask. Poll GET /background-tasks/{id} for the result.
      content:
        application/json:
          schema:
            type: object
            properties:
              status:
