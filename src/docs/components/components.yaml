          minLength: 2
          maxLength: 50
          example: "Senior Manager"
        description:
          type: string
          maxLength: 255
          example: "Updated manager role description"
        permissions:
          type: array
          items:
            type: string
            format: uuid
        permissionSlugs:
          type: array
          items:
            type: string

    # ==========================================================
    # Label engine (Phases 1-9) — shared building-block schemas
    # ==========================================================

    LocalizedText:
      type: object
      description: >-
        A bilingual text field. `translations` keys are language codes (at
        minimum `en`/`ar`); `primary` names which key is the canonical
        source-of-truth language for this value.
      required:
        - translations
        - primary
      properties:
        translations:
          type: object
          additionalProperties:
            type: string
          example: { en: "For veterinary use only", ar: "للاستخدام البيطري فقط" }
        primary:
          type: string
          example: "en"

    LabelActiveIngredient:
      type: object
      description: LocalizedText plus dosage fields — not a plain LocalizedText. Distinct from the plain product-catalog ActiveIngredient schema.
      required:
        - translations
        - primary
        - amount
      properties:
        translations:
          type: object
          additionalProperties:
            type: string
        primary:
          type: string
          example: "en"
        amount:
          type: string
          description: Never empty — "q.s." when a precise quantity is unavailable.
          example: "500"
        unit:
          type: string
          nullable: true
          example: "mg"
        normalizedName:
          type: string
          nullable: true
          example: "amoxicillin_trihydrate"

    TargetAnimalSpecies:
      type: object
      description: LocalizedText plus the resolved species list and how it was resolved.
      required:
        - translations
        - primary
        - list
        - source
      properties:
        translations:
          type: object
          additionalProperties:
            type: string
        primary:
          type: string
        list:
          type: array
          minItems: 1
          items:
            type: string
          example: ["poultry", "cattle"]
        source:
          type: string
          enum: [confirmed, reference, inferred]

    LabelAnalysis:
      type: object
      nullable: true
      properties:
        basis:
          type: string
          example: "per 1 kg"
        items:
          type: array
          items:
            type: object
            properties:
              name:
                type: string
              value:
                type: string

    LabelData:
      type: object
      description: >-
        A `labelSchema`-conformant label body (schemaVersion `vet-label@2.0.0`).
        Every text field is bilingual (`LocalizedText`) unless noted. This is
        the shape of `GeneratedLabel.labelData`, `LabelVersion.labelData`, and
        the `label` key returned by `POST /reference-labels/generate-text-ai`.
      properties:
        schemaVersion:
          type: string
          example: "vet-label@2.0.0"
        productType:
          type: string
          enum: [veterinary_drug, feed_additive, premix, supplement, compound_feed]
        productName:
          $ref: '#/components/schemas/LocalizedText'
        pharmaceuticalForm:
          type: object
          nullable: true
          allOf:
            - $ref: '#/components/schemas/LocalizedText'
        strength:
          type: object
          nullable: true
          allOf:
            - $ref: '#/components/schemas/LocalizedText'
        feedClassification:
          type: object
          nullable: true
          allOf:
            - $ref: '#/components/schemas/LocalizedText'
        activeIngredients:
          type: array
          minItems: 1
          items:
            $ref: '#/components/schemas/LabelActiveIngredient'
        excipients:
          type: array
          items:
            $ref: '#/components/schemas/LocalizedText'
        analysis:
          $ref: '#/components/schemas/LabelAnalysis'
        targetAnimalSpecies:
          $ref: '#/components/schemas/TargetAnimalSpecies'
        aimOfUse:
          $ref: '#/components/schemas/LocalizedText'
        indications:
          type: array
          items:
            $ref: '#/components/schemas/LocalizedText'
        routeOfAdministration:
          type: object
          nullable: true
          allOf:
            - $ref: '#/components/schemas/LocalizedText'
        directionOfUse:
          $ref: '#/components/schemas/LocalizedText'
        contraindications:
          type: object
          nullable: true
          allOf:
            - $ref: '#/components/schemas/LocalizedText'
        warnings:
          type: array
          items:
            $ref: '#/components/schemas/LocalizedText'
        sideEffects:
          type: object
          nullable: true
          allOf:
            - $ref: '#/components/schemas/LocalizedText'
        withdrawalPeriod:
          type: object
          nullable: true
          allOf:
            - $ref: '#/components/schemas/LocalizedText'
          description: >-
            Never filled from web lookup or model knowledge — confirmed
            source or matched reference only, otherwise empty and the field
            FAILs validation.
        userSafety:
          type: array
          items:
            $ref: '#/components/schemas/LocalizedText'
        storage:
          $ref: '#/components/schemas/LocalizedText'
        shelfLifeAfterOpening:
          type: object
          nullable: true
          allOf:
            - $ref: '#/components/schemas/LocalizedText'
        disposal:
          type: object
          nullable: true
          allOf:
            - $ref: '#/components/schemas/LocalizedText'
        netWeight:
          $ref: '#/components/schemas/LocalizedText'
        packaging:
          type: object
          nullable: true
          allOf:
            - $ref: '#/components/schemas/LocalizedText'
        registrationNumber:
          type: string
          nullable: true
        marketingAuthorisationHolder:
          type: object
          nullable: true
          allOf:
            - $ref: '#/components/schemas/LocalizedText'
        manufacturer:
          type: object
          nullable: true
          allOf:
            - $ref: '#/components/schemas/LocalizedText'
        importer:
          type: object
          nullable: true
          allOf:
            - $ref: '#/components/schemas/LocalizedText'
        countryOfProduction:
          type: object
          nullable: true
          allOf:
            - $ref: '#/components/schemas/LocalizedText'
        batchNo:
          type: string
          nullable: true
        productionDate:
          type: string
          nullable: true
        expiryDate:
          type: string
          nullable: true
        prescriptionStatus:
          type: string
          enum: [POM, OTC, VFD, NA]
          default: NA
        usageDeclaration:
          type: array
          items:
            $ref: '#/components/schemas/LocalizedText'
        keepOutOfReachOfChildren:
          type: boolean
          default: true
        estimatedFields:
          type: array
          items:
            type: string
          description: >-
            labelSchema field-path names the model marked as estimated
            (not confirmed from a source). Every entry here must be signed
            (`signedEstimatedFields`) before the label can be approved.
          example: ["strength", "withdrawalPeriod"]

    FieldVerdict:
      type: object
      description: One verdict from the deterministic validation engine, per labelSchema field path.
      required:
        - path
        - label
        - status
        - presence
        - severity
        - layer
      properties:
        path:
          type: string
          description: Dot/bracket path into labelSchema, e.g. "activeIngredients[0].amount". A few synthetic paths exist for cross-field checks — "_regulatory", "_localized_text", "_placeholder_x".
          example: "withdrawalPeriod"
        label:
          type: object
          properties:
            en:
              type: string
            ar:
              type: string
        status:
          type: string
          enum: [PASS, FAIL, WARN, NOT_APPLICABLE, UNVERIFIABLE]
        presence:
          type: string
          enum: [PRESENT, MISSING, EMPTY, INVALID]
        severity:
          type: string
          enum: [error, warning]
        layer:
          type: string
          enum: [schema, applicability, regulatory_rule, coherence, semantic, product_match, extraction, plausibility]
          description: Which validation layer produced this verdict.
        comparison:
          type: string
          enum: [regulatory, data_mismatch, coherence, plausibility]
          description: What was compared against what (§14.5.1) — label-vs-rules, label-vs-product, label-vs-itself, or label-vs-external-knowledge.
        whySource:
          type: string
          enum: [regulation, your_data, structure, plausibility]
          description: >-
            What the user is being told to trust — NOT the same axis as `comparison`.
            A regulation stops a shipment; a disagreement with the caller's own
            catalogue ("your_data") might mean the catalogue is wrong, not the label.
            "structure" covers both internal label coherence and internal
            completeness heuristics (fieldCatalog) that aren't a citable regulation.
        triggeredBy:
          type: string
          nullable: true
          description: For a conditional rule/field requirement, the condition in plain words, e.g. "this label lists poultry and calves, which are food-producing". Null when the verdict isn't conditional.
        observed:
          type: string
          nullable: true
          description: For a data_mismatch verdict, the value found on the label. Null otherwise.
        expected:
          type: string
          nullable: true
          description: For a data_mismatch verdict, the value on the matched product record. Null otherwise.
        ruleKey:
          type: string
          nullable: true
          example: "APPLICABILITY.WITHDRAWALPERIOD.REQUIRED"
        message:
          type: string
          nullable: true
        citation:
          type: string
          nullable: true
          description: Populated on every whySource:"regulation" FAIL/WARN verdict — verbatim quote from the source document. A regulation verdict without one is a bug (rejected upstream at rule ingestion, Invariant #4).
        sourceDocumentId:
          type: string
          nullable: true
          description: Only ever set for layer "regulatory_rule"/"semantic".
        autoFixable:
          type: boolean
        suggestion:
          type: string
          nullable: true
          description: Reserved — never populated by any code path as of Phase 9.
        remediation:
          type: object
          nullable: true
          description: Set on every FAIL verdict (§14.5.5). Never set on a restricted field (withdrawalPeriod, strength, registrationNumber, activeIngredients) unless source is "rule" or "product_row".
          properties:
            action:
              type: string
              enum: [add, correct, review]
            suggested:
              type: string
              nullable: true
              description: A concrete replacement value. Always null for the restricted fields unless source is "rule" or "product_row" — never a guess.
            source:
              type: string
              enum: [rule, product_row, reference, common_practice, none]
              description: >-
                Where the fix came from. "common_practice" is an unsourced,
                low-confidence convention — the UI must mark it as unverified,
                never present it as a sourced fix. "none" means "this is wrong
                and there is no sourced fix" — legitimate, preferred over inventing one.
            sourceRef:
              type: object
              nullable: true
            confidence:
              type: number
              minimum: 0
              maximum: 1
              description: "How much to trust `suggested`, derived from `source`: rule/product_row=1, reference=0.6, common_practice=0.3, none=0."

    ValidationReport:
      type: object
      description: >-
        The deterministic validation engine's output (§10.2). Returned by
        `POST /labels/:id/validate`, `GET /labels/:id/validation`, embedded
        in chat/patch/restore/replay responses, and by `POST
        /products/verify-label` (which resolves the same country-scoped
        approved ruleset generation uses — `rulesetIds` is empty only when no
        ruleset is approved for that country, see `regulatoryStatus` on the
        verify-label response).
      properties:
        id:
          type: string
          format: uuid
          description: Present when this is a persisted ValidationReport row (not the in-memory verify-label shape).
        labelId:
          type: string
          format: uuid
        versionNumber:
          type: integer
        passed:
          type: boolean
        errorCount:
          type: integer
        warningCount:
          type: integer
        verdicts:
          type: array
          items:
            $ref: '#/components/schemas/FieldVerdict'
        coveragePercent:
          type: number
          nullable: true
          description: Always null as of Phase 9 — reserved, not yet populated by any validator.
        engineVersion:
          type: string
          example: "label-validation-engine@1.0.0"
        rulesetIds:
          type: array
          items:
            type: string
          description: IDs of the approved RegulatoryRule rows applied. Empty when no approved ruleset exists for the resolved country.
        aiAssisted:
          type: boolean
          description: Always false as of Phase 9 — reserved for the semantic (AI) validation layer, not yet wired in.
        createdAt:
          type: string
          format: date-time

    GeneratedLabel:
      type: object
      properties:
        id:
