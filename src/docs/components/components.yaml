components:
  schemas:
    User:
      type: object
      properties:
        id:
          type: string
          format: uuid
          example: "a1b2c3d4-e5f6-7890-abcd-ef1234567890"
        name:
          type: string
          example: "Ahmed Mohamed"
        email:
          type: string
          format: email
          example: "ahmed@example.com"
        username:
          type: string
          example: "ahmed_m"
        phone:
          type: string
          nullable: true
          example: "01012345678"
        isActive:
          type: boolean
          example: true
        createdAt:
          type: string
          format: date-time
          example: "2026-06-10T10:00:00.000Z"
        updatedAt:
          type: string
          format: date-time
          example: "2026-06-10T12:00:00.000Z"

    CreateUserBody:
      type: object
      required:
        - name
        - email
        - username
        - password
      properties:
        name:
          type: string
          minLength: 2
          maxLength: 100
          example: "Ahmed Mohamed"
        email:
          type: string
          format: email
          example: "ahmed@example.com"
        username:
          type: string
          minLength: 3
          maxLength: 30
          pattern: "^[a-zA-Z0-9_]+$"
          example: "ahmed_m"
        password:
          type: string
          minLength: 6
          example: "secret123"
        phone:
          type: string
          nullable: true
          example: "01012345678"

    UpdateUserBody:
      type: object
      properties:
        name:
          type: string
          minLength: 2
          maxLength: 100
          example: "Ahmed Updated"
        email:
          type: string
          format: email
          example: "updated@example.com"
        username:
          type: string
          minLength: 3
          maxLength: 30
          example: "ahmed_updated"
        password:
          type: string
          minLength: 6
          example: "newpassword123"
        phone:
          type: string
          nullable: true
          example: "01098765432"
        isActive:
          type: boolean
          example: false

    Company:
      type: object
      properties:
        id:
          type: string
          format: uuid
          example: "b2c3d4e5-f6a7-8901-bcde-f12345678901"
        name:
          type: string
          example: "Acme Corp"
        username:
          type: string
          example: "acme_corp"
        email:
          type: string
          format: email
          nullable: true
          example: "info@acme.com"
        phone:
          type: string
          nullable: true
          example: "01012345678"
        address:
          type: string
          nullable: true
          example: "123 Main St, Cairo, Egypt"
        logoUrl:
          type: string
          nullable: true
          example: "https://example.com/logos/acme.png"
        isActive:
          type: boolean
          example: true
        createdAt:
          type: string
          format: date-time
          example: "2026-06-10T10:00:00.000Z"
        updatedAt:
          type: string
          format: date-time
          example: "2026-06-10T12:00:00.000Z"

    CreateCompanyBody:
      type: object
      required:
        - name
        - username
        - password
      properties:
        name:
          type: string
          minLength: 2
          maxLength: 100
          example: "Acme Corp"
        username:
          type: string
          minLength: 3
          maxLength: 30
          pattern: "^[a-zA-Z0-9_]+$"
          example: "acme_corp"
        password:
          type: string
          minLength: 6
          example: "secret123"
        email:
          type: string
          format: email
          nullable: true
          example: "info@acme.com"
        phone:
          type: string
          nullable: true
          example: "01012345678"
        address:
          type: string
          nullable: true
          example: "123 Main St, Cairo, Egypt"
        logoUrl:
          type: string
          nullable: true
          example: "https://example.com/logos/acme.png"

    UpdateCompanyBody:
      type: object
      properties:
        name:
          type: string
          minLength: 2
          maxLength: 100
          example: "Acme Corp Updated"
        username:
          type: string
          minLength: 3
          maxLength: 30
          example: "acme_updated"
        password:
          type: string
          minLength: 6
          example: "newpassword123"
        email:
          type: string
          format: email
          nullable: true
          example: "updated@acme.com"
        phone:
          type: string
          nullable: true
          example: "01098765432"
        address:
          type: string
          nullable: true
          example: "456 Side St, Alexandria, Egypt"
        logoUrl:
          type: string
          nullable: true
          example: "https://example.com/logos/acme-new.png"
        isActive:
          type: boolean
          example: false

    Plan:
      type: object
      properties:
        id:
          type: string
          format: uuid
          example: "c1b2c3d4-e5f6-7890-abcd-ef1234567890"
        name:
          type: string
          example: "Enterprise"
        description:
          type: string
          nullable: true
          example: "Full access for large teams"
        price:
          type: string
          example: "99.99"
        interval:
          type: string
          enum: [month, year]
          example: "month"
        features:
          type: array
          items:
            type: string
          example: ["unlimited certificates", "custom domains", "24/7 support"]
        isActive:
          type: boolean
          example: true
        createdAt:
          type: string
          format: date-time
          example: "2026-06-10T10:00:00.000Z"
        updatedAt:
          type: string
          format: date-time
          example: "2026-06-10T12:00:00.000Z"

    CreatePlanBody:
      type: object
      required:
        - name
        - price
        - interval
      properties:
        name:
          type: string
          minLength: 2
          maxLength: 50
          example: "Enterprise"
        description:
          type: string
          nullable: true
          example: "Full access for large teams"
        price:
          type: number
          example: 99.99
        interval:
          type: string
          enum: [month, year]
          example: "month"
        features:
          type: array
          items:
            type: string
          example: ["unlimited certificates", "custom domains", "24/7 support"]

    UpdatePlanBody:
      type: object
      properties:
        name:
          type: string
          minLength: 2
          maxLength: 50
          example: "Enterprise Updated"
        description:
          type: string
          nullable: true
          example: "Updated description text"
        price:
          type: number
          example: 129.99
        interval:
          type: string
          enum: [month, year]
          example: "year"
        features:
          type: array
          items:
            type: string
          example: ["unlimited certificates", "custom domains"]
        isActive:
          type: boolean
          example: false

    ActiveIngredient:
      type: object
      required:
        - name
        - concentration
      properties:
        name:
          type: string
          example: "L-Lysine"
        concentration:
          type: string
          example: "98.5%"

    ProductSpecification:
      type: object
      required:
        - type
        - values
      properties:
        type:
          type: string
          example: "Specification"
        values:
          type: object
          additionalProperties:
            type: string
          example:
            Moisture: "max 12%"
            Purity: "min 98.5%"

    Category:
      type: object
      properties:
        id:
          type: string
          format: uuid
          example: "c2d3e4f5-a6b7-8901-cdef-012345678901"
        name:
          type: string
          example: "CONCENTRATES"
        createdAt:
          type: string
          format: date-time
          example: "2026-06-11T10:00:00.000Z"
        updatedAt:
          type: string
          format: date-time
          example: "2026-06-11T12:00:00.000Z"

    Product:
      type: object
      properties:
        id:
          type: string
          format: uuid
          example: "d1b2c3d4-e5f6-7890-abcd-ef1234567890"
        name:
          type: string
          example: "BROILER STARTER CONCENTRATE 5%"
        productCode:
          type: string
          nullable: true
          example: "BSC-005"
        description:
          type: string
          nullable: true
          example: "Premium starter concentrate for broilers"
        indications:
          type: string
          nullable: true
          example: "Promotes early stage growth and immunity"
        targetSpecies:
          type: array
          items:
            type: string
          example: ["Broiler", "Poultry"]
        physicalForm:
          type: string
          nullable: true
          example: "Powder"
        appearance:
          type: string
          nullable: true
          example: "Yellowish-brown powder"
        activeIngredients:
          type: array
          nullable: true
          items:
            $ref: '#/components/schemas/ActiveIngredient'
        dosage:
          type: string
          nullable: true
          example: "50 kg per ton of feed"
        mixingInstructions:
          type: string
          nullable: true
          example: "Mix thoroughly with yellow corn and soybean meal"
        withdrawalPeriod:
          type: string
          nullable: true
          example: "5 days before slaughter"
        contraindications:
          type: string
          nullable: true
          example: "Do not feed to horses or other equids"
        userSafety:
          type: array
          items:
            type: string
          example: ["Wear protective mask", "Avoid direct contact with eyes"]
        storage:
          type: string
          nullable: true
          example: "Store in a cool, dry place"
        packaging:
          type: string
          nullable: true
          example: "25KG Bag"
        registrationNumber:
          type: string
          nullable: true
          example: "REG-2026-9876"
        origin:
          type: string
          nullable: true
          example: "Egypt"
        producer:
          type: string
          nullable: true
          example: "Addvet Egypt"
        specifications:
          $ref: '#/components/schemas/ProductSpecification'
          nullable: true
        categoryId:
          type: string
          format: uuid
          nullable: true
          example: "c2d3e4f5-a6b7-8901-cdef-012345678901"
        category:
          $ref: '#/components/schemas/Category'
          nullable: true
        companyId:
          type: string
          format: uuid
          example: "b2c3d4e5-f6a7-8901-bcde-f12345678901"
        createdAt:
          type: string
          format: date-time
          example: "2026-06-11T10:00:00.000Z"
        updatedAt:
          type: string
          format: date-time
          example: "2026-06-11T12:00:00.000Z"

    CreateProductBody:
      type: object
      required:
        - name
      properties:
        name:
          type: string
          minLength: 2
          example: "BROILER STARTER CONCENTRATE 5%"
        productCode:
          type: string
          nullable: true
          example: "BSC-005"
        description:
          type: string
          nullable: true
          example: "Premium starter concentrate for broilers"
        indications:
          type: string
          nullable: true
          example: "Promotes early stage growth and immunity"
        targetSpecies:
          type: array
          items:
            type: string
          example: ["Broiler", "Poultry"]
        physicalForm:
          type: string
          nullable: true
          example: "Powder"
        appearance:
          type: string
          nullable: true
          example: "Yellowish-brown powder"
        activeIngredients:
          type: array
          nullable: true
          items:
            $ref: '#/components/schemas/ActiveIngredient'
        dosage:
          type: string
          nullable: true
          example: "50 kg per ton of feed"
        mixingInstructions:
          type: string
          nullable: true
          example: "Mix thoroughly with yellow corn and soybean meal"
        withdrawalPeriod:
          type: string
          nullable: true
          example: "5 days before slaughter"
        contraindications:
          type: string
          nullable: true
          example: "Do not feed to horses or other equids"
        userSafety:
          type: array
          items:
            type: string
          example: ["Wear protective mask", "Avoid direct contact with eyes"]
        storage:
          type: string
          nullable: true
          example: "Store in a cool, dry place"
        packaging:
          type: string
          nullable: true
          example: "25KG Bag"
        registrationNumber:
          type: string
          nullable: true
          example: "REG-2026-9876"
        origin:
          type: string
          nullable: true
          example: "Egypt"
        producer:
          type: string
          nullable: true
          example: "Addvet Egypt"
        specifications:
          $ref: '#/components/schemas/ProductSpecification'
          nullable: true
        categoryId:
          type: string
          format: uuid
          nullable: true
          example: "c2d3e4f5-a6b7-8901-cdef-012345678901"

    UpdateProductBody:
      type: object
      properties:
        name:
          type: string
          minLength: 2
          example: "BSC 5% Premium"
        productCode:
          type: string
          nullable: true
          example: "BSC-005-PREM"
        description:
          type: string
          nullable: true
          example: "Updated product description"
        indications:
          type: string
          nullable: true
          example: "Updated indications"
        targetSpecies:
          type: array
          items:
            type: string
          example: ["Broiler"]
        physicalForm:
          type: string
          nullable: true
          example: "Granules"
        appearance:
          type: string
          nullable: true
          example: "Light brown granules"
        activeIngredients:
          type: array
          nullable: true
          items:
            $ref: '#/components/schemas/ActiveIngredient'
        dosage:
          type: string
          nullable: true
          example: "40 kg per ton of feed"
        mixingInstructions:
          type: string
          nullable: true
          example: "Updated mixing instructions"
        withdrawalPeriod:
          type: string
          nullable: true
          example: "3 days before slaughter"
        contraindications:
          type: string
          nullable: true
          example: "None"
        userSafety:
          type: array
          items:
            type: string
          example: ["Wear gloves"]
        storage:
          type: string
          nullable: true
          example: "Store below 30C"
        packaging:
          type: string
          nullable: true
          example: "50KG Bag"
        registrationNumber:
          type: string
          nullable: true
          example: "REG-2026-9876-V2"
        origin:
          type: string
          nullable: true
          example: "Egypt"
        producer:
          type: string
          nullable: true
          example: "Addvet Egypt"
        specifications:
          $ref: '#/components/schemas/ProductSpecification'
          nullable: true
        categoryId:
          type: string
          format: uuid
          nullable: true
          example: "c2d3e4f5-a6b7-8901-cdef-012345678901"

    Subscription:
      type: object
      properties:
        id:
          type: string
          format: uuid
          example: "e1b2c3d4-e5f6-7890-abcd-ef1234567890"
        companyId:
          type: string
          format: uuid
          example: "b2c3d4e5-f6a7-8901-bcde-f12345678901"
        company:
          type: object
          properties:
            id:
              type: string
              format: uuid
            name:
              type: string
            username:
              type: string
          example:
            id: "b2c3d4e5-f6a7-8901-bcde-f12345678901"
            name: "Acme Corp"
            username: "acme_corp"
        planId:
          type: string
          format: uuid
          example: "c1b2c3d4-e5f6-7890-abcd-ef1234567890"
        plan:
          type: object
          properties:
            id:
              type: string
              format: uuid
            name:
              type: string
            price:
              type: string
            interval:
              type: string
          example:
            id: "c1b2c3d4-e5f6-7890-abcd-ef1234567890"
            name: "Enterprise"
            price: "99.99"
            interval: "month"
        startDate:
          type: string
          format: date-time
          example: "2026-06-11T10:00:00.000Z"
        endDate:
          type: string
          format: date-time
          example: "2026-07-11T10:00:00.000Z"
        status:
          type: string
          enum: [active, expired, cancelled]
          example: "active"
        createdAt:
          type: string
          format: date-time
          example: "2026-06-11T10:00:00.000Z"
        updatedAt:
          type: string
          format: date-time
          example: "2026-06-11T10:00:00.000Z"

    CreateSubscriptionBody:
      type: object
      required:
        - companyId
        - planId
      properties:
        companyId:
          type: string
          format: uuid
          example: "b2c3d4e5-f6a7-8901-bcde-f12345678901"
        planId:
          type: string
          format: uuid
          example: "c1b2c3d4-e5f6-7890-abcd-ef1234567890"
        startDate:
          type: string
          format: date-time
          example: "2026-06-11T10:00:00.000Z"
        endDate:
          type: string
          format: date-time
          example: "2026-07-11T10:00:00.000Z"
        status:
          type: string
          enum: [active, expired, cancelled]
          example: "active"

    UpdateSubscriptionBody:
      type: object
      properties:
        planId:
          type: string
          format: uuid
          example: "c1b2c3d4-e5f6-7890-abcd-ef1234567890"
        endDate:
          type: string
          format: date-time
          example: "2026-08-11T10:00:00.000Z"
        status:
          type: string
          enum: [active, expired, cancelled]
    CreateCategoryBody:
      type: object
      required:
        - name
      properties:
        name:
          type: string
          minLength: 2
          maxLength: 50
          example: "CONCENTRATES"

    UpdateCategoryBody:
      type: object
      required:
        - name
      properties:
        name:
          type: string
          minLength: 2
          maxLength: 50
          example: "VITAMINS"

    Template:
      type: object
      required:
        - id
        - name
        - type
        - htmlContent
      properties:
        id:
          type: string
          format: uuid
          example: "f1b2c3d4-e5f6-7890-abcd-ef1234567890"
        name:
          type: string
          example: "Standard Catalog Template"
        type:
          type: string
          example: "catalog"
        htmlContent:
          type: string
          example: "<html><body>...</body></html>"
        brandId:
          type: string
          format: uuid
          nullable: true
          example: "d810cf7f-57ce-4d84-b1b1-c3a782893072"
        companyId:
          type: string
          format: uuid
          nullable: true
          example: "b2c3d4e5-f6a7-8901-bcde-f12345678901"
        isActive:
          type: boolean
          example: true
        createdAt:
          type: string
          format: date-time
          example: "2026-06-14T10:00:00.000Z"
        updatedAt:
          type: string
          format: date-time
          example: "2026-06-14T12:00:00.000Z"

    CreateTemplateBody:
      type: object
      required:
        - name
        - type
        - htmlContent
      properties:
        name:
          type: string
          minLength: 2
          example: "Standard Catalog Template"
        type:
          type: string
          minLength: 2
          example: "catalog"
        htmlContent:
          type: string
          example: "<html><body>...</body></html>"
        brandId:
          type: string
          format: uuid
          nullable: true
          example: "d810cf7f-57ce-4d84-b1b1-c3a782893072"
        isActive:
          type: boolean
          example: true

    UpdateTemplateBody:
      type: object
      properties:
        name:
          type: string
          minLength: 2
          example: "Updated Template Name"
        type:
          type: string
          minLength: 2
          example: "manifest"
        htmlContent:
          type: string
          example: "<html><body>Updated content</body></html>"
        brandId:
          type: string
          format: uuid
          nullable: true
          example: "d810cf7f-57ce-4d84-b1b1-c3a782893072"
        isActive:
          type: boolean
          example: false

  parameters:
    UserId:
      name: id
      in: path
      required: true
      description: UUID of the user
      schema:
        type: string
        format: uuid
      example: "a1b2c3d4-e5f6-7890-abcd-ef1234567890"

    CompanyId:
      name: id
      in: path
      required: true
      description: UUID of the company
      schema:
        type: string
        format: uuid
      example: "b2c3d4e5-f6a7-8901-bcde-f12345678901"

    PlanId:
      name: id
      in: path
      required: true
      description: UUID of the plan
      schema:
        type: string
        format: uuid
      example: "c1b2c3d4-e5f6-7890-abcd-ef1234567890"

    ProductId:
      name: id
      in: path
      required: true
      description: UUID of the product
      schema:
        type: string
        format: uuid
      example: "d1b2c3d4-e5f6-7890-abcd-ef1234567890"

    PageParam:
      name: page
      in: query
      required: false
      description: Page number (starts from 1)
      schema:
        type: integer
        minimum: 1
        default: 1

    LimitParam:
      name: limit
      in: query
      required: false
      description: Number of items per page
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 10

    SortParam:
      name: sort
      in: query
      required: false
      description: "Sort fields. Use comma to separate. Prefix with - for descending. Example: -createdAt,name"
      schema:
        type: string
      example: "-createdAt"

    SearchParam:
      name: search
      in: query
      required: false
      description: "Search term matched against name, email, or username"
      schema:
        type: string
      example: "ahmed"

    SubscriptionId:
      name: id
      in: path
      required: true
      description: UUID of the subscription
      schema:
        type: string
      example: "e1b2c3d4-e5f6-7890-abcd-ef1234567890"

    CategoryId:
      name: id
      in: path
      required: true
      description: UUID of the category
      schema:
        type: string
        format: uuid
      example: "c2d3e4f5-a6b7-8901-cdef-012345678901"

    TemplateId:
      name: id
      in: path
      required: true
      description: UUID of the template
      schema:
        type: string
        format: uuid
      example: "f1b2c3d4-e5f6-7890-abcd-ef1234567890"

  responses:
    UserResponse:
      description: Single user response
      content:
        application/json:
          schema:
            type: object
            properties:
              status:
                type: string
                example: "success"
              data:
                type: object
                properties:
                  user:
                    $ref: '#/components/schemas/User'

    UsersListResponse:
      description: Paginated list of users
      content:
        application/json:
          schema:
            type: object
            properties:
              status:
                type: string
                example: "success"
              meta:
                type: object
                properties:
                  total:
                    type: integer
                    example: 50
                  page:
                    type: integer
                    example: 1
                  limit:
                    type: integer
                    example: 10
                  totalPages:
                    type: integer
                    example: 5
              data:
                type: object
                properties:
                  users:
                    type: array
                    items:
                      $ref: '#/components/schemas/User'

    CompanyResponse:
      description: Single company response
      content:
        application/json:
          schema:
            type: object
            properties:
              status:
                type: string
                example: "success"
              data:
                type: object
                properties:
                  company:
                    $ref: '#/components/schemas/Company'

    CompaniesListResponse:
      description: Paginated list of companies
      content:
        application/json:
          schema:
            type: object
            properties:
              status:
                type: string
                example: "success"
              meta:
                type: object
                properties:
                  total:
                    type: integer
                    example: 30
                  page:
                    type: integer
                    example: 1
                  limit:
                    type: integer
                    example: 10
                  totalPages:
                    type: integer
