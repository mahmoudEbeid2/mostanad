        - name
        - price
        - interval
      properties:
        name:
          type: string
          minLength: 2
          maxLength: 50
          example: "Enterprise"
        description:
          type: string
          nullable: true
          example: "Full access for large teams"
        price:
          type: number
          example: 99.99
        interval:
          type: string
          enum: [month, year]
          example: "month"
        features:
          type: array
          items:
            type: string
          example: ["unlimited certificates", "custom domains", "24/7 support"]

    UpdatePlanBody:
