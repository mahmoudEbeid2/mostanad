        before:
          description: The field's value before this change, of whatever type that field is. Absent/null if the field didn't previously exist.
        after:
          description: The field's value after this change, of whatever type that field is. Absent/null if the field was removed.

    LabelPatchChange:
      type: object
      description: One change in a PATCH /labels/:id or chat-proposed patch.
      required:
        - path
        - op
      properties:
        path:
          type: string
          description: Dot/bracket path into labelSchema, e.g. "activeIngredients[0].amount". Top segment must be a real labelSchema field.
        op:
          type: string
          enum: [replace, append, remove, insert]
        value:
          description: Required for every op except "remove".

    PatchConflict:
      type: object
      description: >-
        Returned with HTTP 409 when a proposed patch would introduce a NEW
        validation failure that didn't exist before the patch. The outer
        response envelope's `status` stays "success" — branch on this
        object's own `status` field, which is "conflict".
      properties:
        status:
          type: string
          enum: [conflict]
        proposedPatch:
          type: object
          description: Only present on the chat conflict shape (not the direct PATCH conflict shape).
          properties:
            rationale:
              type: string
            changes:
              type: array
              items:
                $ref: '#/components/schemas/LabelPatchChange'
        wouldViolate:
          type: array
          items:
            type: object
            properties:
              ruleKey:
                type: string
                nullable: true
              message:
                type: string
              citation:
                type: string
                nullable: true
              path:
                type: string
        options:
          type: array
          items:
            type: string
          description: >-
            Plain strings, not objects: "cancel", one "apply_and_fix:<path>"
            per newly-failing path, then "apply_anyway_with_override" last.
          example: ["cancel", "apply_and_fix:withdrawalPeriod", "apply_anyway_with_override"]

