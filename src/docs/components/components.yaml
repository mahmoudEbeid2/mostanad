components:
  schemas:
    User:
      type: object
      properties:
        id:
          type: string
          format: uuid
          example: "a1b2c3d4-e5f6-7890-abcd-ef1234567890"
        name:
          type: string
          example: "Ahmed Mohamed"
        email:
          type: string
          format: email
          example: "ahmed@example.com"
        username:
          type: string
          example: "ahmed_m"
        phone:
          type: string
          nullable: true
          example: "01012345678"
        isActive:
          type: boolean
          example: true
        createdAt:
          type: string
          format: date-time
          example: "2026-06-10T10:00:00.000Z"
        updatedAt:
          type: string
          format: date-time
          example: "2026-06-10T12:00:00.000Z"

    CreateUserBody:
      type: object
      required:
        - name
        - email
      properties:
        name:
          type: string
          minLength: 2
          maxLength: 100
          example: "Ahmed Mohamed"
        email:
          type: string
          format: email
          example: "ahmed@example.com"
        username:
          type: string
          minLength: 3
          maxLength: 30
          pattern: "^[a-zA-Z0-9_]+$"
          example: "ahmed_m"
        password:
          type: string
          minLength: 6
          example: "secret123"
        phone:
          type: string
          nullable: true
          example: "01012345678"

    UpdateUserBody:
      type: object
      properties:
        name:
          type: string
          minLength: 2
          maxLength: 100
          example: "Ahmed Updated"
        email:
          type: string
          format: email
          example: "updated@example.com"
        username:
          type: string
          minLength: 3
          maxLength: 30
          example: "ahmed_updated"
        password:
          type: string
          minLength: 6
          example: "newpassword123"
        phone:
          type: string
          nullable: true
          example: "01098765432"
        isActive:
          type: boolean
          example: false

    Company:
      type: object
      properties:
        id:
          type: string
          format: uuid
          example: "b2c3d4e5-f6a7-8901-bcde-f12345678901"
        name:
          type: string
          example: "Acme Corp"
        username:
          type: string
          example: "acme_corp"
        email:
          type: string
          format: email
          nullable: true
          example: "info@acme.com"
        phone:
          type: string
          nullable: true
          example: "01012345678"
        address:
          type: string
          nullable: true
          example: "123 Main St, Cairo, Egypt"
        logoUrl:
          type: string
          nullable: true
          example: "https://example.com/logos/acme.png"
        isActive:
          type: boolean
          example: true
        createdAt:
          type: string
          format: date-time
          example: "2026-06-10T10:00:00.000Z"
        updatedAt:
          type: string
          format: date-time
          example: "2026-06-10T12:00:00.000Z"

    CreateCompanyBody:
      type: object
      required:
        - name
        - username
        - password
      properties:
        name:
          type: string
          minLength: 2
          maxLength: 100
          example: "Acme Corp"
        username:
          type: string
          minLength: 3
          maxLength: 30
          pattern: "^[a-zA-Z0-9_]+$"
          example: "acme_corp"
        password:
          type: string
          minLength: 6
          example: "secret123"
        email:
          type: string
          format: email
          nullable: true
          example: "info@acme.com"
        phone:
          type: string
          nullable: true
          example: "01012345678"
        address:
          type: string
          nullable: true
          example: "123 Main St, Cairo, Egypt"
        logoUrl:
