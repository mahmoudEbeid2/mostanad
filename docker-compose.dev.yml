services:
  mostanad-app:
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=development
    volumes:
      - ./src:/app/src
      - ./swagger.js:/app/swagger.js
      - ./uploads:/app/uploads

  catalog-worker:
    environment:
      - NODE_ENV=development
    volumes:
      - ./src:/app/src
      - ./uploads:/app/uploads

  label-worker:
    environment:
      - NODE_ENV=development
    volumes:
      - ./src:/app/src
      - ./uploads:/app/uploads

  eda-worker:
    environment:
      - NODE_ENV=development
    volumes:
      - ./src:/app/src
      - ./uploads:/app/uploads

  reference-label-worker:
    environment:
      - NODE_ENV=development
    volumes:
      - ./src:/app/src
      - ./uploads:/app/uploads

  email-worker:
    environment:
      - NODE_ENV=development
    volumes:
      - ./src:/app/src
      - ./uploads:/app/uploads

  certificate-template-worker:
    environment:
      - NODE_ENV=development
    volumes:
      - ./src:/app/src
      - ./uploads:/app/uploads

  # Certificates V2 (plan §5.2): generation now; PDF/ZIP export in Phase 5.
  certificate-render-worker:
    environment:
      - NODE_ENV=development
    volumes:
      - ./src:/app/src
      - ./uploads:/app/uploads

  invoice-worker:
    environment:
      - NODE_ENV=development
    volumes:
      - ./src:/app/src
      - ./uploads:/app/uploads

  # Exposed on the host so `npm run dev:all` (outside Docker) can reach it:
  # set PDF2HTMLEX_URL=http://localhost:5050 in .env for that mode.
  pdf2htmlex:
    ports:
      - "5050:5000"

  postgres:
    ports:
      - "5432:5432"

  redis:
    ports:
      - "6379:6379"

  pgweb:
    image: sosedoff/pgweb
    container_name: pgweb
    restart: always
    ports:
      - "8081:8081"
    environment:
      - PGWEB_DATABASE_URL=postgresql://mostanad_app:${POSTGRES_PASSWORD}@postgres:5432/mostanad_app?sslmode=disable
      - PGWEB_AUTH_USER=${PGWEB_AUTH_USER}
      - PGWEB_AUTH_PASS=${PGWEB_AUTH_PASS}
    depends_on:
      postgres:
        condition: service_healthy
